<!doctype html><html lang="sk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FacelessFactory — Centrála</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2322c55e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{
  --bg:#0a0d14; --bg2:#0d1119; --panel:#11161f; --panel2:#141b26;
  --bd:#1e2733; --bd2:#283342; --tx:#e6edf3; --mut:#8b97a8; --mut2:#6b778a;
  --acc:#3b82f6; --yt:#ff4d4f; --tk:#fe2c55; --ig:#e1306c; --ok:#22c55e;
  --font:'Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --r:12px; --s1:8px; --s2:12px; --s3:16px; --s4:24px;
  --lift:0 16px 36px -20px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.02);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 70% -10%,#13203a22,transparent),var(--bg);
  color:var(--tx);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::selection{background:#3b82f655}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1340px;margin:0 auto;padding:var(--s4) var(--s4) 64px}
header{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}
h1{font-size:24px;font-weight:750;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.sub{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--bd2);color:var(--tx);border-radius:10px;
  padding:10px 16px;font:600 14px/1.25 var(--font);cursor:pointer;display:inline-flex;gap:8px;align-items:center;
  transition:background-color .15s,border-color .15s,box-shadow .15s}
.btn:hover{background:#1b2433;border-color:#39465a}
.btn.acc{background:var(--acc);border-color:var(--acc);box-shadow:0 8px 20px -10px #3b82f6cc} .btn.acc:hover{background:#2f6fd8}
.btn:disabled{opacity:.75;cursor:progress}
/* taby = segmentovy ovladac (pill); aktivny tab svieti akcentom */
.tabs{display:flex;gap:4px;margin-bottom:var(--s4);flex-wrap:wrap;width:fit-content;max-width:100%;padding:4px;
  background:var(--bg2);border:1px solid var(--bd);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
.tab{background:transparent;border:1px solid transparent;color:var(--mut);border-radius:10px;
  padding:8px 14px;font:600 14px/1.25 var(--font);cursor:pointer;white-space:nowrap;
  transition:color .15s,background-color .15s,border-color .15s,box-shadow .15s}
.tab:hover{color:var(--tx);background:rgba(255,255,255,.04)}
.tab.on{color:#fff;background:linear-gradient(180deg,#1f2d4a,#162038);border-color:#3b82f666;
  box-shadow:0 0 0 1px #3b82f626,0 8px 22px -10px #3b82f6c0,inset 0 1px 0 rgba(255,255,255,.07)}
.grid{display:grid;gap:var(--s3)}
.k4{grid-template-columns:repeat(4,1fr)} .k3{grid-template-columns:repeat(3,1fr)} .k2{grid-template-columns:repeat(2,1fr)}
.wsplit{display:grid;grid-template-columns:1.6fr 1fr;gap:var(--s3)}
@media(max-width:900px){.k4,.k3{grid-template-columns:repeat(2,1fr)}.k2,.wsplit{grid-template-columns:1fr}}
@media(max-width:600px){
  .wrap{padding:var(--s3) var(--s2) 48px}
  .k4,.k3,.k2,.wsplit{grid-template-columns:1fr}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:var(--s3);width:100%;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto}
  header{gap:10px}
  h1{font-size:21px}
  .kpi .big{font-size:42px}
  .card{overflow-x:auto}
  .bars .row{grid-template-columns:92px 1fr 50px;gap:8px}
  #refresh{padding:9px 13px}
}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--bd);border-radius:var(--r);padding:var(--s3);
  transition:border-color .2s,box-shadow .2s,transform .2s}
.card:hover{border-color:var(--bd2);box-shadow:var(--lift)}
.card.kpi:hover,a.card:hover{transform:translateY(-1px)}
.kpi .lab{color:var(--mut);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .big{font-size:48px;font-weight:800;letter-spacing:-.035em;margin-top:var(--s1);line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .sm{color:var(--mut);font-size:13.5px;margin-top:var(--s1)}
.dl{font-size:14px;font-weight:700;margin-top:var(--s1);font-variant-numeric:tabular-nums}
.dl.dlu{color:var(--ok)} .dl.dld{color:#ef4444} .dl.dl0{color:var(--mut2);font-weight:600}
.dchip{display:inline-block;font-size:12px;font-weight:800;padding:1px 7px;border-radius:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dchip.dlu{color:var(--ok);background:#22c55e1f} .dchip.dld{color:#ef4444;background:#ef44441f}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:13px;font-weight:700}
h2{font-size:16.5px;font-weight:700;letter-spacing:-.01em;margin-bottom:var(--s2);display:flex;align-items:center;gap:8px}
h2 small{color:var(--mut);font-weight:500;font-size:13px;letter-spacing:0}
.bars .row{display:grid;grid-template-columns:130px 1fr 64px;align-items:center;gap:var(--s2);margin:var(--s1) 0}
.bars .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .track{height:10px;background:#0c1018;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}
.bars .fill{height:100%;border-radius:6px;transition:width .6s}
.bars .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut);font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--mut2);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:var(--s1) var(--s2);border-bottom:1px solid var(--bd)}
th.n{text-align:right}
td{padding:var(--s2);border-bottom:1px solid #131a25}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#0e1520}
.rk{color:var(--mut2);width:24px}
#winners td:nth-child(4){white-space:nowrap}                          /* "📸 Instagram" na jednom riadku */
#factories span[style*="width:74px"]{min-width:112px;white-space:nowrap}  /* "📺 YouTube" v kartách fabrík na jednom riadku */
.tag{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--bd2);cursor:pointer;color:var(--mut);
  transition:color .15s,border-color .15s,background-color .15s}
.chip:hover{color:var(--tx);border-color:#39465a}
.chip.on{color:#fff;border-color:transparent}
.muted{color:var(--mut)}
select,input,textarea{background:var(--bg2);border:1px solid var(--bd2);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit;font-size:13px}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--acc)}
select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #3b82f670;outline-offset:1px}
.legend{display:flex;gap:var(--s3);flex-wrap:wrap;font-size:14.5px;font-weight:600;color:var(--tx);margin-top:var(--s2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:7px;vertical-align:middle}
.post{border:1px solid var(--bd);border-radius:var(--r);padding:var(--s2);margin-bottom:var(--s2);background:var(--panel)}
.post .cap{font-size:13px;margin-bottom:var(--s1)}
.cm{border-top:1px solid #131a25;padding:var(--s1) 0;display:flex;gap:var(--s1);flex-wrap:wrap;align-items:flex-start}
.cm .u{font-weight:700;font-size:12.5px;color:var(--ig)}
.cm .t{font-size:13px}
.reply{display:flex;gap:var(--s1);margin-top:6px;width:100%;flex-wrap:wrap}
.reply input{flex:1;min-width:160px}
.hide-tab{display:none}
.empty{color:var(--mut);text-align:center;padding:var(--s4);border:1px dashed var(--bd2);border-radius:var(--r)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
svg .gl{stroke:#1a2330;stroke-width:1}
svg text{fill:var(--mut);font-size:15px;font-family:var(--font)}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em;background:rgba(255,255,255,.05);padding:1px 5px;border-radius:5px}
@media(prefers-reduced-motion:reduce){.card,.tab,.btn,.chip,.bars .fill{transition:none}.card.kpi:hover,a.card:hover{transform:none}}
/* ---------------- 🌌 GALAXIA 3D ---------------- */
.gx{position:relative;width:100%;height:74vh;min-height:480px;border-radius:var(--r);overflow:hidden;border:1px solid var(--bd);
  background:radial-gradient(1200px 700px at 50% 42%,#0b1430 0%,#04060d 62%,#020309 100%);isolation:isolate;color:var(--tx)}
.gx-stage{position:absolute;inset:0;touch-action:none;cursor:grab;outline:none;-webkit-tap-highlight-color:transparent}
.gx-stage.drag{cursor:grabbing}.gx-stage.hov{cursor:pointer}
.gx-stage>canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.gx-labels{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.gx-lw{transition:opacity .22s ease}
.gx-lw.off{opacity:0}
.gx-lw.off .gx-lbl{pointer-events:none}
.gx-lbl{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 9px 5px;border-radius:8px;
  background:rgba(5,8,15,.66);border:1px solid rgba(255,255,255,.09);box-shadow:0 6px 16px -8px rgba(0,0,0,.9);
  font:600 12px/1.25 var(--font);color:#eef3fa;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6);
  transition:border-color .15s,background-color .15s}
.gx-lbl b{font-weight:650;display:flex;align-items:center;gap:6px;letter-spacing:-.005em}
.gx-lbl small{font:500 10.5px/1.25 var(--font);color:#9fb0c6;font-variant-numeric:tabular-nums}
.gx-lbl em{font-style:normal;color:#f5c26b}
.gx-dot{display:inline-block;width:7px;height:7px;border-radius:50%;box-shadow:0 0 8px currentColor;flex:none}
.gx-lbl.dim b{color:#aab4c3}.gx-lbl.dim .gx-dot{opacity:.55}
.gx-lbl.sun{background:rgba(38,22,6,.6);border-color:rgba(255,190,110,.3)}.gx-lbl.sun b{color:#ffd9a0}
.gx-lbl.hot{border-color:rgba(255,255,255,.38);background:rgba(12,18,30,.9)}
.gx-glass{background:rgba(10,14,22,.66);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);box-shadow:0 16px 40px -18px rgba(0,0,0,.85)}
.gx-top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:3;pointer-events:none}
.gx-top>*{pointer-events:auto}
.gx-sp{flex:1}
.gx-title{display:flex;align-items:center;gap:12px;padding:8px 12px;font-size:13px;min-width:0}
.gx-title b{font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.gx-sum{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-btn{color:var(--tx);font:600 13px/1 var(--font);padding:10px 12px;cursor:pointer;white-space:nowrap}
.gx-btn:hover{background:rgba(24,32,48,.85);border-color:rgba(255,255,255,.16)}
select.gx-jump{color:var(--tx);font:600 13px/1 var(--font);padding:9px 10px;cursor:pointer;max-width:220px}
select.gx-jump option{background:#0d1119;color:var(--tx)}
.gx-legend{position:absolute;left:12px;bottom:12px;z-index:3;padding:10px 12px;font-size:12px;line-height:1.5;color:#c3ccd9;display:grid;gap:4px;max-width:min(560px,calc(100% - 24px))}
.gx-legend .r{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-weight:600}
.gx-legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;box-shadow:0 0 6px currentColor}
.gx-legend .m{color:var(--mut);font-weight:500}
.gx-hint{position:absolute;right:12px;bottom:12px;z-index:2;font-size:11.5px;color:#6f7d92;pointer-events:none;text-align:right}
.gx-tip{position:absolute;left:0;top:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .12s;max-width:320px;padding:8px 10px;
  font-size:12.5px;line-height:1.45;background:rgba(8,11,18,.94);border:1px solid rgba(255,255,255,.1);border-radius:10px;box-shadow:0 10px 30px -10px #000}
.gx-tip.on{opacity:1}
.gx-tip .m{color:var(--mut)}
.gx-panel{position:absolute;top:64px;right:12px;bottom:12px;width:340px;z-index:4;overflow:auto;padding:16px;overscroll-behavior:contain;
  opacity:0;visibility:hidden;transform:translateX(16px);transition:opacity .25s ease,transform .25s ease,visibility 0s linear .25s}
.gx-panel.on{opacity:1;visibility:visible;transform:none;transition:opacity .25s ease,transform .25s ease}
.gx-ph{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.gx-ph .dot{width:12px;height:12px;border-radius:50%;margin-top:7px;flex:none;box-shadow:0 0 12px currentColor}
.gx-ph h3{font-size:18px;font-weight:750;letter-spacing:-.02em;line-height:1.25;overflow-wrap:anywhere}
.gx-ph .n{color:var(--mut);font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.gx-x{margin-left:auto;flex:none;background:transparent;border:1px solid var(--bd2);color:var(--mut);border-radius:8px;width:32px;height:32px;
  cursor:pointer;font:400 20px/1 var(--font)}
.gx-x:hover{color:var(--tx);border-color:#39465a;background:rgba(255,255,255,.04)}
.gx-chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.gx-chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--mut);white-space:nowrap}
.gx-chip.ok{background:#22c55e1f;color:#4ade80}.gx-chip.warn{background:#f59e0b1f;color:#fbbf24}.gx-chip.bad{background:#ef44441f;color:#f87171}
.gx-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gx-kpi{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;min-width:0}
.gx-kpi span{display:block;color:var(--mut);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.gx-kpi b{display:block;font-size:18px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.gx-sec{font-size:11px;font-weight:700;color:var(--mut2);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px}
.gx-prow{display:grid;grid-template-columns:1fr auto auto 20px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.06);
  font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.gx-prow .pi{display:flex;align-items:center;gap:8px;white-space:nowrap}
.gx-prow .pi::before{content:'';width:10px;height:3px;border-radius:2px;background:var(--c);box-shadow:0 0 6px var(--c)}
.gx-prow small{color:var(--mut);font-size:11px;font-weight:500}
.gx-prow a{color:var(--mut);text-align:center;border-radius:6px}.gx-prow a:hover{color:var(--tx)}
.gx-st{font-size:13px;margin-bottom:4px;line-height:1.45}
.gx-kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0}
.gx-kv span{color:var(--mut)}.gx-kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}.gx-kv b.bad{color:#f87171}
.gx-vids{list-style:none;display:grid;gap:2px}
.gx-vids a{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;font-size:12.5px}
.gx-vids a:hover{background:rgba(255,255,255,.05)}
.gx-vids .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-vids .v{color:var(--mut);font-variant-numeric:tabular-nums;font-weight:600}
.gx-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mut);font-size:14px;z-index:6;
  pointer-events:none;transition:opacity .45s ease}
.gx-load.done{opacity:0}
@media(max-width:720px){
  .gx-panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:52%;transform:translateY(16px)}
  .gx-legend,.gx-hint{display:none}
  .gx-top{top:8px;left:8px;right:8px}
  .gx-sum,.gx-rt{display:none}
  select.gx-jump{max-width:150px;min-width:0}
}
@media(prefers-reduced-motion:reduce){.gx-panel,.gx-panel.on,.gx-lw,.gx-tip,.gx-load,.gx-lbl{transition:none}}
</style></head>
<body><div class="wrap">
<header>
  <h1><span class="dot" aria-hidden="true"></span>FacelessFactory <span style="color:var(--mut);font-weight:500">Centrála</span></h1>
  <div class="spacer"></div>
  <span class="sub" id="updated" role="status">Načítavam…</span>
  <button class="btn acc" id="refresh" onclick="refresh(true)">↻ Obnoviť dáta</button>
</header>

<div class="tabs" role="tablist" aria-label="Sekcie dashboardu">
  <button class="tab on" role="tab" aria-selected="true" aria-controls="overview" id="tabbtn_overview" data-t="overview">📊 Prehľad</button>
  <button class="tab" role="tab" aria-selected="false" aria-controls="galaxy" id="tabbtn_galaxy" data-t="galaxy">🌌 Galaxia</button>
  <button class="tab" role="tab" aria-selected="false" aria-controls="growth" id="tabbtn_growth" data-t="growth">📈 Rast &amp; rady</button>
  <button class="tab" role="tab" aria-selected="false" aria-controls="platforms" id="tabbtn_platforms" data-t="platforms">📱 Platformy</button>
  <button class="tab" role="tab" aria-selected="false" aria-controls="winners" id="tabbtn_winners" data-t="winners">🏆 Víťazi</button>
  <button class="tab" role="tab" aria-selected="false" aria-controls="factories" id="tabbtn_factories" data-t="factories">🏭 Fabriky</button>
  <button class="tab" role="tab" aria-selected="false" aria-controls="comments" id="tabbtn_comments" data-t="comments">💬 Komentáre</button>
  <button class="tab" role="tab" aria-selected="false" aria-controls="docs" id="tabbtn_docs" data-t="docs">🎬 Dokumenty</button>
  <button class="tab" role="tab" aria-selected="false" aria-controls="lumora" id="tabbtn_lumora" data-t="lumora">🌙 Lumora</button>
  <button class="tab" role="tab" aria-selected="false" aria-controls="spotify" id="tabbtn_spotify" data-t="spotify">🎧 Spotify</button>
  <button class="tab" role="tab" aria-selected="false" aria-controls="episodary" id="tabbtn_episodary" data-t="episodary">📺 Episodary</button>
</div>

<section id="overview" role="tabpanel" aria-labelledby="tabbtn_overview"><div class="empty"><span class="spin" aria-hidden="true"></span> Načítavam dáta…</div></section>
<section id="galaxy" class="hide-tab" role="tabpanel" aria-labelledby="tabbtn_galaxy"></section>
<section id="growth" class="hide-tab" role="tabpanel" aria-labelledby="tabbtn_growth"></section>
<section id="factories" class="hide-tab" role="tabpanel" aria-labelledby="tabbtn_factories"></section>
<section id="winners" class="hide-tab" role="tabpanel" aria-labelledby="tabbtn_winners"></section>
<section id="platforms" class="hide-tab" role="tabpanel" aria-labelledby="tabbtn_platforms"></section>

</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const PC={youtube:'#ff4d4f',tiktok:'#fe2c55',instagram:'#e1306c'};
const PN={youtube:'YouTube',tiktok:'TikTok',instagram:'Instagram'};
const PI={youtube:'📺',tiktok:'🎵',instagram:'📸'};
let DATA=null, HIST=[];
const fmt=n=>n==null?'—':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':(''+Math.round(n));
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dur=s=>{s=Math.round(s||0);const m=Math.floor(s/60),x=s%60;return m+':'+(''+x).padStart(2,'0');};
// jednotny format dátumov naprieč celym dashboardom: 'YYYY-MM-DD' -> 'DD.MM.YYYY' (rovnaky styl ako gen_at zo servera)
const fmtDate=iso=>{if(!iso)return '—';const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso);return m?`${m[3]}.${m[2]}.${m[1]}`:iso;};
const fmtDateShort=iso=>{if(!iso)return '';const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso);return m?`${m[3]}.${m[2]}`:iso;};
function prevDay(){return HIST.length>=2?HIST[HIST.length-2]:null;}   // snapshot z predoslého dňa
function _todayStr(){return new Date().toISOString().slice(0,10);}
function lastRowBefore(dateStr){const rows=(HIST||[]).filter(h=>!h.gap&&h.date<dateStr);return rows.length?rows[rows.length-1]:null;}
function todayGain(fn){   // dnes = ZIVE cisla minus vcerajsi (23:59) zapis — presne ucty, ziadne odhady
  const t=DATA&&DATA.totals; const base=lastRowBefore(_todayStr());
  if(!t||!base)return null;
  const d=Math.round(fn(t)-fn(base));
  return Math.abs(d)>50000?null:d;   // 8/12 prechod na celokanalove pocitadlo: stary zapis je o ~130k nizsie -> 1. den bez chipu (od zajtra presne)
}
function todayChip(fn,noNeg){
  const d=todayGain(fn);
  if(d==null)return '<div class="dl dl0">dnes: —</div>';
  const v=noNeg?Math.max(0,d):d;
  if(v===0)return '<div class="dl dl0">dnes +0</div>';
  return `<div class="dl ${v>0?'dlu':'dld'}">dnes ${v>0?'+':'−'}${fmt(Math.abs(v))}</div>`;
}
/* PART 2 (od 28.9.2026): zhliadnutia = prirastok od PRVEHO zapisu novej fabriky (server servuje historiu
   len od DASH_HISTORY_START). Celkove (lifetime) cislo ostava v malom texte — YouTube ho po zmazani videi nenuluje. */
function part2Base(){const rows=(HIST||[]);const ok=rows.filter(h=>!h.gap);return ok[0]||rows[0]||null;}
function part2Gain(fn){const t=DATA&&DATA.totals,b=part2Base();if(!t||!b)return null;return Math.max(0,Math.round(fn(t)-fn(b)));}
function part2Label(){const b=part2Base();if(!b)return 'od štartu';const p=b.date.split('-');return `od ${+p[2]}.${+p[1]}.`;}
function dchip(cur,prev,noNeg){   // maly inline odznak (platformy/fabriky). noNeg=true -> kumulativna
  if(cur==null||prev==null)return '';   // metrika (views/lajky): nemoze klesnut, tak zapornu zmenu
  const d=cur-prev;                     // (= neuplny zber, nie realny pokles) vobec neukazuj.
  if(d===0||(noNeg&&d<0))return '';
  const up=d>0;return ` <span class="dchip ${up?'dlu':'dld'}">${up?'▲+':'▼−'}${fmt(Math.abs(d))}</span>`;
}
/* jednotne vysvetlenie casu (user chce: co mame + od kedy + ci je zmena od obnovenia alebo od 00:00) */
const baselineNote=()=>'';
const userFac=u=>{const p=DATA.projects.find(p=>p.instagram&&p.instagram.handle===u);return p?{name:p.name,color:p.color}:{name:u,color:'#888'};};
function barChart(items,h=260){
  const W=760,H=h,pad={l:52,r:14,t:16,b:40},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const mx=Math.max(1,...items.map(i=>i.v)),n=items.length;
  const bw=Math.min(120,iw/n*0.55),gap=iw/n;
  let g='';for(let k=0;k<=4;k++){const y=pad.t+ih*k/4;g+=`<line class="gl" x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}"/><text x="${pad.l-6}" y="${y+3}" text-anchor="end">${fmt(mx*(4-k)/4)}</text>`;}
  let bars=items.map((it,i)=>{const x=pad.l+gap*i+gap/2-bw/2,bh=ih*(it.v/mx),y=pad.t+ih-bh;
    const est=it.est?` fill-opacity="0.38" stroke="${it.c}" stroke-width="1.5" stroke-dasharray="4 3"`:'';
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2,bh).toFixed(1)}" rx="5" fill="${it.c}"${est}/>`+
      `<text x="${(x+bw/2).toFixed(1)}" y="${y-5}" text-anchor="middle" fill="#cdd7e6" style="font-size:11px;font-weight:700">${it.est?'~':''}${fmt(it.v)}</text>`+
      `<text x="${(x+bw/2).toFixed(1)}" y="${H-12}" text-anchor="middle">${it.n}</text>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}${bars}</svg>`;
}

function allVids(){return DATA.projects.flatMap(p=>p.videos);}
function pViews(p,plat){return p.videos.filter(v=>(v.platform||'').toLowerCase()===plat).reduce((s,v)=>s+(v.views||0),0);}
function facViews(p){return p.videos.reduce((s,v)=>s+(v.views||0),0);}
/* RAW: per-kanal ukazujeme IBA realne zhliadnutia videi z API (ziadny odhad ani „held"/max z historie).
   Ked API cislo nedava (napr. TikTok per-video views), je to proste 0 — nic sa nedomysla. */
function pvHeld(p,plat){return pViews(p,plat);}
function facFollowers(p){return (p.yt?.subs||0)+(p.tiktok?.followers||0)+(p.instagram?.followers||0);}

/* ---- jednoduchy SVG ciarovy graf (viac serii, auto-scale) ---- */
function lineChart(series, dates, h=250){
  const W=760, H=h, pad={l:52,r:16,t:16,b:30};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const n=dates.length;
  const maxY=Math.max(1,...series.flatMap(s=>s.pts));
  const X=i=>pad.l+(n<=1?iw/2:iw*i/(n-1));
  const Y=v=>pad.t+ih-ih*(v/maxY);
  let g='';
  for(let k=0;k<=4;k++){const y=pad.t+ih*k/4;g+=`<line class="gl" x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}"/>`+
    `<text x="${pad.l-6}" y="${y+3}" text-anchor="end">${fmt(maxY*(4-k)/4)}</text>`;}
  let paths=series.map(s=>{
    if(n===1){return `<circle cx="${X(0)}" cy="${Y(s.pts[0])}" r="3.5" fill="${s.c}"/>`;}
    const d=s.pts.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round"/>`+
      `<circle cx="${X(n-1)}" cy="${Y(s.pts[n-1])}" r="3" fill="${s.c}"/>`;
  }).join('');
  const xl=n?`<text x="${X(0)}" y="${H-6}" text-anchor="start">${fmtDateShort(dates[0])}</text>`+
    (n>1?`<text x="${X(n-1)}" y="${H-6}" text-anchor="end">${fmtDateShort(dates[n-1])}</text>`:''):'';
  const leg=`<div class="legend">`+series.map(s=>`<span><i style="background:${s.c}"></i>${s.name}</span>`).join('')+`</div>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}${paths}${xl}</svg>${leg}`;
}

/* ---- denne stlpce: rozdiely dennych (23:59) zapisov — presne ucty, ziadne odhady ---- */
const totViews=h=>(h.yt_views||0)+(h.ig_views||0);   // TikTok zhliadnutia API nedava
const totFoll=h=>(h.yt_subs||0)+(h.tk_foll||0)+(h.ig_foll||0);
function dailyBars(fn,color){
  const today=_todayStr();
  const rows=(HIST||[]).filter(h=>!h.gap&&h.date<today);
  const items=[];
  for(let i=1;i<rows.length;i++){
    const days=Math.max(1,Math.round((new Date(rows[i].date)-new Date(rows[i-1].date))/864e5));
    const v=Math.round((fn(rows[i])-fn(rows[i-1]))/days);
    if(Math.abs(v)>50000)continue;   // preskoc jednorazovy skok z prechodu na celokanalove pocitadlo (8/12)
    items.push({n:rows[i].date.slice(5),c:color,v:Math.max(0,v)});
  }
  const d=todayGain(fn);
  if(d!=null)items.push({n:'dnes',c:color,v:Math.max(0,d)});
  if(!items.length)return '<div class="empty">Stĺpce sa objavia po prvom dennom zápise.</div>';
  return barChart(items.slice(-13))+'<div class="muted" style="font-size:11px;margin-top:6px">Rozdiely denných zápisov (23:59) · „dnes" = zatiaľ od polnoci.</div>';
}

/* ---------------- PREHLAD ---------------- */
function renderOverview(){
  const t=DATA.totals;
  const foll=t.yt_subs+t.tk_foll+t.ig_foll;
  const views=t.yt_views+t.ig_views;   // Zhliadnutia = YT+IG (TikTok per-video views zakl. API nedava)
  const vids=allVids().length;
  const kpis=[
    ['Sledovatelia',fmt(foll),`YT ${fmt(t.yt_subs)} · TT ${fmt(t.tk_foll)} · IG ${fmt(t.ig_foll)}`,todayChip(totFoll)],
    ['Zhliadnutia (YT+IG)',fmt(part2Gain(totViews)),`${part2Label()} · celkovo ${fmt(views)} (YT ${fmt(t.yt_views)} · IG ${fmt(t.ig_views)})`,todayChip(totViews,true)],
    ['Videá / príspevky',fmt(vids),'',todayChip(h=>h.videos||0,true)],
    ['Fabriky',t.factories,'',''],
  ];
  // per-platforma denne prirastky sledovatelov (rozdiely 23:59 zapisov + zivy 'dnes')
  function perDay(key){
    const today=_todayStr(); const rows=(HIST||[]).filter(h=>!h.gap&&h.date<today);
    const out=[];
    for(let i=1;i<rows.length;i++){
      const days=Math.max(1,Math.round((new Date(rows[i].date)-new Date(rows[i-1].date))/864e5));
      const v=Math.round(((rows[i][key]||0)-(rows[i-1][key]||0))/days);
      if(Math.abs(v)>50000)continue;
      out.push({n:rows[i].date.slice(8,10)+'.',v:Math.max(0,v)});
    }
    const base=lastRowBefore(today);
    if(base&&DATA.totals){const d=Math.round((DATA.totals[key]||0)-(base[key]||0));if(Math.abs(d)<=50000)out.push({n:'dnes',v:Math.max(0,d),live:1});}
    return out.slice(-21);
  }
  function miniGain(items,color){
    if(items.length<2)return '<div class="muted" style="font-size:12px;padding:18px 0">grafy sa naplnia dennymi zápismi</div>';
    const W=560,H=120,bw=Math.min(20,W/items.length*0.6),gap=W/items.length;
    const mx=Math.max(1,...items.map(i=>i.v));
    const bars=items.map((it,i)=>{const x=gap*i+gap/2-bw/2,bh=(H-34)*(it.v/mx),y=H-20-bh;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2,bh).toFixed(1)}" rx="3" fill="${color}"${it.live?'':' fill-opacity="0.5"'}/>`+
        ((it.live||i===0||i===items.length-1||it.v===mx)?`<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" style="font-size:10px" fill="#8b97a8">${it.n}</text>`:'')+
        (it.v===mx||it.live?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" style="font-size:10.5px;font-weight:700" fill="#cdd7e6">${it.v?'+'+fmt(it.v):'0'}</text>`:'');}).join('');
    return `<svg viewBox="0 0 ${W} ${H}" width="100%">${bars}</svg>`;
  }
  const igBanner=t.ig_blocked?`<div class="card" style="margin-bottom:16px;border-left:4px solid #f59e0b;background:#241d0e;font-size:14px">IG API nedostupné — IG čísla sú posledné známe.</div>`:'';
  // ALERT: len REALNE problemy (cervene/zlte); "Buffer nedostupny" (siva) NIE JE poplach
  const sick=DATA.projects.map(p=>({p,h:facHealth(p)})).filter(x=>x.h[0]==='🔴'||x.h[0]==='🟡');
  const healthBanner=sick.length?`<div class="card" style="margin-bottom:16px;border-left:4px solid #ef4444;background:#221012;font-size:14px;line-height:1.6">
    🚦 <b>Pozor — ${sick.length} ${sick.length===1?'fabrika potrebuje':'fabriky potrebujú'} pozornosť:</b> ${sick.map(x=>`<b style="color:${x.p.color}">${x.p.name}</b> (${x.h[1]})`).join(' · ')}
    <span class="muted">— detail v tabe Fabriky</span></div>`:'';
  $('#overview').innerHTML=`
    ${baselineNote()}${igBanner}${healthBanner}
    <div class="grid k4" style="margin-bottom:16px">${kpis.map(k=>`
      <div class="card kpi"><div class="lab">${k[0]}</div><div class="big">${k[1]}</div>
        ${k[3]}<div class="sm">${k[2]}</div></div>`).join('')}</div>
    <div class="grid k3">${[
      {lab:'Odberatelia',fk:'yt_subs',big:t.yt_subs,unit:'',sub:'noví odberatelia za deň'},
      {lab:'Zhliadnutia',fk:'yt_views',big:part2Gain(h=>h.yt_views||0),unit:'',sub:`zhliadnutia za deň · ${part2Label()} · celkovo ${fmt(t.yt_views)}`},
      {lab:'Lajky',fk:'yt_likes',big:t.yt_likes||0,unit:'',sub:'lajky za deň'},
    ].map(p=>`<div class="card" style="border-top:3px solid ${PC.youtube}">
      <h2 style="margin-bottom:6px"><span style="color:${PC.youtube}">${PI.youtube} YouTube</span> <small>${p.lab}</small></h2>
      <div style="font-size:40px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums">${fmt(p.big)}</div>
      ${todayChip(h=>h[p.fk]||0,true)}
      <div style="margin-top:10px">${miniGain(perDay(p.fk),PC.youtube)}</div>
      <div class="muted" style="font-size:11px">${p.sub}</div>
    </div>`).join('')}</div>`;
}

/* ---------------- RAST ---------------- */
function renderGrowth(){
  const t=DATA.totals;
  const _tdy=_todayStr(), _7ago=new Date(Date.now()-6*864e5).toISOString().slice(0,10);
  const pubToday=allVids().filter(v=>(v.published||'')===_tdy).length;
  const pub7=allVids().filter(v=>(v.published||'')>=_7ago).length;
  const cf=t.yt_subs+t.tk_foll+t.ig_foll, cv=t.yt_views+t.ig_views;
  const big=(lab,cur,chip,sub)=>`<div class="card kpi"><div class="lab">${lab}</div>
     <div class="big">${fmt(cur)}</div>${chip}<div class="sm">${sub}</div></div>`;
  const Y=lastRowBefore(_tdy)||null;
  const pchip=(cur,prev,noNeg)=>{ if(!Y)return '<span class="muted">—</span>';
    let d=Math.round((cur||0)-(prev||0)); if(noNeg)d=Math.max(0,d);
    return d===0?'<span class="muted">+0</span>':`<span class="dchip ${d>0?'dlu':'dld'}">${d>0?'+':'−'}${fmt(Math.abs(d))}</span>`; };
  const prow=k=>{const m={youtube:['yt_subs','yt_views','videní'],tiktok:['tk_foll','tk_likes','lajky'],instagram:['ig_foll','ig_views','videní']}[k];
    return `<div class="row" style="grid-template-columns:118px 1fr 1fr;gap:10px;margin:11px 0">
     <span class="nm" style="color:${PC[k]}">${PI[k]} ${PN[k]}</span>
     <span class="muted">sledov. ${pchip(t[m[0]],Y&&Y[m[0]])}</span>
     <span class="muted">${m[2]} ${pchip(t[m[1]],Y&&Y[m[1]],true)}</span></div>`;};
  $('#growth').innerHTML=`
    <div class="grid k3" style="margin-bottom:16px">
      ${big('Sledovatelia',cf,todayChip(totFoll),'zmena dnes od 00:00')}
      ${big('Zhliadnutia (YT+IG)',part2Gain(totViews),todayChip(totViews,true),`zmena dnes od 00:00 · ${part2Label()} · celkovo ${fmt(cv)}`)}
      ${big('Vydané dnes',pubToday,'',`${pub7} za 7 dní · spolu ${fmt(t.videos)} videí`)}
    </div>
    <div class="grid k2" style="margin-bottom:16px">
      <div class="card"><h2>Zhliadnutia za deň</h2>${dailyBars(totViews,'#22c55e')}</div>
      <div class="card"><h2>Sledovatelia za deň</h2>${dailyBars(totFoll,'#0ea5e9')}</div>
    </div>
    <div class="card bars"><h2>Dnes podľa platformy <small>od 00:00</small></h2>${['youtube','tiktok','instagram'].map(prow).join('')}</div>`;
}

/* ---------------- VITAZI ---------------- */
let winFilter='all';
function renderWinners(){
  let vids=allVids();
  if(winFilter!=='all') vids=vids.filter(v=>(v.platform||'').toLowerCase()===winFilter);
  vids=vids.slice().sort((a,b)=>(b.views||0)-(a.views||0));
  const facs=DATA.projects.map(p=>({name:p.name,color:p.color,
    views:winFilter==='all'?facViews(p):pViews(p,winFilter)})).sort((a,b)=>b.views-a.views);
  const mx=Math.max(1,...facs.map(f=>f.views));
  const chips=['all','youtube','tiktok','instagram'].map(f=>
    `<span class="chip ${winFilter===f?'on':''}" style="${winFilter===f?`background:${f==='all'?'var(--acc)':PC[f]}`:''}" onclick="winFilter='${f}';renderWinners()">${f==='all'?'🌐 Všetky':PI[f]+' '+PN[f]}</span>`).join('');
  const rows=vids.slice(0,20).map((v,i)=>`<tr>
    <td class="rk">${i+1}</td>
    <td><a href="${v.link||'#'}" target="_blank" rel="noopener noreferrer">${esc((v.title||'').slice(0,64))||'(bez názvu)'}</a></td>
    <td><span class="tag" style="background:${v.color}22;color:${v.color}">${v.factory}</span></td>
    <td><span class="muted">${PI[(v.platform||'').toLowerCase()]||''} ${v.platform}</span></td>
    <td class="n"><b>${fmt(v.views)}</b></td><td class="n">${fmt(v.likes)}</td><td class="n">${fmt(v.comments)}</td>
  </tr>`).join('')||`<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">Žiadne videá s dátami zatiaľ.</td></tr>`;
  $('#winners').innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">${chips}</div>
    <div class="wsplit">
      <div class="card"><h2>🎬 Najlepšie videá <small>podľa zhliadnutí</small></h2>
        <table><thead><tr><th>#</th><th>Video</th><th>Fabrika</th><th>Platforma</th><th class="n">Views</th><th class="n">Likes</th><th class="n">Kom.</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="card bars"><h2>🏭 Rebríček fabrík <small>zhliadnutia</small></h2>
        ${facs.map(f=>`<div class="row"><span class="nm" style="color:${f.color}">${f.name}</span>
          <div class="track"><div class="fill" style="width:${f.views/mx*100}%;background:${f.color}"></div></div>
          <span class="val">${fmt(f.views)}</span></div>`).join('')}</div>
    </div>`;
}

/* ---------------- PLATFORMY ---------------- */
function renderPlatforms(){
  const t=DATA.totals, PD=DATA.prev||{};   // ▲▼ = od posledného obnovenia (presne, žiaden odhad)
  const cols=[
    {k:'youtube',  foll:t.yt_subs, pf:PD.yt_subs, m2lab:'ZHLIADNUTIA '+part2Label().toUpperCase(), m2:part2Gain(h=>h.yt_views||0), m2raw:t.yt_views, pm2:PD.yt_views, barLab:'zhliadnutia videí',
     extra:`${DATA.projects.reduce((s,p)=>s+(p.yt?.videos||0),0)} videí · celkovo ${fmt(t.yt_views)} zhliadnutí`},
    {k:'tiktok',   foll:t.tk_foll, pf:PD.tk_foll, m2lab:'ZHLIADNUTIA', m2:t.tk_views, m2raw:t.tk_views, pm2:PD.tk_views, barLab:'zhliadnutia videí',
     extra:`${DATA.projects.reduce((s,p)=>s+(p.tiktok?.videos||0),0)} videí · ${fmt(t.tk_likes)} lajky`},
    {k:'instagram',foll:t.ig_foll, pf:PD.ig_foll, m2lab:'ZHLIADNUTIA '+part2Label().toUpperCase(), m2:part2Gain(h=>h.ig_views||0), m2raw:t.ig_views, pm2:PD.ig_views, barLab:'zhliadnutia videí',
     extra:`${t.ig_posts} príspevkov · celkovo ${fmt(t.ig_views)} zhliadnutí`},
  ];
  $('#platforms').innerHTML=`${baselineNote()}<div class="grid k3">${cols.map(c=>{
    const fac=DATA.projects.map(p=>({name:p.name,color:p.color,
      v:(c.k==='tiktok'?(p.tiktok?.views||0):pViews(p,c.k)),   // YT/IG per-video views; TikTok lifetime views (paginovane)
      f:c.k==='youtube'?(p.yt?.subs||0):c.k==='tiktok'?(p.tiktok?.followers||0):(p.instagram?.followers||0)}))
      .sort((a,b)=>b.v-a.v);
    const mx=Math.max(1,...fac.map(f=>f.v));
    if(c.k==='tiktok'){
      // TikTok karta: IBA zhliadnutia na kazdom ucte, nic ine (user request).

/* ---------------- FABRIKY ---------------- */
/* zdravie fabriky podla Buffer fronty: chyby -> cervena, prazdna fronta -> zlta.
   POZOR: Buffer API ma rate-limit (429) — ked data nie su (alive=false, nic sent),
   NEznamena to prazdnu frontu, len nedostupny stav -> siva, ziadny poplach. */
function facHealth(p){
  const noData=!p.alive&&!(p.sent>0)&&!p.last_sent;
  if(noData)return ['⚪','Buffer stav nedostupný v cloude (nastav BUFFER_TOKENS_JSON) alebo rate-limit',true];
  if((p.errors||0)>0)return ['🔴','chyby v Bufferi: '+p.errors];
  if((p.scheduled||0)===0)return ['🟡','fronta prázdna — nič nie je naplánované'];
  return ['🟢','fronta OK · čaká '+p.scheduled];
}
/* klik na "Vývoj po dňoch" -> denna krivka fabriky (views YT/TT/IG z historie) */
function facTrend(name,idx){
  const el=document.getElementById('ftr_'+idx);
  if(!el)return;
  if(el.innerHTML){el.innerHTML='';return;}
  const days=(HIST||[]).filter(h=>h.fac&&h.fac[name]);
  if(days.length<2){el.innerHTML='<div class="empty">Krivka sa zapne pri 2+ dňoch histórie tejto fabriky.</div>';return;}
  const dates=days.map(h=>h.date);
  const f=k=>days.map(h=>(h.fac[name]||{})[k]||0);
  el.innerHTML='<div style="margin-top:10px">'+lineChart([
    {name:'YouTube',c:PC.youtube,pts:f('yv')},
    {name:'TikTok',c:PC.tiktok,pts:f('tv')},
    {name:'Instagram',c:PC.instagram,pts:f('iv')}],dates,180)+'</div>';
}

/* Rozdelenie YT vykonu fabriky na Shorts vs Dokumenty (podla is_long) — zobrazi sa len ak uz ma aj dlhe videa */
function ytSplit(p){
  const yv=(p.videos||[]).filter(v=>(v.platform||'').toLowerCase()==='youtube');
  const lo=yv.filter(v=>v.is_long), sh=yv.filter(v=>!v.is_long);
  if(!lo.length) return '';
  const sv=sh.reduce((s,v)=>s+(v.views||0),0), lv=lo.reduce((s,v)=>s+(v.views||0),0);
  const box=(ic,lab,n,vw)=>`<div style="flex:1;background:#0d1420;border:1px solid #172234;border-radius:8px;padding:7px 10px">
    <div class="muted" style="font-size:11.5px">${ic} ${lab}</div>
    <div style="font-weight:800;font-size:14px">${fmt(n)} <span class="muted" style="font-weight:500;font-size:11px">videí</span></div>
    <div class="muted" style="font-size:11.5px">${fmt(vw)} zhliad.</div></div>`;
  return `<div style="display:flex;gap:8px;margin-top:9px">${box('🎬','Shorts',sh.length,sv)}${box('📄','Dokumenty',lo.length,lv)}</div>`;
}

async function loadComments(){
  $('#cbody').innerHTML=`<div class="empty"><span class="spin"></span> Načítavam komentáre (Instagram + YouTube)…</div>`;
  try{
    const r=await fetch('/api/all_comments');
    const d=await r.json();
    if(d.error){$('#cbody').innerHTML=`<div class="empty">Chyba: ${esc(d.error)}</div>`;return;}
    // zobraz len NEVYBAVENE: komentar s lajkom (like_count>0) = vybaveny -> automaticky preč
    // IG: komentar s lajkom (ty si lajkol) = vybaveny -> prec. YT: zobraz vsetky (read-only).
    const posts=(d.media||[]).map(m=>({...m,open:(m.comments||[]).filter(c=> m.platform==='youtube' ? true : !(c.like_count>0))}))
                             .filter(m=>m.open.length);
    if(!posts.length){$('#cbody').innerHTML=`<div class="empty">Žiadne nevybavené komentáre. 🎉<br><span style="font-size:12px">(Lajknuté IG komentáre sa odtiaľto automaticky stratia. Účty sú zatiaľ nové — keď prídu komentáre, objavia sa tu.)</span></div>`;return;}
    $('#cbody').innerHTML=posts.map(m=>{
      const yt=m.platform==='youtube';
      const f=yt?{name:m.user,color:'#ff4d4d'}:userFac(m.user);
      const icon=yt?'📺':'📸';
      return `<div class="post" id="post_${m.id}" style="border-left:3px solid ${f.color}">
        <div class="cap">
          <span class="tag" style="background:${f.color}22;color:${f.color}">${icon} ${esc(f.name)}</span>
          <a href="${m.permalink}" target="_blank" rel="noopener noreferrer">${esc(m.caption)||'(príspevok)'}</a></div>
        ${m.open.map(c=>`<div class="cm" id="cm_${c.id}">
          <div style="flex:1">
            <span class="u">@${esc(c.username||'?')}</span> <span class="t">${esc(c.text||'')}</span>
            ${yt?`<div class="reply"><a class="btn" href="${m.permalink}" target="_blank" rel="noopener noreferrer">Odpovedať na YouTube ↗</a>
              <button class="btn" onclick="markDone('${c.id}','${m.id}')">✓ Vybavené</button></div>`
                :`<div class="reply">
              <input placeholder="Odpoveď…" aria-label="Odpoveď na komentár" id="r_${c.id}">
              <button class="btn" onclick="sendReply('${m.user}','${c.id}','${m.id}')">Odpovedať</button>
              <button class="btn" onclick="hideC('${m.user}','${c.id}','${m.id}')">Skryť</button>
              <button class="btn" onclick="markDone('${c.id}','${m.id}')">✓ Vybavené</button>
            </div>`}
          </div></div>`).join('')}
      </div>`;}).join('');
  }catch(e){$('#cbody').innerHTML=`<div class="empty">Chyba spojenia: ${esc(''+e)}</div>`;}
}
async function markAllShown(){          // hromadne: vsetky prave zobrazene komentare -> vybavene
  const cms=[...document.querySelectorAll('#cbody .cm')];
  if(!cms.length){alert('Najprv načítaj komentáre.');return;}
  if(!confirm('Označiť všetkých '+cms.length+' zobrazených komentárov ako vybavené? (YouTube komentáre sa NEmažú, len zmiznú z dashboardu)'))return;
  let ok=0;
  for(const el of cms){
    const cid=el.id.replace(/^cm_/,'');
    try{ await fetch('/api/comment_done',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comment_id:cid})}); ok++; }catch(e){}
  }
  $('#cbody').innerHTML='<div class="empty">Hotovo — '+ok+' komentárov označených ako vybavené. 🎉</div>';
}
function dropComment(cid,pid){            // odstrani komentar; ak je prispevok prazdny, odstrani aj prispevok
  const el=$('#cm_'+cid); if(el)el.remove();
  const post=$('#post_'+pid); if(post&&!post.querySelector('.cm'))post.remove();
  if(!$('#cbody').querySelector('.post'))$('#cbody').innerHTML='<div class="empty">Žiadne nevybavené komentáre. 🎉</div>';
}
async function markDone(cid,pid){         // "Vybavené" -> trvalo zmizne z dashboardu (aj po reload/restart)
  try{ await fetch('/api/comment_done',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({comment_id:cid})}); }catch(e){}
  dropComment(cid,pid);
}
async function sendReply(user,cid,pid){
  const inp=$('#r_'+cid); const msg=inp.value.trim(); if(!msg)return;
  inp.disabled=true; inp.placeholder='…';
  const r=await fetch('/api/reply',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user,comment_id:cid,message:msg})});
  const d=await r.json();
  if(d.ok){dropComment(cid,pid);}                 // odpovedané -> automaticky preč
  else{inp.disabled=false;inp.placeholder='Odpoveď…';alert('Chyba: '+(d.error||'?'));}
}
async function hideC(user,cid,pid){
  const r=await fetch('/api/hide',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user,comment_id:cid,hide:true})});
  const d=await r.json();
  if(d.ok){dropComment(cid,pid);} else alert('Chyba: '+(d.error||'?'));
}

/* ---- 🌌 2D fallback galaxie (pôvodný čistý canvas) — len keď WebGL alebo three.js z CDN nie je k dispozícii ---- */
function renderGalaxy2D(container,projects,opts){
  opts=opts||{};

  container.innerHTML='';
  const P=(projects||[]).filter(p=>p&&p.name);
  if(!P.length){container.innerHTML='<div class="empty">Galaxia sa objaví po načítaní dát.</div>';return;}

  const wrap=document.createElement('div');
  wrap.style.cssText='position:relative;width:100%;height:'+(opts.height||'72vh')+';min-height:460px;border-radius:16px;overflow:hidden;background:radial-gradient(1200px 700px at 50% 38%,#0e1a33,#05070d 72%);border:1px solid var(--bd,#1e2733);touch-action:none;cursor:grab';
  const cv=document.createElement('canvas'); cv.style.cssText='display:block;width:100%;height:100%'; wrap.appendChild(cv);
  const tip=document.createElement('div');
  tip.style.cssText='position:absolute;pointer-events:none;background:#0b0f18ee;border:1px solid #2a3647;border-radius:9px;padding:7px 10px;font:600 12.5px/1.4 Segoe UI,system-ui,sans-serif;color:#e6edf3;opacity:0;transform:translate(-50%,-128%);transition:opacity .12s;white-space:nowrap;z-index:5'; wrap.appendChild(tip);
  const hint=document.createElement('div');
  hint.style.cssText='position:absolute;left:14px;bottom:11px;font:500 11.5px/1.5 Segoe UI,system-ui;color:#6f7d92;pointer-events:none;z-index:4';
  hint.innerHTML='🖱️ ťahaj = otáčaj &nbsp;·&nbsp; koliesko = zoom &nbsp;·&nbsp; hover = detail'; wrap.appendChild(hint);
  container.appendChild(wrap);

  const ctx=cv.getContext('2d');
  const DPR=Math.min(2,window.devicePixelRatio||1);
  let W=0,H=0,bg=null;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const mulberry32=a=>function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const hexRgb=h=>{h=(h||'#6aa0ff').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16)||0x6aa0ff;return[n>>16&255,n>>8&255,n&255];};

  const nodes=[],suns=[],R=300,NF=P.length;
  P.forEach((p,i)=>{
    const gt=(i+0.5)/NF, phi=Math.acos(1-2*gt), th=Math.PI*(1+Math.sqrt(5))*i;
    const cx=Math.sin(phi)*Math.cos(th)*R, cy=Math.cos(phi)*R*0.68, cz=Math.sin(phi)*Math.sin(th)*R;
    const col=p.color||'#6aa0ff';
    const foll=((p.yt&&p.yt.subs)||0)+((p.tiktok&&p.tiktok.followers)||0)+((p.instagram&&p.instagram.followers)||0);
    const vids=(p.videos||[]), totV=vids.reduce((s,v)=>s+(v.views||0),0);
    const sunR=clamp(12+Math.sqrt(Math.max(foll,totV,1))/6,12,40);
    const sun={x:cx,y:cy,z:cz,r:sunR,col,name:p.name,niche:p.niche||'',sub:foll,views:totV,isSun:1};
    nodes.push(sun); suns.push(sun);
    const rng=mulberry32(1000+i*97);
    vids.slice().sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,36).forEach(v=>{
      const rr=42+rng()*74, a1=rng()*Math.PI*2, a2=Math.acos(2*rng()-1);
      nodes.push({x:cx+Math.sin(a2)*Math.cos(a1)*rr, y:cy+Math.cos(a2)*rr*0.62, z:cz+Math.sin(a2)*Math.sin(a1)*rr,
        r:clamp(2+Math.sqrt(v.views||1)/9,2,13), col, name:v.title||'video', views:v.views||0, parent:sun, isSun:0});
    });
  });

  const sprites={};
  const sprite=col=>{
    if(sprites[col])return sprites[col];
    const s=64,c=document.createElement('canvas');c.width=c.height=s;
    const g=c.getContext('2d'),[r,gg,b]=hexRgb(col),grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    grd.addColorStop(0,'rgba('+r+','+gg+','+b+',0.95)');grd.addColorStop(0.25,'rgba('+r+','+gg+','+b+',0.5)');grd.addColorStop(1,'rgba('+r+','+gg+','+b+',0)');
    g.fillStyle=grd;g.beginPath();g.arc(s/2,s/2,s/2,0,7);g.fill();sprites[col]=c;return c;
  };

  function resize(){
    const rc=wrap.getBoundingClientRect();W=rc.width;H=rc.height;
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
    bg=document.createElement('canvas');bg.width=cv.width;bg.height=cv.height;
    const g=bg.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);const rng=mulberry32(7);
    for(let i=0;i<170;i++){const x=rng()*W,y=rng()*H,rr=rng()*1.2+0.2,a=rng()*0.5+0.08;g.fillStyle='rgba(200,215,255,'+a.toFixed(2)+')';g.beginPath();g.arc(x,y,rr,0,7);g.fill();}
  }

  let yaw=0.5,pitch=-0.32,zoom=1,mx=-1,my=-1,dragging=false,lastX=0,lastY=0,vyaw=0,vpitch=0,lastAct=0;
  const focal=650, now=()=>performance.now();
  wrap.addEventListener('pointerdown',e=>{dragging=true;lastAct=now();lastX=e.clientX;lastY=e.clientY;try{wrap.setPointerCapture(e.pointerId);}catch(_){}wrap.style.cursor='grabbing';});
  wrap.addEventListener('pointermove',e=>{const rc=wrap.getBoundingClientRect();mx=e.clientX-rc.left;my=e.clientY-rc.top;
    if(dragging){const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw+=dx*0.006;pitch=clamp(pitch+dy*0.006,-1.3,1.3);vyaw=dx*0.006;vpitch=dy*0.006;lastAct=now();}});
  const endDrag=()=>{dragging=false;wrap.style.cursor='grab';lastAct=now();};
  wrap.addEventListener('pointerup',endDrag);wrap.addEventListener('pointercancel',endDrag);
  wrap.addEventListener('pointerleave',()=>{mx=my=-1;});
  wrap.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*(e.deltaY<0?1.1:0.9),0.45,3.2);lastAct=now();},{passive:false});

  function frame(){
    if(!wrap.isConnected)return;
    if(wrap.offsetParent===null){window._galRaf=requestAnimationFrame(frame);return;}
    if(W!==wrap.clientWidth||H!==wrap.clientHeight)resize();
    const idle=now()-lastAct>3200;

    else if(!dragging){yaw+=vyaw;pitch=clamp(pitch+vpitch,-1.3,1.3);vyaw*=0.93;vpitch*=0.93;if(Math.abs(vyaw)<1e-4)vyaw=0;if(Math.abs(vpitch)<1e-4)vpitch=0;}
    const cy_=Math.cos(yaw),sy_=Math.sin(yaw),cx_=Math.cos(pitch),sx_=Math.sin(pitch),cxp=W/2,cyp=H/2;
    ctx.clearRect(0,0,W,H);if(bg)ctx.drawImage(bg,0,0,W,H);
    for(const n of nodes){
      const x1=n.x*cy_+n.z*sy_,z1=-n.x*sy_+n.z*cy_,y1=n.y;
      const y2=y1*cx_-z1*sx_,z2=y1*sx_+z1*cx_,persp=focal/(focal-z2*0.9);
      n._z=z2;n._p=persp;n._sx=cxp+x1*persp*zoom;n._sy=cyp+y2*persp*zoom;n._r=Math.max(0.6,n.r*persp*zoom);n._b=clamp((persp-0.55)/1.1,0.18,1);
    }
    nodes.sort((a,b)=>a._z-b._z);
    ctx.globalCompositeOperation='lighter';
    for(const n of nodes){const sp=sprite(n.col),gr=n._r*(n.isSun?6:4.6);ctx.globalAlpha=(n.isSun?0.5:0.32)*n._b;ctx.drawImage(sp,n._sx-gr,n._sy-gr,gr*2,gr*2);}
    for(const n of nodes){
      ctx.globalAlpha=0.92*n._b;ctx.fillStyle=n.col;ctx.beginPath();ctx.arc(n._sx,n._sy,n._r,0,7);ctx.fill();
      ctx.globalAlpha=0.85*n._b;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(n._sx,n._sy,n._r*0.42,0,7);ctx.fill();
    }

    for(const s of suns){if(s._b>0.4){ctx.globalAlpha=clamp(s._b,0.3,1);ctx.fillStyle='#fff';ctx.fillText(s.name,s._sx,s._sy-s._r-9);}}
    ctx.globalAlpha=1;

    }else tip.style.opacity='0';

function gxLoad(){

  if(!GX.libP){
    const A='three/addons/';
    const all=Promise.all([import('three'),import(A+'controls/OrbitControls.js'),import(A+'postprocessing/EffectComposer.js'),
      import(A+'postprocessing/RenderPass.js'),import(A+'postprocessing/UnrealBloomPass.js'),import(A+'postprocessing/OutputPass.js'),
      import(A+'renderers/CSS2DRenderer.js')]);
    const tmo=new Promise((_,no)=>setTimeout(()=>no(new Error('three.js sa nenačítal (timeout)')),20000));
    GX.libP=Promise.race([all,tmo]).then(m=>(GX.lib={T:m[0],OrbitControls:m[1].OrbitControls,EffectComposer:m[2].EffectComposer,
      RenderPass:m[3].RenderPass,UnrealBloomPass:m[4].UnrealBloomPass,OutputPass:m[5].OutputPass,
      CSS2DRenderer:m[6].CSS2DRenderer,CSS2DObject:m[6].CSS2DObject}))
      .catch(e=>{GX.libP=null;throw e;});
  }
  return GX.libP;
}

/* ---- pomocníci ---- */
const gxRnd=s=>{let a=s>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};};
const gxHash=s=>{s=String(s==null?'':s);let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};
const gxCol=c=>/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c||'')?c:'#6aa0ff';
const gxRGB=c=>{c=gxCol(c).slice(1);if(c.length===3)c=c.replace(/./g,x=>x+x);const n=parseInt(c,16);return[n>>16&255,n>>8&255,n&255];};
const gxPlat=v=>{const k=String((v&&v.platform)||'').toLowerCase();return PN[k]?k:'other';};
const gxFabr=n=>n===1?'fabrika':(n>=2&&n<=4?'fabriky':'fabrík');
function gxRefTime(){   // "teraz" = cas vygenerovania dat (stare data.json -> meria sa voci svojmu snapshotu)
  const m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/.exec((typeof DATA!=='undefined'&&DATA&&DATA.gen_at)||'');
  const t=m?new Date(+m[3],+m[2]-1,+m[1],+(m[4]||12),+(m[5]||0)).getTime():NaN;
  return isFinite(t)?t:Date.now();
}
function gxDT(iso){
  if(!iso)return '—';const d=new Date(iso);if(isNaN(d))return esc(String(iso));
  return d.toLocaleDateString('sk-SK',{day:'numeric',month:'numeric'})+' '+d.toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'});
}
/* zhliadnutia za ~28 dni = rozdiel dennych zapisov history.json (yv+tv+iv fabriky), bez medzier (gap) */
function gxViews28(name,hist){
  const rows=(Array.isArray(hist)?hist:[]).filter(h=>h&&!h.gap&&h.date&&h.fac&&h.fac[name])
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  if(rows.length<2)return null;
  const last=rows[rows.length-1],lt=new Date(last.date+'T00:00:00Z').getTime();
  if(!isFinite(lt))return null;
  const cut=new Date(lt-28*864e5).toISOString().slice(0,10);
  let base=rows[0];for(const r of rows){if(r.date<=cut)base=r;else break;}
  const days=Math.round((lt-new Date(base.date+'T00:00:00Z').getTime())/864e5);
  if(!(days>=1))return null;
  const tot=r=>{const f=r.fac[name]||{};return (f.yv||0)+(f.tv||0)+(f.iv||0);};
  return {v:Math.max(0,tot(last)-tot(base)),days};
}
function gxModel(P,hist){
  const ref=gxRefTime();
  return P.map((p,i)=>{
    const vids=(p.videos||[]).filter(Boolean).slice().sort((a,b)=>(b.views||0)-(a.views||0));
    const pv=k=>vids.filter(v=>gxPlat(v)===k).reduce((s,v)=>s+(v.views||0),0);
    const f={youtube:p.yt?(p.yt.subs||0):null,tiktok:p.tiktok?(p.tiktok.followers||0):null,instagram:p.instagram?(p.instagram.followers||0):null};
    const pvw={youtube:p.yt?(p.yt.views||0):pv('youtube'),tiktok:p.tiktok?(p.tiktok.views||0):pv('tiktok'),instagram:pv('instagram')};
    const last=vids.map(v=>v.published).filter(Boolean).map(String).sort().pop()||null;
    const idle=last?Math.floor((ref-new Date(last.slice(0,10)+'T12:00:00').getTime())/864e5):Infinity;
    return {p,i,name:String(p.name),color:gxCol(p.color),foll:facFollowers(p),f,pvw,views:pvw.youtube+pvw.tiktok+pvw.instagram,
      v28:gxViews28(p.name,hist),vids,top:vids.slice(0,GX.MOONS),last,idle:Math.max(0,idle),dormant:!(idle<=GX.IDLE_DAYS)};
  });
}
/* rozlozenie: velkost planet, mesiace, polomery drah (bez prekryvu planet a prstencov susedov) */
function gxLayout(F){
  const maxF=Math.max(1,...F.map(f=>f.foll));
  const maxPF=Math.max(1,...F.flatMap(f=>Object.values(f.f).map(x=>x||0)));
  const maxMV=Math.max(1,...F.flatMap(f=>f.top.map(v=>v.views||0)));
  const ord=F.slice().sort((a,b)=>(b.foll-a.foll)||(b.views-a.views)||(a.i-b.i));
  let r=GX.SUN_R*2.3,prev=null;
  ord.forEach((f,k)=>{
    f.rank=k;f.R=2.1+3.2*Math.sqrt(f.foll/maxF);
    f.mr=f.top.map(v=>0.2+0.6*Math.sqrt((v.views||0)/maxMV));
    f.md=f.top.map((v,j)=>f.R*2.5+(j%4)*(f.R*0.13+0.3)+(j>3?f.R*0.07:0));   // 4 pasy, v kazdom 2 mesiace (ine sklony/fazy)
    f.ext=Math.max(f.R*2.45,...f.md.map((d,j)=>d+f.mr[j]));
    r+=prev?(prev.ext+f.ext)*0.76+2:f.ext;f.orbitR=r;prev=f;
  });
  return {ord,maxPF,outer:r+(prev?prev.ext:0)};
}
/* prstence platforiem v polomeroch planety: [r0,r1,alpha] — sirka aj jas ∝ √sledovatelia (globalne normovane) */
function gxBands(f,maxPF){
  let r=1.42;
  return ['youtube','tiktok','instagram'].map(k=>{
    const n=f.f[k];if(n==null)return null;
    const q=Math.sqrt(n/maxPF),w=n>0?0.08+0.26*q:0.035,a=n>0?0.32+0.55*q:0.16,b={k,r0:r,r1:r+w,a};
    r+=w+0.07;return b;
  });
}

/* ---- proceduralne textury (raz, zdielane) ---- */
function gxNoise(seed){
  const hs=(x,y,z)=>{let h=(seed|0)^Math.imul(x|0,0x27d4eb2d)^Math.imul(y|0,0x165667b1)^Math.imul(z|0,0x9e3779b1);
    h=Math.imul(h^h>>>15,0x85ebca6b);h=Math.imul(h^h>>>13,0xc2b2ae35);return((h^h>>>16)>>>0)/4294967296;};
  return (x,y,z)=>{const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);let u=x-X,v=y-Y,w=z-Z;u=u*u*(3-2*u);v=v*v*(3-2*v);w=w*w*(3-2*w);
    const a=hs(X,Y,Z),b=hs(X+1,Y,Z),c=hs(X,Y+1,Z),d=hs(X+1,Y+1,Z),e=hs(X,Y,Z+1),f=hs(X+1,Y,Z+1),g=hs(X,Y+1,Z+1),h=hs(X+1,Y+1,Z+1);
    const l1=a+(b-a)*u,l2=c+(d-c)*u,l3=e+(f-e)*u,l4=g+(h-g)*u,m1=l1+(l2-l1)*v,m2=l3+(l4-l3)*v;return m1+(m2-m1)*w;};
}
const gxFbm=(n,x,y,z,o)=>{let s=0,a=0.5,f=1,t=0;for(let i=0;i<o;i++){s+=a*n(x*f,y*f,z*f);t+=a;a*=0.5;f*=2.02;}return s/t;};
function gxCanvasTex(T,cv){const t=new T.CanvasTexture(cv);t.colorSpace=T.SRGBColorSpace;return t;}
function gxPlanetTex(T,kind,seed){   // siva equirect mapa; farbu dava material (brand fabriky)
  const W=256,H=128,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d'),im=ctx.createImageData(W,H),d=im.data,n=gxNoise(seed);
  for(let y=0;y<H;y++){const lat=(y/(H-1)-0.5)*Math.PI,sy=Math.sin(lat),cy=Math.cos(lat);
    for(let x=0;x<W;x++){const lo=x/W*Math.PI*2,px=Math.cos(lo)*cy,pz=Math.sin(lo)*cy;let g;
      if(kind===0){const wv=gxFbm(n,px*1.8,sy*1.8,pz*1.8,3);g=0.72+0.17*Math.sin((sy*7+wv*2.4)*Math.PI)+0.08*Math.sin((sy*19+wv*3.1)*Math.PI);}
      else if(kind===1){const f=gxFbm(n,px*2.4,sy*2.4,pz*2.4,5);g=0.66+Math.max(0,f-0.46)*1.4+0.1*(gxFbm(n,px*8+3,sy*8,pz*8,2)-0.5);}
      else{const f=gxFbm(n,px*1.5,sy*2.8,pz*1.5,4);g=0.78+0.16*Math.sin((f*5+sy*2)*Math.PI);}
      const c=Math.max(0,Math.min(255,Math.round(g*255))),k=(y*W+x)*4;d[k]=d[k+1]=d[k+2]=c;d[k+3]=255;}}
  ctx.putImageData(im,0,0);return gxCanvasTex(T,cv);
}
function gxNebTex(T,c1,c2,seed){   // mäkká hmlovina (fbm) s radialnym vyblednutim
  const N=192,cv=document.createElement('canvas');cv.width=cv.height=N;
  const ctx=cv.getContext('2d'),im=ctx.createImageData(N,N),d=im.data,n=gxNoise(seed),A=gxRGB(c1),B=gxRGB(c2);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const u=x/N-0.5,v=y/N-0.5,r=Math.sqrt(u*u+v*v)*2;
    const f=gxFbm(n,u*3.2,v*3.2,0.5,5),m=Math.max(0,Math.min(1,(gxFbm(n,u*2.1+9,v*2.1+3,1.5,3)-0.3)/0.4));
    const a=Math.min(1,Math.max(0,f-0.34)*2.4*Math.pow(Math.max(0,1-r),1.7)),k=(y*N+x)*4;
    d[k]=A[0]+(B[0]-A[0])*m;d[k+1]=A[1]+(B[1]-A[1])*m;d[k+2]=A[2]+(B[2]-A[2])*m;d[k+3]=a*255;}
  ctx.putImageData(im,0,0);return gxCanvasTex(T,cv);
}
function gxGlowTex(T){
  const s=128,cv=document.createElement('canvas');cv.width=cv.height=s;const x=cv.getContext('2d'),gr=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.16,'rgba(255,255,255,.55)');gr.addColorStop(0.42,'rgba(255,255,255,.13)');gr.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=gr;x.fillRect(0,0,s,s);return gxCanvasTex(T,cv);
}
function gxRingTex(T){
  const s=128,cv=document.createElement('canvas');cv.width=cv.height=s;const x=cv.getContext('2d');
  x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=5;x.beginPath();x.arc(s/2,s/2,s/2-8,0,Math.PI*2);x.stroke();return gxCanvasTex(T,cv);
}
function gxPointsGeo(T,n,fill){
  const pos=new Float32Array(n*3),col=new Float32Array(n*3),sz=new Float32Array(n),ph=new Float32Array(n);
  for(let i=0;i<n;i++)fill(i,pos,col,sz,ph);
  const geo=new T.BufferGeometry();
  geo.setAttribute('position',new T.BufferAttribute(pos,3));geo.setAttribute('aColor',new T.BufferAttribute(col,3));
  geo.setAttribute('aSize',new T.BufferAttribute(sz,1));geo.setAttribute('aPhase',new T.BufferAttribute(ph,1));
  return geo;
}
function gxStars(T,n,r0,r1,s0,s1,seed){   // jedna vrstva hviezd v gulovej skrupine
  const rnd=gxRnd(seed),tint=[[1,1,1],[0.74,0.84,1],[1,0.9,0.76],[0.86,0.8,1]];
  return gxPointsGeo(T,n,(i,p,c,s,ph)=>{
    const u=rnd()*2-1,a=rnd()*Math.PI*2,r=r0+(r1-r0)*rnd(),q=Math.sqrt(1-u*u);
    p[i*3]=r*q*Math.cos(a);p[i*3+1]=r*u;p[i*3+2]=r*q*Math.sin(a);
    const t=tint[(rnd()*tint.length)|0],b=0.3+Math.pow(rnd(),3)*0.95;
    c[i*3]=t[0]*b;c[i*3+1]=t[1]*b;c[i*3+2]=t[2]*b;s[i]=s0+(s1-s0)*Math.pow(rnd(),2.2);ph[i]=rnd();});
}
function gxDustGeo(T,n,seed){   // tenky prachovy disk v rovine drah (jednotkovy polomer, skaluje sa podla sustavy)
  const rnd=gxRnd(seed);
  return gxPointsGeo(T,n,(i,p,c,s,ph)=>{
    const r=0.07+1.08*Math.pow(rnd(),0.8),a=rnd()*Math.PI*2;
    p[i*3]=Math.cos(a)*r;p[i*3+1]=(rnd()+rnd()+rnd()-1.5)*0.006;p[i*3+2]=Math.sin(a)*r;
    const b=0.1+rnd()*0.2,t=rnd();c[i*3]=b*(0.55+0.45*t);c[i*3+1]=b*0.72;c[i*3+2]=b*1.25;s[i]=0.8+rnd()*1.3;ph[i]=rnd();});
}

  const se=document.createElement('div');se.className='gx-lw';

  // udalosti: hover / klik (odlisene od tahania) / popisky su klikatelne

/* ---- scena z dat (prestavba len ked sa data zmenia) ---- */
function gxClear(g){

  g.hover=null;g.hoverKey='';g.marker.visible=false;g.tip.classList.remove('on');
  for(const x of g.labels)if(x!==g.sunLabel&&x.el.parentNode)x.el.parentNode.removeChild(x.el);
  if(g.root)g.scene.remove(g.root);

function gxBuild(g,P,opts){
  const T=g.T,L=g.L,hist=opts.history||(typeof HIST!=='undefined'?HIST:[]);

    p.last_sent,p.next_due,p.yt&&p.yt.views,p.tiktok&&p.tiktok.views,(p.videos||[]).map(v=>(v&&v.id||'')+':'+(v&&v.views||0)).join(',')]),
    (hist||[]).length,typeof DATA!=='undefined'&&DATA&&DATA.gen_at]);

  gxClear(g);g.sig=sig;g.focus=null;
  const F=gxModel(P,hist),lay=gxLayout(F);
  g.outerR=lay.outer;
  const root=g.root=new T.Group();g.scene.add(root);
  g.labels.push(g.sunLabel);g.pick.push({kind:'sun',obj:g.sun,r:GX.SUN_R});
  const r0=lay.ord.length?lay.ord[0].orbitR:40,grey=new T.Color('#7d8796');
  lay.ord.forEach((f,k)=>{
    const rnd=gxRnd(gxHash(f.name)+7),dim=f.dormant;
    const plane=new T.Object3D();plane.rotation.set((rnd()-0.5)*0.07,0,(rnd()-0.5)*0.07);root.add(plane);
    const col=dim?new T.Color(f.color).lerp(grey,0.8):new T.Color(f.color);
    const orbMat=new T.ShaderMaterial({uniforms:{uColor:{value:col.clone()},uHead:{value:0},uBase:{value:dim?0.05:0.11},uTrail:{value:dim?0.14:0.55},uDash:{value:dim?1:0}},
      vertexShader:GXS.orbV,fragmentShader:GXS.orbF,transparent:true,depthWrite:false,blending:T.AdditiveBlending});
    const orbit=new T.Line(g.orbitGeo,orbMat);orbit.scale.set(f.orbitR,1,f.orbitR);plane.add(orbit);
    const pivot=new T.Object3D();plane.add(pivot);
    const tilt=new T.Object3D();tilt.rotation.set((rnd()-0.5)*0.35,0,0.12+rnd()*0.35);pivot.add(tilt);
    const tex=g.tex[gxHash(f.name)%g.tex.length];
    const mat=new T.MeshStandardMaterial({color:col,map:tex,emissive:col,emissiveMap:tex,emissiveIntensity:dim?0.05:0.22,roughness:0.78,metalness:0.04});
    const body=new T.Mesh(g.sphere,mat);body.scale.setScalar(f.R);tilt.add(body);
    const atmoMat=new T.ShaderMaterial({uniforms:{uColor:{value:col.clone()},uI:{value:dim?0.3:1.0}},vertexShader:GXS.atmoV,fragmentShader:GXS.atmoF,
      side:T.BackSide,transparent:true,depthWrite:false,blending:T.AdditiveBlending});
    const atmo=new T.Mesh(g.sphere,atmoMat);atmo.scale.setScalar(f.R*1.3);tilt.add(atmo);
    // žiara v pixeloch (viditeľná v celkovom pohľade, pri priblížení zmizne)
    const glw=new T.Sprite(new T.SpriteMaterial({map:g.glowTex,color:col,transparent:true,depthWrite:false,blending:T.AdditiveBlending,opacity:0,sizeAttenuation:false}));
    const gs=0.02+0.0045*f.R;glw.scale.set(gs,gs,1);pivot.add(glw);g.own.push(glw.material);
    let ringMat=null;const bands=gxBands(f,lay.maxPF);
    if(bands.some(Boolean)){
      const U={uDim:{value:dim?0.35:1}};
      bands.forEach((b,j)=>{U['uC'+j]={value:new T.Color(b?GX.RING[b.k]:'#000000')};U['uB'+j]={value:new T.Vector4(b?b.r0:0,b?b.r1:0,b?b.a:0,0)};});
      ringMat=new T.ShaderMaterial({uniforms:U,vertexShader:GXS.ringV,fragmentShader:GXS.ringF,transparent:true,depthWrite:false,side:T.DoubleSide,extensions:{derivatives:true}});
      const ring=new T.Mesh(g.ringGeo,ringMat);ring.rotation.x=-Math.PI/2;ring.scale.setScalar(f.R);tilt.add(ring);
    }
    const el=document.createElement('div');el.className='gx-lw';
    el.innerHTML=`<div class="gx-lbl${dim?' dim':''}" data-k="${k}"><b><i class="gx-dot" style="background:${f.color};color:${f.color}"></i>${esc(f.name)}</b>`+
      `<small>${fmt(f.foll)} sledov.${dim?' · <em>💤 neaktívna</em>':''}</small></div>`;
    const lo=new L.CSS2DObject(el);lo.center.set(0.5,1);pivot.add(lo);
    const pl={f,k,pivot,body,mat,atmoMat,orbMat,glw,glwA:dim?0.1:0.42,moons:[],orbitR:f.orbitR,R:f.R,
      th0:0.4+k*2.39996,w:(dim?0.35:1)*0.075*Math.sqrt(r0/f.orbitR),spin:0.1+rnd()*0.16,
      baseEm:mat.emissiveIntensity,baseAt:atmoMat.uniforms.uI.value,baseOrb:orbMat.uniforms.uBase.value};
    pl.label={obj:lo,el,inner:el.firstElementChild,anchor:pivot,r:f.R,up:true,prio:1e6-k,pl,w:0,h:0};
    pl.pick={kind:'planet',obj:pivot,r:f.R,pl,f};
    f.top.forEach((v,j)=>{
      const mr=gxRnd(gxHash((v.id||'')+(v.title||'')+j)+j*977);
      const mp=new T.Object3D();mp.rotation.set((mr()-0.5)*1.0,mr()*6.283,(mr()-0.5)*0.6);pivot.add(mp);
      const pk=gxPlat(v),mesh=new T.Mesh(g.moonGeo,dim?g.moonMat.dim:(g.moonMat[pk]||g.moonMat.other));mesh.scale.setScalar(f.mr[j]);mp.add(mesh);

    });

    g.planets.push(pl);g.labels.push(pl.label);g.pick.push(pl.pick);

  const tf=F.reduce((s,f)=>s+f.foll,0),tv=F.reduce((s,f)=>s+f.views,0);
  g.tot={foll:tf,views:tv,n:F.length};
  g.sunLabel.inner.querySelector('small').textContent=`${fmt(tf)} sledov. · ${F.length} ${gxFabr(F.length)}`;g.sunLabel.w=0;
  g.S.sum.textContent=`${F.length} ${gxFabr(F.length)} · ${fmt(tf)} sledov. · ${fmt(tv)} zhliad.`;
  g.S.jump.innerHTML='<option value="">Prejsť na fabriku…</option>'+
    g.planets.map(pl=>`<option value="${pl.k}">${esc(pl.f.name)} · ${fmt(pl.f.foll)} sledov.</option>`).join('');
  gxHome(g);
  const kp=keep&&g.planets.find(x=>x.f.name===keep);
  if(kp)gxFocus(g,kp,true);
  else{gxPanel(g,null);if(!g.touched||keep||!g.built){g.controls.minDistance=14;gxApplyHome(g);}}
  g.built=true;
  return true;
}

/* ---- kamera: celkovy pohlad, prelet na planetu, sledovanie, posun kvoli panelu ---- */
function gxHome(g){
  const T=g.T,R=Math.max(60,g.outerR||120),a=(g.w||800)/(g.h||500),tv=Math.tan(T.MathUtils.degToRad(g.camera.fov)/2),th=tv*a;
  const narrow=(g.w||800)<700,el=T.MathUtils.degToRad(narrow?50:33);
  const dist=Math.max(R*(narrow?0.74:1.06)/th,R*(Math.sin(el)*1.22+0.1)/tv);   // mobil: vonkajšie dráhy smú presahovať okraj
  g.home=new T.Spherical(dist,Math.PI/2-el,T.MathUtils.degToRad(-24));
  g.controls.maxDistance=dist*2.3;g.controls.maxTargetRadius=R*1.1;g.labelMax=dist*1.9;
}
function gxApplyHome(g){g.tw=null;g.controls.enabled=true;g.controls.target.set(0,0,0);g.camera.position.setFromSpherical(g.home);g.camera.lookAt(0,0,0);}
function gxTween(g,tgt,s1,instant){
  const T=g.T,c=g.controls,t0=c.target.clone(),s0=new T.Spherical().setFromVector3(g.camera.position.clone().sub(t0));
  g.tw={p:0,dur:(instant||g.RM)?0:1.1,t0,s0,s1,tgt};c.enabled=false;
}
function gxTweenStep(g,dt){
  const w=g.tw,T=g.T;w.p=w.dur?Math.min(1,w.p+dt/w.dur):1;
  const x=w.p,e=x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
  g.controls.target.lerpVectors(w.t0,w.tgt(),e);
  const dth=Math.atan2(Math.sin(w.s1.theta-w.s0.theta),Math.cos(w.s1.theta-w.s0.theta));
  const r=Math.exp(Math.log(Math.max(1e-3,w.s0.radius))*(1-e)+Math.log(Math.max(1e-3,w.s1.radius))*e);
  const s=g._ts||(g._ts=new T.Spherical());s.set(r,w.s0.phi+(w.s1.phi-w.s0.phi)*e,w.s0.theta+dth*e);
  g.camera.position.setFromSpherical(s).add(g.controls.target);g.camera.lookAt(g.controls.target);
  if(w.p>=1){g.tw=null;g.controls.enabled=true;g.lastFocus=g.focus?g.controls.target.clone():null;}
}
function gxFollow(g){   // zameraná planeta obieha -> kamera ide s ňou (používateľ môže ďalej otáčať/zoomovať)
  if(!g.focus)return;
  const P=g.focus.pivot.getWorldPosition(g._fp||(g._fp=new g.T.Vector3()));
  if(g.lastFocus){const d=(g._fd||(g._fd=new g.T.Vector3())).subVectors(P,g.lastFocus);g.camera.position.add(d);g.controls.target.add(d);g.lastFocus.copy(P);}
  else g.lastFocus=P.clone();
}
function gxFocus(g,pl,instant,kb){
  const T=g.T;
  if(g.focus&&g.focus!==pl)gxGlow(g.focus,false);
  g.focus=pl;g.lastFocus=null;gxGlow(pl,true);gxPanel(g,pl,kb);
  const P=pl.pivot.getWorldPosition(new T.Vector3()),thSun=Math.atan2(-P.x,-P.z);   // kamera zo strany slnka = osvetlena pologula
  g.controls.minDistance=Math.max(pl.R*1.8,3);g.controls.autoRotateSpeed=0.22;
  // vzdialenost tak, aby sa planeta s prstencami a mesiacmi zmestila do volnej casti (vedla panelu / nad panelom na mobile)
  const tv=Math.tan(T.MathUtils.degToRad(g.camera.fov)/2),wide=g.w>=720;
  const vis=Math.max(120,Math.min(wide?g.w-g.panelW-24:g.w,wide?g.h-64:g.h*0.46));
  const dist=Math.max(pl.f.ext,pl.R*2.4)*0.83*g.h/(tv*vis);
  const tp=g._ft||(g._ft=new T.Vector3());
  gxTween(g,()=>pl.pivot.getWorldPosition(tp),new T.Spherical(dist,T.MathUtils.degToRad(60),thSun+1.1),instant);
}
function gxUnfocus(g,instant){
  if(g.focus)gxGlow(g.focus,false);
  g.focus=null;g.lastFocus=null;gxPanel(g,null);
  g.controls.minDistance=14;g.controls.autoRotateSpeed=0.35;
  const Z=new g.T.Vector3();gxTween(g,()=>Z,g.home.clone(),instant);
}
function gxViewOffset(g,dt,snap){   // otvoreny panel -> planeta sa vycentruje vo volnej casti (vlavo / nad panelom na mobile)
  const want=g.focus?(g.w>=720?{x:Math.round(Math.min(g.w*0.22,g.panelW/2+8)),y:0}:{x:0,y:Math.round(g.h*0.2)}):{x:0,y:0};
  if(!g.vo)g.vo={x:0,y:0};
  const k=(snap||g.RM)?1:1-Math.exp(-(dt||0.016)*7);
  let nx=g.vo.x+(want.x-g.vo.x)*k,ny=g.vo.y+(want.y-g.vo.y)*k;
  if(Math.abs(nx-want.x)<0.25&&Math.abs(ny-want.y)<0.25){nx=want.x;ny=want.y;}
  g.vo.x=nx;g.vo.y=ny;
  const key=nx.toFixed(1)+','+ny.toFixed(1);if(key===g.voKey)return;g.voKey=key;
  if(!nx&&!ny)g.camera.clearViewOffset();else g.camera.setViewOffset(g.w,g.h,nx,ny,g.w,g.h);

function gxResize(g){
  const w=g.stage.clientWidth,h=g.stage.clientHeight;
  if(!w||!h||(w===g.w&&h===g.h))return;
  g.w=w;g.h=h;g.renderer.setSize(w,h,false);g.composer.setSize(w,h);g.labelR.setSize(w,h);
  g.camera.aspect=w/h;g.camera.updateProjectionMatrix();g.voKey='';gxViewOffset(g,0,true);
  g.starMat.uniforms.uPR.value=g.pr;
  if(g.built){gxHome(g);if(!g.touched&&!g.focus&&!g.tw)gxApplyHome(g);}
