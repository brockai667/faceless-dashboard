name: Stav pripojeni

# Rucna kontrola: stiahne /data.json z Rendera a vypise len stav pripojeni a cisla (ziadne tokeny).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Conn
        env:
          DASH_PASS: ${{ secrets.DASH_PASS }}
          DASH_URL: https://facelessfactory-dashboard.onrender.com
        run: |
          cat > c.py <<'PY'
          import base64, json, os, urllib.request
          req = urllib.request.Request(os.environ["DASH_URL"] + "/data.json", headers={"User-Agent": "ff-check"})
          req.add_header("Authorization", "Basic " + base64.b64encode(("dash:" + os.environ["DASH_PASS"]).encode()).decode())
          d = json.load(urllib.request.urlopen(req, timeout=120))
          print("keys:", list(d) if isinstance(d, dict) else type(d), "gen_at:", d.get("gen_at"), "projects:", len(d.get("projects") or []))
          for p in d.get("projects", d if isinstance(d, list) else []):
              print("==", p.get("name"), "->", p.get("label"), "| status:", json.dumps(p.get("status"))[:200])
              for k, v in (p.get("conn") or {}).items():
                  print("   ", k, v.get("state"), "-", (v.get("note") or "")[:160])
              tv = sorted((v for v in p.get("videos") or [] if (v.get("platform") or "").lower() == "tiktok"), key=lambda v: str(v.get("published")))
              if tv:
                  print("    tiktok videa:", len(tv), "najnovsie:", [(str(v.get("published"))[:10], v.get("views")) for v in tv[-4:]])
              for k in ("youtube", "tiktok", "instagram"):
                  x = p.get(k)
                  if isinstance(x, dict):
                      print("   ", k, {a: b for a, b in x.items() if not isinstance(b, (list, dict))})
          PY
          python c.py
      - name: data.json ako artefakt (lokalny test UI na realnych datach, 1 den)
        env:
          DASH_PASS: ${{ secrets.DASH_PASS }}
        run: curl -sf -u "dash:$DASH_PASS" -o data.json https://facelessfactory-dashboard.onrender.com/data.json && curl -sf -u "dash:$DASH_PASS" -o history.json https://facelessfactory-dashboard.onrender.com/history.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: dash-data
          path: |
            data.json
            history.json
          retention-days: 1
          if-no-files-found: ignore
