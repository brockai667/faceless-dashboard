<!doctype html><html lang="sk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FacelessFactory · Centrála</title>
<meta name="theme-color" content="#06080c">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2306080c' stroke='%23c4f25a' stroke-width='1.4'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23eef1f6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* Dizajn: tmavá „riadiaca stanica“. Jeden akcent (lime) = živé / rast. Farby fabrík a platforiem sú dátové.
   Rádiusy: panely 18px, vnútorné dlaždice 12px, interaktívne pilulky plné. */
:root{
  --bg:#06080c; --bg1:#0a0d13; --bg2:#0e121a;
  --s1:rgba(255,255,255,.026); --s2:rgba(255,255,255,.05); --s3:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --tx:#eef1f6; --tx2:#c8cfda; --mut:#8e97a7; --mut2:#5f6776;
  --acc:#c4f25a; --accbg:rgba(196,242,90,.12); --dn:#ff7d6e; --dnbg:rgba(255,125,110,.12); --warn:#ffc95c;
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:18px; --r2:12px;
  --out:cubic-bezier(.23,1,.32,1); --inout:cubic-bezier(.77,0,.175,1); --drawer:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;min-height:100dvh}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:rgba(196,242,90,.28)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--mut)}
.ph{line-height:1;vertical-align:-.12em}

/* ---------- pozadie ---------- */
.bgglow{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(900px 520px at 12% -8%,rgba(120,140,180,.13),transparent 62%),
             radial-gradient(700px 500px at 100% 30%,rgba(196,242,90,.035),transparent 60%),
             linear-gradient(180deg,#080a10,#05070a 60%)}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}

/* ---------- hlavička ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(6,8,12,.72);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;padding:0 28px;height:60px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font:600 15.5px/1 var(--sans);letter-spacing:-.01em;white-space:nowrap}
.brand .mk{width:22px;height:22px;border-radius:50%;flex:0 0 22px;border:1.5px solid var(--acc);display:grid;place-items:center}
.brand .mk::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--tx)}
.brand small{color:var(--mut2);font:500 12.5px/1 var(--sans)}
nav.nav{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
nav.nav::-webkit-scrollbar{display:none}
nav.nav a{padding:7px 12px;border-radius:999px;color:var(--mut);font-weight:500;font-size:13.5px;white-space:nowrap;transition:color .2s ease,background-color .2s ease}
nav.nav a:hover{color:var(--tx);background:var(--s2)}
nav.nav a.on{color:var(--tx);background:var(--s3)}
nav.nav a.ext .ph{font-size:11px;margin-left:3px;opacity:.6}
nav.nav .sep{width:1px;height:16px;background:var(--line2);margin:0 8px;flex:0 0 1px}
.meta{display:flex;align-items:center;gap:14px;white-space:nowrap}
.upd{color:var(--mut2);font:12px var(--mono)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font:600 13px/1.2 var(--sans);
  background:var(--tx);color:#0a0c10;transition:transform .16s var(--out),background-color .2s ease}
.btn:hover{background:#fff}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.7;cursor:progress}
.btn .ph{font-size:14px}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(0,0,0,.2);border-top-color:#0a0c10;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- layout ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:0 28px 90px}
section{scroll-margin-top:76px}
.sh{margin:88px 0 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sh h2{font:600 28px/1.1 var(--sans);letter-spacing:-.03em}
.sh p{color:var(--mut);font-size:14px;margin-top:8px;max-width:62ch}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.06em;color:var(--mut);display:inline-flex;align-items:center;gap:8px}
.eyebrow .live{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(196,242,90,.5);animation:ping 2.2s var(--out) infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(196,242,90,0)}100%{box-shadow:0 0 0 0 rgba(196,242,90,0)}}
.panel-s{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:var(--r)}

/* reveal */
.rv{opacity:0;transform:translateY(14px)}
.rv.in{opacity:1;transform:none;transition:opacity .7s var(--out),transform .7s var(--out);transition-delay:var(--d,0ms)}

/* ---------- malé prvky ---------- */
.d{display:inline-flex;align-items:center;gap:2px;font:600 11.5px/1 var(--mono);padding:4px 7px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.d.up{color:var(--acc);background:var(--accbg)}
.d.dn{color:var(--dn);background:var(--dnbg)}
.d.z{color:var(--mut);background:var(--s2)}
.pt-dot{display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--p);flex:0 0 6px}
.pb{display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;
  background:color-mix(in srgb,var(--c) 15%,transparent);color:color-mix(in srgb,var(--c) 75%,#fff);white-space:nowrap}
.orb{display:inline-block;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--c) 35%,#fff),var(--c) 48%,color-mix(in srgb,var(--c) 25%,#000) 100%)}
.orb.dim{filter:saturate(.35) brightness(.75)}
.q{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font:600 11px/1 var(--mono);color:var(--warn);background:rgba(255,201,92,.12);cursor:help;vertical-align:1px}
.xm{font:600 11px/1 var(--mono);color:var(--acc);background:var(--accbg);padding:3px 6px;border-radius:999px;white-space:nowrap}
.spark{display:block;width:100%;height:auto;overflow:visible}
.spark .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--out) forwards .25s}
@keyframes draw{to{stroke-dashoffset:0}}
.nospark{font-size:12px;color:var(--mut2);padding:10px 0}
.lab{font:500 12px/1.2 var(--sans);color:var(--mut)}

/* ---------- hero ---------- */
.hero{padding-top:56px}
.hgrid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:56px;align-items:end}
.hl h1{margin:22px 0 0;font:600 clamp(64px,9.4vw,128px)/.9 var(--sans);letter-spacing:-.055em;font-variant-numeric:tabular-nums;white-space:nowrap}
.hl h1 .ap{color:var(--mut2);font-weight:500;font-size:.5em;vertical-align:.5em;margin-right:.08em;letter-spacing:0}
.hl .hu{display:block;font:500 clamp(17px,1.6vw,21px)/1.35 var(--sans);letter-spacing:-.01em;color:var(--tx2);margin-top:16px}
.hl .hctx{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:18px;font-size:14px;color:var(--mut)}
.hl .hctx b{color:var(--tx);font-weight:500}
.hl .hstate{margin-top:26px;font-size:15px;color:var(--mut);max-width:46ch}
.hl .hstate b{color:var(--tx);font-weight:600}
.hc{position:relative;padding:18px 18px 10px}
.hc .chh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 8px;font-size:12.5px;color:var(--mut)}
.hc .chh b{color:var(--tx);font-weight:500}

/* graf s hoverom */
.ch{position:relative;touch-action:pan-y}
.ch svg{display:block;width:100%;height:auto;overflow:visible}
.ch text{fill:var(--mut2);font:500 10.5px var(--mono)}
.ch .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s var(--out) forwards .15s}
.ch .ar{opacity:0;animation:fadein .9s ease forwards .5s}
@keyframes fadein{to{opacity:1}}
.ch .bar{transform-box:fill-box;transform-origin:bottom;animation:barup .8s var(--out) both}
@keyframes barup{from{transform:scaleY(0)}}
.ch .cur{opacity:0;transition:opacity .12s ease}
.ch.hov .cur{opacity:1}
.chtip{position:absolute;left:0;top:0;pointer-events:none;padding:7px 10px;border-radius:10px;background:rgba(14,18,26,.94);border:1px solid var(--line2);
  font-size:12px;white-space:nowrap;opacity:0;transform:translate(-50%,calc(-100% - 12px));transition:opacity .12s ease;z-index:3;box-shadow:0 12px 30px -12px #000}
.chtip b{font-weight:600}
.chtip .r{display:flex;gap:10px;justify-content:space-between;color:var(--mut)}
.chtip .r b{color:var(--tx);font-family:var(--mono)}
.ch.hov .chtip{opacity:1}

/* KPI pás */
.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:48px}
.band > div{padding:22px 24px 22px;min-width:0;position:relative}
.band > div + div{border-left:1px solid var(--line)}
.band .v{font:600 clamp(30px,3vw,40px)/1 var(--sans);letter-spacing:-.04em;margin:14px 0 10px;font-variant-numeric:tabular-nums}
.band .s{font-size:12.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.band .spark{margin-top:14px;max-width:220px}
.stack{display:flex;height:6px;border-radius:99px;overflow:hidden;margin-top:14px;background:var(--s2);gap:2px}
.stack i{display:block;height:100%;border-radius:99px;transform-origin:left;animation:grow 1s var(--out) both .35s}
@keyframes grow{from{transform:scaleX(0)}}
.orbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.orbs .orb{width:12px;height:12px}
.hit .ttl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;font-size:14px;line-height:1.35;margin-top:12px;color:var(--tx2);transition:color .2s ease}
.hit .ttl:hover{color:#fff}
.hit .v{font-size:clamp(26px,2.6vw,34px);margin:10px 0 10px}

/* platformy + na dnes */
.row2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;margin-top:16px}
.plats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ptile{position:relative;padding:18px 18px 16px;overflow:hidden;min-width:0}
.ptile::before{content:'';position:absolute;left:18px;right:18px;top:0;height:2px;border-radius:0 0 2px 2px;background:var(--p)}
.ptile .ph1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--tx2);font-weight:500}
.ptile .ph1 a{color:var(--mut);font-size:12px}
.ptile .ph1 a:hover{color:var(--tx)}
.ptile .fv{font:600 30px/1 var(--sans);letter-spacing:-.035em;margin:14px 0 8px;font-variant-numeric:tabular-nums}
.ptile .fs{font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ptile .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.ptile .kv b{display:block;color:var(--tx);font:600 15px/1.25 var(--sans);margin-top:3px;font-variant-numeric:tabular-nums}
.ptile .spark{margin-top:12px}
.ptile .warn{margin-top:10px;font-size:11.5px;color:var(--warn);line-height:1.4}
.today{padding:20px 20px 16px;min-width:0;display:flex;flex-direction:column}
.today h3{font:600 15px/1.2 var(--sans);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.today h3 small{font:500 12px var(--mono);color:var(--mut2)}
.tl{list-style:none;margin-top:14px;display:grid;gap:2px}
.tl li{display:grid;grid-template-columns:3px minmax(0,1fr);gap:12px;padding:9px 8px 9px 0;border-radius:10px;font-size:13px;line-height:1.45;color:var(--tx2)}
.tl li::before{content:'';border-radius:3px;background:var(--t);opacity:.9}
.tl li.l0{--t:var(--dn)}.tl li.l1{--t:var(--warn)}.tl li.l2{--t:var(--acc)}
.tl .who{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tl .who button{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);padding:2px 8px 2px 4px;border-radius:999px;border:1px solid var(--line);transition:color .2s ease,border-color .2s ease}
.tl .who button:hover{color:var(--tx);border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.tl .who .orb{width:10px;height:10px}
.xps{margin-top:auto;padding-top:14px}
.xrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r2);background:var(--s1);border:1px solid var(--line);font-size:12.5px;margin-top:8px;text-align:left;width:100%}
.xrow .xn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)}
.xrow .xn b{color:var(--tx);font-weight:600}

/* ---------- galaxia ---------- */
.gx{display:grid;grid-template-columns:minmax(0,1fr) 320px;overflow:hidden;
  background:radial-gradient(ellipse 60% 70% at 38% 50%,rgba(120,140,190,.10),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.012))}
.gxbox{position:relative;min-width:0}
#gx{display:block;width:100%;height:520px;touch-action:pan-y}
.gkey{position:absolute;left:20px;top:18px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--mut);pointer-events:none;max-width:calc(100% - 40px)}
.gkey span{display:inline-flex;align-items:center;gap:7px}
.gkey i{display:inline-block;flex:0 0 auto}
.gkey .k1{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9aa3b2 50%,#2a2f3a)}
.gkey .k2{width:12px;height:12px;border-radius:50%;border:1px solid rgba(196,242,90,.7);box-shadow:0 0 0 3px rgba(196,242,90,.12)}
.gkey .k3{width:16px;height:0;border-top:1px dashed rgba(255,255,255,.35)}
.gtip{position:absolute;left:0;top:0;pointer-events:none;width:232px;padding:14px 14px 12px;border-radius:14px;
  background:rgba(12,15,22,.94);border:1px solid var(--line2);box-shadow:0 22px 50px -18px #000;opacity:0;transform:scale(.97);
  transform-origin:var(--to,left center);transition:opacity .14s ease,transform .14s var(--out);font-size:12.5px;z-index:4}
.gtip.on{opacity:1;transform:none}
.gtip.touch{pointer-events:auto}
.gtip h4{font:600 15px/1.2 var(--sans);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.gtip h4 .orb{width:12px;height:12px}
.gtip .r{display:flex;justify-content:space-between;gap:12px;color:var(--mut);padding:2.5px 0}
.gtip .r b{color:var(--tx);font:500 12.5px var(--mono)}
.gtip .go{margin-top:10px;color:var(--acc);font-weight:500;font-size:12px;display:flex;align-items:center;gap:6px}
.gtip button.go{width:100%;justify-content:center;padding:9px;border-radius:999px;background:var(--accbg)}
.rank{border-left:1px solid var(--line);padding:18px 12px 14px;display:flex;flex-direction:column;min-width:0;max-height:620px;overflow:auto;scrollbar-width:thin}
.rank h3{font:600 14px/1.2 var(--sans);padding:0 8px 10px;display:flex;justify-content:space-between;align-items:baseline}
.rank h3 small{font:500 11.5px var(--mono);color:var(--mut2)}
.rank .grp{font:500 11.5px var(--mono);color:var(--mut2);padding:14px 8px 6px}
.rr{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 8px;border-radius:10px;text-align:left;width:100%;
  transition:background-color .18s ease}
.rr:hover,.rr.on{background:var(--s2)}
.rr .orb{width:12px;height:12px}
.rr .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .sb{height:3px;border-radius:3px;background:var(--s2);margin-top:6px;overflow:hidden}
.rr .sb i{display:block;height:100%;border-radius:3px;background:var(--c);transform-origin:left;animation:grow 1s var(--out) both .4s}
.rr .vv{font:500 12.5px var(--mono);text-align:right;white-space:nowrap}
.rr .vv small{display:block;font-size:10.5px;color:var(--mut2);margin-top:2px}
.rr.sleep .nm{color:var(--mut)}

/* ---------- karty fabrík ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,370px),1fr));gap:16px}
.fc{--c:#8ea6ff;position:relative;padding:22px;min-width:0;cursor:pointer;overflow:hidden;
  transition:transform .35s var(--out),border-color .25s ease,background-color .25s ease}
.fc::before{content:'';position:absolute;inset:0 0 auto 0;height:180px;pointer-events:none;
  background:radial-gradient(420px 180px at 18% -30%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);opacity:.9;transition:opacity .35s ease}
.fc > *{position:relative}
@media(hover:hover) and (pointer:fine){
  .fc:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 38%,transparent)}
  .fc:hover::before{opacity:1.4}
  .fc:hover .more .ph{transform:translateX(3px)}
}
.fc:active{transform:scale(.995)}
.fh{display:flex;align-items:center;gap:12px}
.fh .orb{width:34px;height:34px}
.fh .fn{min-width:0;flex:1}
.fh h3{font:600 19px/1.15 var(--sans);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh .ni{font-size:12px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-flex;align-items:center;gap:7px;font:500 11.5px/1 var(--mono);color:var(--acc);padding:5px 9px;border-radius:999px;background:var(--accbg);white-space:nowrap}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 rgba(196,242,90,.5);animation:ping 2.2s var(--out) infinite}
.st.new{color:var(--warn);background:rgba(255,201,92,.12)}
.st.new::before{animation:none}
.wk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,150px);gap:16px;align-items:end;margin:24px 0 18px}
.wk .big{font:600 46px/1 var(--sans);letter-spacing:-.045em;font-variant-numeric:tabular-nums;white-space:nowrap}
.wk .big .ap{color:var(--mut);font-weight:500;margin-right:4px}
.wk .sub{font-size:12.5px;color:var(--mut);margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.wk .cap{font:500 10.5px var(--mono);color:var(--mut2);margin-top:6px;text-align:right}
.mp{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.mp > div{position:relative;padding:11px 12px 10px;border-radius:var(--r2);background:var(--s1);border:1px solid var(--line);min-width:0}
.mp > div::before{content:'';position:absolute;left:12px;top:-1px;width:18px;height:2px;border-radius:2px;background:var(--p)}
.mp .pn{font-size:11.5px;color:var(--mut)}
.mp .pf{font:600 18px/1 var(--sans);margin:8px 0 6px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* ---------- model (všetky výpočty na jednom mieste) ---------- */
function histRows(){
  return (Array.isArray(HIST)?HIST:[]).filter(h=>h&&typeof h==='object'&&!h.gap&&h.date&&String(h.date)>=RELIABLE_FROM&&h.fac&&typeof h.fac==='object')
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function rowOnOrBefore(rows,ds){let r=null;for(const h of rows){if(h.date<=ds)r=h;else break;}return r;}
function followers(p,k){
  if(k==='youtube')return num(p.yt&&p.yt.subs);
  if(k==='tiktok')return num(p.tiktok&&p.tiktok.followers);
  return num(p.instagram&&p.instagram.followers);
}
function hasAcct(p,k,vids){
  const o=k==='youtube'?p.yt:k==='tiktok'?p.tiktok:p.instagram;
  return !!(o&&typeof o==='object')||vids.some(v=>v._k===k);
}
/* Rady: pravidlá zo starej verzie (renderTips), nad spoľahlivými číslami.
   key='tkmiss' = rovnaká rada pre viac fabrík, v „Na dnes“ sa zlúči do jednej. */
function tipsFor(P){
  const p=P.raw, tips=[], add=(lvl,txt,key)=>tips.push({lvl,txt,key:key||'',P});
  if(P.idle>3&&P.idle<999)add(0,`Nič nové nevyšlo ${P.idle} dní. Skontroluj beh fabriky.`);
  const s14=dayStr(14);
  let best=null;
  PLATS.filter(k=>!ONLY[p.name]||ONLY[p.name].includes(k)).forEach(k=>{
    const x=P.per[k], pv=P.vids.filter(v=>v._k===k);
    if(!pv.length&&!x.followers&&!(k==='tiktok'&&P.tkMissing))return;   // platforma nepoužívaná
    const n14=pv.filter(v=>String(v.published||'')>=s14).length;
    if(k==='tiktok'&&P.tkMissing){add(1,'TikTok: zoznam videí dnes z API nedorazil. Čísla TikToku sú neúplné, presné budú zajtra.','tkmiss');return;}
    if(n14===0)add(0,`${PN[k]}: za 14 dní tam nevyšlo žiadne video. Fabrika tam zrejme neposiela.`);
    else if(x.wkViews>=300&&x.delta!=null&&x.delta<=0)add(1,`${PN[k]}: +${fmt(x.wkViews)} zhliadnutí nových videí za 7 dní, ale žiadni noví sledovatelia. Na koniec videa daj dôvod sledovať (séria, „časť 2 zajtra“).`);
    if(x.wkViews>0&&(!best||x.wkViews>best.dv))best={k,dv:x.wkViews};
  });
  if(best&&P.plats.length>1)add(2,`Najviac ťahá ${PN[best.k]}: ${fmt(best.dv)} zhliadnutí nových videí za 7 dní. Tu sa oplatí pridať frekvenciu.`);
  const nv=P.week.filter(v=>v._views>0).sort((x,y)=>y._views-x._views);
  if(nv.length>=3){const top=nv[0], med=nv[Math.floor(nv.length/2)]._views||1;
    if(top._views>=2*med)add(2,`Hit týždňa „${esc(String(top.title||'').slice(0,60))}“ (${fmt(top._views)} zhliad., ${Math.round(top._views/med)}× medián). Sprav ďalšie na rovnakú tému alebo hák.`);}
  return tips.sort((x,y)=>x.lvl-y.lvl);
}
function build(){
  const rows=histRows(), last=rows.length?rows[rows.length-1]:null, base7=rowOnOrBefore(rows,dayStr(7));
  const s7=dayStr(7), s14=dayStr(14), s30=dayStr(30), tail=rows.slice(-31);
  const projects=DATA.projects.filter(p=>p&&typeof p==='object'&&p.name).map(p=>{
    const color=colOf(p), label=String(p.label||p.name);
    const vids=(Array.isArray(p.videos)?p.videos:[]).filter(v=>v&&typeof v==='object')
      .map(v=>Object.assign({},v,{_k:plat(v),_views:num(v.views),_fac:p.name,_label:label,_color:color}));
    const plats=PLATS.filter(k=>ONLY[p.name]?ONLY[p.name].includes(k):hasAcct(p,k,vids));
    const allPlats=PLATS.filter(k=>hasAcct(p,k,vids));
    const pubs=vids.map(v=>String(v.published||'').slice(0,10)).filter(Boolean).sort();
    const lastPub=pubs.length?pubs[pubs.length-1]:null, idle=daysSince(lastPub);
    const fresh=!!(p.tiktok&&num(p.tiktok.videos)>0&&num(p.tiktok.videos)<=3);   // nový účet / nová séria
    const tkMissing=!!(p.tiktok&&num(p.tiktok.videos)>0&&!vids.some(v=>v._k==='tiktok'));   // TikTok API dnes nevrátil videá
    const hb=base7&&base7.fac?base7.fac[p.name]:null, hl=last&&last.fac?last.fac[p.name]:null;
    const per={};
    PLATS.forEach(k=>{
      const pv=vids.filter(v=>v._k===k);
      const w=pv.filter(v=>String(v.published||'')>=s7).sort((a,b)=>b._views-a._views);
      const m30=pv.filter(v=>String(v.published||'')>=s30);
      const f=followers(p,k), prev=hb&&hb[HF[k]]!=null?num(hb[HF[k]]):null;
      const vNow=hl&&hl[HV[k]]!=null?num(hl[HV[k]]):null, v7=hb&&hb[HV[k]]!=null?num(hb[HV[k]]):null;
      per[k]={followers:f,delta:prev==null?null:f-prev,wkViews:w.reduce((s,v)=>s+v._views,0),wkCount:w.length,
        median:median(m30.map(v=>v._views)),n30:m30.length,top:w[0]||null,
        missing:k==='tiktok'&&tkMissing, lastTotal:vNow, est7:(vNow!=null&&v7!=null)?Math.max(0,vNow-v7):null,
        link:safeUrl(p.channels&&p.channels[k]&&p.channels[k].link)||safeUrl(p.links&&p.links[k]),
        hist:tail.map(r=>{const x=r.fac[p.name];return x&&x[HF[k]]!=null?num(x[HF[k]]):null;})};
    });
    const sumP=(ks,fn)=>ks.reduce((s,k)=>s+fn(per[k]),0);
    // fabrika = jej aktívne platformy (ONLY); sieť = všetky účty
    const foll=sumP(plats,x=>x.followers), dKnown=plats.some(k=>per[k].delta!=null);
    const follNet=sumP(allPlats,x=>x.followers), dNetKnown=allPlats.some(k=>per[k].delta!=null);
    const week=vids.filter(v=>plats.includes(v._k)&&String(v.published||'')>=s7).sort((a,b)=>b._views-a._views);
    const prevCount=vids.filter(v=>{const d=String(v.published||'');return plats.includes(v._k)&&d>=s14&&d<s7;}).length;
    // denný prírastok zhliadnutí z histórie (len platformy fabriky, záporné = 0)
    const series=[];
    for(let i=1;i<rows.length;i++){
      const a=rows[i-1].fac[p.name], b=rows[i].fac[p.name];
      let v=0; if(a&&b)plats.forEach(k=>{v+=Math.max(0,num(b[HV[k]])-num(a[HV[k]]));});
      series.push({date:rows[i].date,v});
    }
    const wkViews=week.reduce((s,v)=>s+v._views,0);
    const miss=plats.filter(k=>per[k].missing);
    const est=sum(miss.map(k=>per[k].est7||0));
    const P={name:p.name,label,color,niche:String(p.niche||''),raw:p,vids,plats,allPlats,per,idle,lastPub,fresh,
      active:idle<=14||fresh,foll,dFoll:dKnown?sumP(plats,x=>num(x.delta)):null,
      follNet,dFollNet:dNetKnown?sumP(allPlats,x=>num(x.delta)):null,
      week,wkViews,wkCount:week.length,prevCount,top:week[0]||null,
      median30:median(vids.filter(v=>plats.includes(v._k)&&String(v.published||'')>=s30).map(v=>v._views)),
      tkMissing,partial:miss.length>0,allUnknown:plats.length>0&&miss.length===plats.length,est,approx:miss.length>0&&est>0,
      wkShow:wkViews+est,
      series:series.slice(-30),experiment:(p.experiment&&typeof p.experiment==='object')?p.experiment:null};
    P.tips=tipsFor(P);
    return P;
  });
  const byName={};projects.forEach(P=>byName[P.name]=P);
  const net={foll:0,dFoll:null,wkViews:0,est:0,wkCount:0,prevCount:0,perPlat:{youtube:0,tiktok:0,instagram:0},series:[],best:null,plat:{},partial:false};
  PLATS.forEach(k=>net.plat[k]={foll:0,delta:null,views:0,count:0,missing:false,hist:tail.map(()=>null),has:false});
  projects.forEach(P=>{
    net.foll+=P.follNet; if(P.dFollNet!=null)net.dFoll=(net.dFoll||0)+P.dFollNet;
    net.wkViews+=P.wkViews; net.est+=P.active?P.est:0; net.wkCount+=P.wkCount; net.prevCount+=P.prevCount;
    if(P.active&&P.partial)net.partial=true;
    P.week.forEach(v=>{net.perPlat[v._k]=(net.perPlat[v._k]||0)+1;});
    P.allPlats.forEach(k=>{const x=P.per[k],N=net.plat[k];N.has=true;N.foll+=x.followers;
      if(x.delta!=null)N.delta=(N.delta||0)+x.delta;
      if(P.plats.includes(k)){N.views+=x.wkViews;N.count+=x.wkCount;if(x.missing&&P.active)N.missing=true;}
      x.hist.forEach((v,i)=>{if(v!=null)N.hist[i]=(N.hist[i]||0)+v;});});
    if(P.top&&(!net.best||P.top._views>net.best._views))net.best=P.top;
  });
  net.follHist=tail.map((_,i)=>{let s=0,any=false;PLATS.forEach(k=>{const v=net.plat[k].hist[i];if(v!=null){s+=v;any=true;}});return any?s:null;});
  const sd={};projects.forEach(P=>P.series.forEach(s=>{sd[s.date]=(sd[s.date]||0)+s.v;}));
  net.series=Object.keys(sd).sort().map(d=>({date:d,v:sd[d]})).slice(-30);
  const sv=net.series.map(s=>s.v);
  net.grow7=sv.length>=7?sum(sv.slice(-7)):null; net.growPrev=sv.length>=14?sum(sv.slice(-14,-7)):null;
  if(net.best){const B=byName[net.best._fac];const pk=B&&B.per[net.best._k];net.bestX=pk&&pk.median>0?net.best._views/pk.median:0;}
  const active=projects.filter(P=>P.active).sort((a,b)=>b.wkShow-a.wkShow||b.foll-a.foll);
  const inactive=projects.filter(P=>!P.active).sort((a,b)=>a.idle-b.idle||b.follNet-a.follNet);
  return {projects,byName,net,active,inactive,order:[...active,...inactive],rows,tail};
}

/* ---------- render: hero ---------- */
function todayItems(){

  if(tk.length)items.push({lvl:1,txt:'TikTok: zoznam videí dnes z API nedorazil. Čísla TikToku sú neúplné, presné budú zajtra.',who:tk});

function renderHero(){

  const stackTot=Math.max(1,PLATS.reduce((s,k)=>s+(n.perPlat[k]||0),0));

/* ---------- galaxia (canvas 2D) ----------
   Jadro = sieť. Vnútorná dráha = aktívne fabriky, vonkajší pás = spiace.
   Veľkosť = sledovatelia (sqrt), vlny + prúd častíc do jadra = zhliadnutia 7 d, prstenec = hit týždňa.
   Popisky sa umiestňujú bez kolízií (8 kandidátov, hysterézia). */
const GX={raf:0,on:true,hover:null,focus:null,sel:null,cleanup:null,redraw:null};
function initGalaxy(){
  if(GX.cleanup)GX.cleanup();
  const cv=$('#gx'), box=$('#gxbox'), tip=$('#gtip');
  if(!cv||!cv.getContext)return;
  const ctx=cv.getContext('2d');
  const ps=M.projects; if(!ps.length)return;
  const act=M.active, ina=[...M.inactive].sort((a,b)=>b.follNet-a.follNet);
  const maxF=Math.max(1,...ps.map(P=>P.follNet)), maxW=Math.max(1,...act.map(P=>P.wkShow));
  const bestFac=M.net.best?M.net.best._fac:null;
  const B=[...act.map((P,i)=>({P,ring:0,i,n:act.length})),...ina.map((P,i)=>({P,ring:1,i,n:ina.length}))];
  B.forEach((b,j)=>{b.j=j;b.ph=j*2.17;b.g=b.P.active?Math.sqrt(b.P.wkShow/maxW):0;b.f=Math.sqrt(b.P.follNet/maxF);
    b.cand=-1;b.parts=[];b.x=0;b.y=0;b.r=0;b.e=1;b.base=0;b.R=0;b.lab=null;});
  GX.hover=null;GX.sel=null;
  let W=0,H=0,cx=0,cy=0,sx=1,R1=0,R2=0,mobile=false,stars=[],t=0,last=0,intro=RM?99:0,coreR=20,started=false;
  const FS='Geist,ui-sans-serif,system-ui,sans-serif', FM='"Geist Mono",ui-monospace,monospace';
  const coreTxt=(M.net.est?'≈ ':'')+fmtc(M.net.wkViews+M.net.est);
  function layoutAngles(){
    const TAU=Math.PI*2, bottom=Math.PI/2;
    const angDist=(a,b)=>{let d=Math.abs(((a-b)%TAU+TAU)%TAU);return Math.min(d,TAU-d);};
    const na=act.length, ni=ina.length;
    // aktívne: posun, ktorý drží planéty mimo spodku (tam je text jadra)
    let bestO=0,bestS=-1;
    for(let k=0;k<36;k++){const o=k/36*TAU;let s=9;for(let i=0;i<na;i++)s=Math.min(s,angDist(o+i*TAU/na,bottom));if(s>bestS+1e-6){bestS=s;bestO=o;}}
    B.filter(b=>!b.ring).forEach(b=>b.base=bestO+b.i*TAU/Math.max(1,na));
    // spiace: posun s max. odstupom od aktívnych (v pixeloch)
    const pa=B.filter(b=>!b.ring).map(b=>[cx+R1*sx*Math.cos(b.base),cy+R1*Math.sin(b.base),b.r]);
    let bo=0,bs=-1;
    for(let k=0;k<48;k++){const o=k/48*TAU/Math.max(1,ni);let s=1e9;
      for(let i=0;i<ni;i++){const a=o+i*TAU/ni-Math.PI/2,x=cx+R2*sx*Math.cos(a),y=cy+R2*Math.sin(a);
        pa.forEach(p=>{s=Math.min(s,Math.hypot(x-p[0],y-p[1])-p[2]);});
        s=Math.min(s,Math.abs(y-(cy+coreR+30))*3+Math.abs(x-cx));}
      if(s>bs){bs=s;bo=o;}}
    B.filter(b=>b.ring).forEach(b=>b.base=bo+b.i*TAU/Math.max(1,ni)-Math.PI/2);
  }
  function size(){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    W=Math.max(280,box.clientWidth||0); mobile=W<560;
    H=Math.round(mobile?Math.min(520,Math.max(380,W*1.12)):Math.min(620,Math.max(460,W*.62)));
    cv.style.height=H+'px'; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    cx=W/2; cy=H/2+(mobile?14:16);
    sx=mobile?1:Math.min(1.45,Math.max(1,W/H*.85));
    const Rm=Math.min((W/2-(mobile?40:96))/sx,H/2-(mobile?46:52));
    R1=Rm*(mobile?.6:.56); R2=Rm; coreR=mobile?14:20;
    B.forEach(b=>{b.r=(mobile?4.5:6.5)+(mobile?13:24)*b.f; if(b.ring)b.r*=.8; b.R=b.ring?R2:R1; b.cand=-1;});
    layoutAngles();
    // rozmery popiskov
    B.forEach(b=>{
      const two=!(mobile&&b.ring);
      ctx.font=`600 ${mobile?11:12.5}px ${FS}`; const w1=ctx.measureText(b.P.label).width;
      b.l2=b.ring?`spí ${b.P.idle>=999?'?':b.P.idle+' d'}`:`${b.P.allUnknown&&!b.P.est?'?':(b.P.approx?'≈ ':'')+fmtc(b.P.wkShow)} zhliad.`;
      ctx.font=`500 ${mobile?10:11}px ${FM}`; const w2=two?ctx.measureText(b.l2).width:0;
      b.lw=Math.max(w1,w2); b.lh=two?(mobile?27:31):(mobile?13:15); b.two=two;
    });
    stars=Array.from({length:Math.round(W*H/2600)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.05+.25,a:Math.random()*.5+.12,t:Math.random()*6.28,s:.5+Math.random()*1.6}));
    B.forEach(b=>{b.parts=[];if(!b.ring&&b.P.wkShow>0){const n=Math.max(3,Math.min(18,Math.round(2+Math.log10(b.P.wkShow+1)*3.6)));
      for(let k=0;k<n;k++)b.parts.push({u:(k+Math.random()*.6)/n,s:.07+Math.random()*.05});}});
    draw();
  }
  const ease=k=>1-Math.pow(1-Math.max(0,Math.min(1,k)),3);
  function place(){
    B.forEach(b=>{
      b.e=ease((intro-b.j*.07)/1.1);
      const a=b.base+(RM?0:(b.ring?.03:.055)*Math.sin(t*.2+b.ph));
      const R=b.R*(.35+.65*b.e);
      b.x=cx+R*sx*Math.cos(a); b.y=cy+R*Math.sin(a);
    });
  }
  function labels(){

function drawStars(){

/* ---------- count-up + reveal ---------- */
function countUp(el){
  const to=num(el.dataset.to);
  if(RM){el.textContent=fmt(to);return;}
  const dur=to>999?1400:900, t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,4);el.textContent=fmt(to*e);if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
function animateCounts(root){
  const els=$$('[data-to]',root);
  if(!window.IntersectionObserver){els.forEach(el=>el.textContent=fmt(num(el.dataset.to)));return;}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);countUp(e.target);}}),{threshold:.1});
  els.forEach(el=>io.observe(el));
}
function reveal(root){
  const els=$$('.rv:not(.in)',root);
  if(RM||!window.IntersectionObserver){els.forEach(e=>e.classList.add('in'));return;}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);e.target.classList.add('in');}}),{threshold:.08,rootMargin:'0px 0px -6% 0px'});
  els.forEach(el=>io.observe(el));
}

    <div class="d2">
      <div class="box panel-s" style="--c:${P.color}"><h3>Top video týždňa</h3>${topVideo(P.top,'Najlepšie za 7 dní',P)}${expBlock(P.experiment)}</div>
      <div class="box panel-s"><h3>Rady <small>z videí za 7 až 14 dní a sledovateľov</small></h3>${tipsBlock(P)}</div>
    </div>`;
}
function detailVideos(P){
  const s=DS.vt==='all'?'':dayStr(+DS.vt);
  let vs=P.vids.filter(v=>(DS.vp==='all'||v._k===DS.vp)&&(!s||String(v.published||'')>=s)).sort((a,b)=>b._views-a._views);
  const mx=Math.max(1,...vs.map(v=>v._views));
  const plats=P.allPlats.filter(k=>P.vids.some(v=>v._k===k));
  const segP=['all',...plats].map(k=>`<button type="button" class="${DS.vp===k?'on':''}" data-vp="${k}">${k==='all'?'Všetky':PN[k]}</button>`).join('');
  const segT=[['7','7 dní'],['30','30 dní'],['all','Všetko']].map(([k,l])=>`<button type="button" class="${DS.vt===k?'on':''}" data-vt="${k}">${l}</button>`).join('');
  const shown=vs.slice(0,60);
  const tkNote=P.tkMissing?'<div class="note" style="margin:0 0 12px;color:var(--warn)">TikTok dnes neposlal zoznam videí, TikTok videá v zozname chýbajú.</div>':'';
  return `<div class="fbar"><div class="seg" role="group" aria-label="Platforma">${segP}</div><div class="seg" role="group" aria-label="Obdobie">${segT}</div></div>${tkNote}
    <div class="muted" style="font-size:12px;margin-bottom:10px">${vs.length} ${plw(vs.length,'video','videá','videí')}${vs.length>shown.length?`, zobrazených ${shown.length}`:''}, zoradené podľa zhliadnutí</div>
    <div class="vl" style="--c:${P.color}">${shown.map((v,i)=>{const u=safeUrl(v.link), med=P.per[v._k]&&P.per[v._k].median, xm=med>0?v._views/med:0;
      return `<a class="vr" ${u?`href="${esc(u)}" target="_blank" rel="noopener noreferrer"`:''}>
        <span class="rk">${i+1}</span>
        <span style="min-width:0"><div class="vt">${esc(v.title||'(bez názvu)')}</div>
          <div class="vm">${pbadge(v._k)}<span>${esc(sDate(v.published)||'?')}</span><span><i class="ph ph-heart"></i>${fmt(v.likes)}</span>${num(v.comments)?`<span><i class="ph ph-chat-circle"></i>${fmt(v.comments)}</span>`:''}${xm>=2?`<span class="xm">${Math.round(xm)}× medián</span>`:''}</div></span>
        <span class="vv">${fmt(v._views)}<small>zhliad.</small></span>
        <span class="bar"><i style="width:${(v._views/mx*100).toFixed(1)}%;animation-delay:${Math.min(i,20)*20}ms"></i></span></a>`;}).join('')||'<div class="empty" style="margin:0">Žiadne videá v tomto výbere.</div>'}</div>`;
}
function detailGrowth(P){
  const dates=M.tail.map(r=>r.date);
  const lines=P.allPlats.map(k=>({name:PN[k],color:PC[k],vals:P.per[k].hist}));
  return `<div class="box panel-s"><h3>Denný prírastok zhliadnutí <small>${P.plats.map(k=>PN[k]).join(' + ')||'?'} · 30 dní</small></h3>
      ${barsChart(P.series,P.color)}<div class="note">História zhliadnutí sa berie až od 1. 10. 2026, staršie hodnoty boli držané a skresľovali by graf. Záporné zmeny = 0.</div></div>
    <div class="box panel-s" style="margin-top:12px"><h3>Sledovatelia <small>denný stav · 30 dní</small></h3>${linesChart(lines,dates)}</div>`;
}
function renderDetail(){
  const P=M.byName[DS.name]; if(!P)return;
  const i=M.order.findIndex(x=>x.name===P.name);
  const links=P.allPlats.map(k=>P.per[k].link?`<a href="${esc(P.per[k].link)}" target="_blank" rel="noopener noreferrer">${PN[k]}<i class="ph ph-arrow-up-right"></i></a>`:'').filter(Boolean).join('');
  const panel=$('#panel'); panel.style.setProperty('--c',P.color);
  panel.innerHTML=`<div class="dh">
      <div class="dbar"><div class="dnav"><button class="ib" type="button" data-step="-1" aria-label="Predošlá fabrika"><i class="ph ph-caret-left"></i></button>
        <button class="ib" type="button" data-step="1" aria-label="Ďalšia fabrika"><i class="ph ph-caret-right"></i></button><span class="dpos">${i+1} / ${M.order.length}</span></div>
        <button class="ib" type="button" data-close aria-label="Zavrieť"><i class="ph ph-x"></i></button></div>
      <div class="dtop"><span class="orb${P.active?'':' dim'}" style="--c:${P.color}" aria-hidden="true"></span><div style="min-width:0">
        <h2 id="dtitle">${esc(P.label)}</h2>
        <div class="ni">${P.active?(P.idle<=14?'<span class="st">vydáva</span>':'<span class="st new">nový účet</span>'):'<span class="d z">spí</span>'}<span>${esc(P.niche||'')}</span><span>${lastVid(P)}</span>${links}</div></div></div>
    </div>
    <div class="dtabs" role="tablist">${[['prehlad','Prehľad'],['videa','Videá'],['rast','Rast']].map(([k,l])=>`<button type="button" role="tab" aria-selected="${DS.tab===k}" class="${DS.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}<span class="ind na" aria-hidden="true"></span></div>
    <div class="db" id="db"></div>`;
  renderBody(false);
  requestAnimationFrame(()=>{placeInd();requestAnimationFrame(()=>{const ind=$('#panel .dtabs .ind');if(ind)ind.classList.remove('na');});});
}
function placeInd(){
  const on=$('#panel .dtabs button.on'), ind=$('#panel .dtabs .ind'); if(!on||!ind)return;
  ind.style.transform=`translateX(${on.offsetLeft+12}px) scaleX(${Math.max(.1,(on.offsetWidth-24)/100)})`;
}
function renderBody(anim){
  const P=M.byName[DS.name]; if(!P)return;
  const db=$('#db'); if(!db)return;
  db.innerHTML=DS.tab==='videa'?detailVideos(P):DS.tab==='rast'?detailGrowth(P):detailOverview(P);
  if(anim&&!RM){db.classList.remove('sw');void db.offsetWidth;db.classList.add('sw');}
  animateCounts(db); bindCharts(db);
}

/* ---------- celá stránka ---------- */
function renderAll(){
  M=build();
  const app=$('#app');
  if(!M.projects.length){
    app.innerHTML=`<div class="empty">Zatiaľ žiadne fabriky ani dáta. Spusti <code>python generate.py</code> alebo klikni na Obnoviť.</div>`;return;
  }
  app.innerHTML=renderHero()+renderGalaxyShell()+renderFactories()+
    `<footer>Dáta k ${esc(DATA.gen_at||'?')}. Zhliadnutia = súčet zhliadnutí videí publikovaných za posledných 7 dní (per-video dáta). Medián = videá za 30 dní.
     Sledovatelia: aktuálny stav vs. záznam v histórii spred 7 dní. Denné grafy z histórie od 1. 10. 2026.
     Keď TikTok API nepošle zoznam videí, TikTok sa neráta ako 0, ale ako neznámy (?) alebo odhad z profilu (≈).
     Rady sa riadia rovnakými pravidlami ako v starej verzii. <a href="/old">Stará verzia</a></footer>`;
  animateCounts(app); reveal(app); bindCharts(app);
  try{initGalaxy();}catch(e){console.error('galaxia:',e);}
  spyNav();
}
let _spy=null;
function spyNav(){
  if(!window.IntersectionObserver)return;
  if(_spy)_spy.disconnect();
  const links=$$('nav.nav a[data-sec]');
  _spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.dataset.sec===e.target.id));}),{rootMargin:'-45% 0px -50% 0px'});
  ['prehlad','galaxia','fabriky'].forEach(id=>{const s=document.getElementById(id);if(s)_spy.observe(s);});
}
function normalizeData(d){
  d=(d&&typeof d==='object')?d:{};
  d.projects=Array.isArray(d.projects)?d.projects:[];
  d.totals=d.totals||{}; d.prev=d.prev||{};
  return d;
}
function routeHash(){
  const h=location.hash||'';
  if(h.startsWith('#f/')){let n='';try{n=decodeURIComponent(h.slice(3));}catch(e){}
    if(M&&M.byName[n]){if(DS.name!==n)openDetail(n);}else closeDetail(true);}
  else closeDetail(true);
}
async function load(){
  try{
    const [dRes,hRes]=await Promise.all([fetch('/data.json?'+Date.now()),fetch('/history.json?'+Date.now()).catch(()=>null)]);
    if(!dRes.ok)throw new Error('server vrátil '+dRes.status);
    DATA=normalizeData(await dRes.json());
    try{HIST=hRes&&hRes.ok?await hRes.json():[];}catch(e){HIST=[];}
    if(!Array.isArray(HIST))HIST=[];
  }catch(e){
    $('#updated').textContent='chyba načítania';
    $('#app').innerHTML=`<div class="empty">Dáta sa nepodarilo načítať (${esc(e&&e.message||e)}).<br>
      Skontroluj, či beží <code>server.py</code>.<br><button class="btn" type="button" onclick="load()"><i class="ph ph-arrows-clockwise"></i>Skúsiť znova</button></div>`;
    return;
  }
  $('#updated').textContent=DATA.gen_at?('dáta k '+DATA.gen_at):'zatiaľ žiadne dáta';
  try{renderAll();}catch(e){
    console.error(e);
    $('#app').innerHTML=`<div class="empty">Chyba pri vykreslení (${esc(e&&e.message||e)}). <a href="/old" style="color:var(--acc)">Otvoriť starú verziu</a></div>`;
    return;
  }
  routeHash();
}
async function refresh(){
  const b=$('#refresh'); b.innerHTML='<span class="spin" aria-hidden="true"></span>Obnovujem…'; b.disabled=true;
  try{await fetch('/api/refresh?force=1');}catch(e){/* server nedostupný -> aspoň znova načítaj */}
  await load(); b.innerHTML='<i class="ph ph-arrows-clockwise"></i>Obnoviť'; b.disabled=false;
}

/* ---------- udalosti ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.closest('[data-close]')){closeDetail();return;}
  const st=t.closest('[data-step]'); if(st){stepDetail(+st.dataset.step);return;}
  const tab=t.closest('[data-tab]'); if(tab){if(DS.tab===tab.dataset.tab)return;DS.tab=tab.dataset.tab;
    $$('#panel .dtabs button').forEach(b=>{const on=b.dataset.tab===DS.tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on);});
    placeInd();renderBody(true);return;}
  const vp=t.closest('[data-vp]'); if(vp){DS.vp=vp.dataset.vp;renderBody(false);return;}
  const vt=t.closest('[data-vt]'); if(vt){DS.vt=vt.dataset.vt;renderBody(false);return;}
  if(t.closest('a'))return;
  const o=t.closest('[data-open]'); if(o){openDetail(o.dataset.open);return;}
  if(GX.sel&&!t.closest('#gx')&&!t.closest('#gtip')){GX.sel=null;const tp=$('#gtip');if(tp)tp.classList.remove('on');if(GX.redraw)GX.redraw();}
});
document.addEventListener('keydown',ev=>{
  const open=$('#sheet').classList.contains('open');
  if(ev.key==='Escape'&&open){closeDetail();return;}
  if(open&&(ev.key==='ArrowLeft'||ev.key==='ArrowRight')&&!(ev.target.closest&&ev.target.closest('.dtabs,.seg'))){ev.preventDefault();stepDetail(ev.key==='ArrowLeft'?-1:1);return;}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('fc')){ev.preventDefault();openDetail(ev.target.dataset.open);}
});
window.addEventListener('popstate',routeHash);
window.addEventListener('hashchange',routeHash);
$('#refresh').addEventListener('click',refresh);
let _rs=0; window.addEventListener('resize',()=>{clearTimeout(_rs);_rs=setTimeout(()=>{drawStars();if(DS.name)placeInd();},200);});
drawStars();
load();
</script></body></html>
