/* ---- hover / klik ---- */
function gxPick(g,x,y){   // vyber v obrazovkovom priestore (tolerantne aj k malym planetam a mesiacom)
  const T=g.T,cam=g.camera,v=g._pv||(g._pv=new T.Vector3()),wp=g._pw||(g._pw=new T.Vector3());
  const tanH=Math.tan(T.MathUtils.degToRad(cam.fov)/2),hh=g.h/2;let best=null,bd=Infinity;
  for(const it of g.pick){
    it.obj.getWorldPosition(wp);const dist=cam.position.distanceTo(wp);
    v.copy(wp).project(cam);if(v.z<-1||v.z>1)continue;
    const sx=(v.x*0.5+0.5)*g.w,sy=(-v.y*0.5+0.5)*g.h,rp=it.r/(dist*tanH)*hh+(it.kind==='moon'?4:8);
    if((sx-x)*(sx-x)+(sy-y)*(sy-y)<=rp*rp&&dist<bd){best=it;bd=dist;}
  }
  return best;
}
function gxClick(g,e,d){
  let h=null;
  if(d.lab!=null)h=d.lab==='sun'?{kind:'sun'}:(g.planets[+d.lab]?g.planets[+d.lab].pick:null);
  else{const r=g.stage.getBoundingClientRect();h=gxPick(g,e.clientX-r.left,e.clientY-r.top);}
  if(!h){if(g.focus)gxUnfocus(g);return;}
  if(h.kind==='sun'){gxUnfocus(g);return;}
  if(h.pl&&h.pl!==g.focus)gxFocus(g,h.pl);
}
function gxGlow(pl,on){
  pl.mat.emissiveIntensity=on?pl.baseEm*2.4+0.15:pl.baseEm;
  pl.atmoMat.uniforms.uI.value=on?pl.baseAt*1.6+0.25:pl.baseAt;
  pl.orbMat.uniforms.uBase.value=on?Math.max(0.2,pl.baseOrb*2.2):pl.baseOrb;
}
function gxHover(g){
  let h=null;
  if(g.ptr.in&&!g.drag){
    const k=g.ptr.lab;
    if(k!=null)h=k==='sun'?g.pick[0]:(g.planets[+k]?g.planets[+k].pick:null);
    else h=gxPick(g,g.ptr.x,g.ptr.y);
  }
  const key=h?h.kind+(h.pl?h.pl.k:'')+(h.v?'|'+(h.v.id||h.v.title):''):'';
  if(key!==g.hoverKey){g.hoverKey=key;gxSetHover(g,h);}
  if(h)gxTipPos(g);
}
function gxSetHover(g,h){
  const a=g.hover&&g.hover.pl,b=h&&h.pl;g.hover=h;
  if(a&&a!==b)gxGlow(a,a===g.focus);
  if(b)gxGlow(b,true);
  g.stage.classList.toggle('hov',!!h);
  g.marker.visible=!!(h&&h.kind==='moon');
  if(h){g.tip.innerHTML=gxTipHtml(g,h);g.tip.classList.add('on');g.tipW=g.tip.offsetWidth;g.tipH=g.tip.offsetHeight;}
  else g.tip.classList.remove('on');
  for(const x of g.labels)x.inner.classList.toggle('hot',!!h&&(x.pl?x.pl===b:h.kind==='sun'));
}
function gxTipPos(g){
  let x=g.ptr.x+16,y=g.ptr.y+18;const w=g.tipW||200,h=g.tipH||60;
  if(x+w>g.w-8)x=g.ptr.x-w-12;if(y+h>g.h-8)y=g.ptr.y-h-12;x=Math.max(8,x);y=Math.max(8,y);
  g.tip.style.transform=`translate(${x|0}px,${y|0}px)`;
}
function gxTipHtml(g,h){
  if(h.kind==='sun'){const t=g.tot||{foll:0,views:0,n:0};
    return `<b>☀ Celá sieť</b><br><span class="m">${fmt(t.foll)} sledov. · ${fmt(t.views)} zhliad. · ${t.n} ${gxFabr(t.n)}</span>`;}
  const f=h.f;
  if(h.kind==='moon'){const v=h.v,k=gxPlat(v);
    return `<b>${PI[k]||'🎬'} ${esc(String(v.title||'(bez názvu)').slice(0,80))}</b><br><span class="m">${fmt(v.views||0)} zhliad. · ${esc(f.name)}${v.published?' · '+fmtDate(String(v.published)):''}</span>`;}
  return `<b><span style="color:${f.color}">●</span> ${esc(f.name)}</b> <span class="m">· ${esc(f.p.niche||'')}</span><br>`+
    `${fmt(f.foll)} sledov. · ${f.v28?`+${fmt(f.v28.v)} zhliad. za ${f.v28.days} d`:`${fmt(f.views)} zhliad. spolu`}`+
    (f.dormant?`<br><span class="m">💤 ${f.last?`bez nového videa ${f.idle} d`:'zatiaľ bez videí'}</span>`:'')+
    `<br><span class="m">klik = detail</span>`;
}

/* ---- bocny panel ---- */
function gxPanelHtml(f){
  const p=f.p,Lk=p.links||{},hh=facHealth(p);
  const kpi=(l,v)=>`<div class="gx-kpi"><span>${l}</span><b>${v}</b></div>`;
  const chip=(c,t)=>`<span class="gx-chip ${c}">${t}</span>`;
  const prow=k=>{const n=f.f[k],on=n!=null;
    return `<div class="gx-prow"><span class="pi" style="--c:${GX.RING[k]}">${PI[k]} ${PN[k]}</span>`+
      `<span>${on?fmt(n):'—'}<small> ${k==='youtube'?'odber.':'sledov.'}</small></span>`+
      `<span>${on||f.pvw[k]?fmt(f.pvw[k]):'—'}<small> zhliad.</small></span>`+
      (Lk[k]?`<a href="${esc(Lk[k])}" target="_blank" rel="noopener noreferrer" title="Otvoriť ${PN[k]}" aria-label="Otvoriť ${PN[k]}">↗</a>`:'<span></span>')+`</div>`;};
  const vids=f.vids.slice(0,5).map(v=>{const k=gxPlat(v);
    return `<li><a href="${esc(v.link||'#')}" target="_blank" rel="noopener noreferrer"><span>${PI[k]||'🎬'}</span>`+
      `<span class="t">${esc(String(v.title||'(bez názvu)'))}</span><span class="v">${fmt(v.views||0)}</span></a></li>`;}).join('')
    ||'<li class="muted" style="font-size:12.5px;padding:6px 0">Zatiaľ žiadne videá.</li>';
  const act=f.dormant?chip('warn',`💤 ${f.last?'bez videa '+f.idle+' d':'bez videí'}`):chip('ok','● aktívna');
  return `<div class="gx-ph"><span class="dot" style="background:${f.color};color:${f.color}"></span>`+
    `<div style="min-width:0"><h3>${esc(f.name)}</h3><div class="n">${esc(p.niche||'')}</div></div>`+
    `<button type="button" class="gx-x" aria-label="Zavrieť detail (Esc)">×</button></div>`+
    `<div class="gx-chips">${act}${chip(p.online?'ok':'',p.online?'Buffer online':'Buffer offline')}`+
    `${chip(p.alive?'ok':'',p.alive?'alive':'nie alive')}${p.stale?chip('warn','stav z cache'):''}${(p.errors||0)>0?chip('bad','chyby: '+p.errors):''}</div>`+
    `<div class="gx-kpis">${kpi('Sledovatelia',fmt(f.foll))}${kpi(f.v28?`Zhliad. ${f.v28.days} d`:'Zhliad. 28 d',f.v28?'+'+fmt(f.v28.v):'—')}${kpi('Zhliad. spolu',fmt(f.views))}</div>`+
    `<div class="gx-sec">Platformy</div>${['youtube','tiktok','instagram'].map(prow).join('')}`+
    `<div class="gx-sec">Stav</div><div class="gx-st">${hh[0]} ${esc(hh[1])}</div>`+
    `<div class="gx-kv"><span>Posledný post</span><b>${gxDT(p.last_sent)}</b></div>`+
    `<div class="gx-kv"><span>Ďalší naplánovaný</span><b>${gxDT(p.next_due)}</b></div>`+
    `<div class="gx-kv"><span>Naplánované / odoslané</span><b>${p.scheduled||0} / ${p.sent||0}</b></div>`+
    `<div class="gx-kv"><span>Chyby v Bufferi</span><b class="${(p.errors||0)>0?'bad':''}">${p.errors||0}</b></div>`+
    `<div class="gx-kv"><span>Posledné video</span><b>${f.last?fmtDate(String(f.last).slice(0,10)):'—'}</b></div>`+
    `<div class="gx-sec">Top videá</div><ol class="gx-vids">${vids}</ol>`;
}
function gxPanel(g,pl,kb){
  const P=g.panel;
  if(!pl){P.classList.remove('on');P.setAttribute('aria-hidden','true');return;}
  P.innerHTML=gxPanelHtml(pl.f);P.classList.add('on');P.setAttribute('aria-hidden','false');P.scrollTop=0;
  const x=P.querySelector('.gx-x');
  if(x){x.addEventListener('click',()=>gxUnfocus(g));if(kb)try{x.focus({preventScroll:true});}catch(e){}}
  g.panelW=P.offsetWidth||340;
}

/* ---- popisky: vzdy citatelne (HTML), bez prekryvu (priorita: zamerana > hover > slnko > vacsia fabrika) ---- */
function gxDeclutter(g){
  const T=g.T,cam=g.camera,v=g._dv||(g._dv=new T.Vector3()),W=g.w,H=g.h,tanH=Math.tan(T.MathUtils.degToRad(cam.fov)/2);
  const hp=g.hover&&g.hover.pl,pr=x=>!x.pl?x.prio:x.pl===g.focus?1e9:x.pl===hp?9e8:x.prio;
  const list=g.labels.slice().sort((a,b)=>pr(b)-pr(a)),placed=[];
  for(const x of list){
    if(!x.w&&x.el.isConnected&&x.el.style.display!=='none'){x.w=x.el.offsetWidth;x.h=x.el.offsetHeight;}
    x.anchor.getWorldPosition(v);const dist=cam.position.distanceTo(v);v.project(cam);
    let show=v.z>-1&&v.z<1&&x.w>0,off=0,dx=0;
    if(show&&x.pl&&x.pl!==g.focus&&x.pl!==hp&&dist>g.labelMax)show=false;
    if(show){
      const sx=(v.x*0.5+0.5)*W,sy=(-v.y*0.5+0.5)*H;off=x.r/(dist*tanH)*(H/2)+6;
      const y0=x.up?sy-off-x.h:sy+off;
      if(sx+x.w/2<0||sx-x.w/2>W||y0+x.h<0||y0>H)show=false;
      else{
        dx=Math.max(6-(sx-x.w/2),Math.min(0,W-6-(sx+x.w/2)));   // na okraji posun popisok dnu, nech nie je orezany
        const rc={x0:sx+dx-x.w/2-3,x1:sx+dx+x.w/2+3,y0:y0-2,y1:y0+x.h+2};
        if(placed.some(q=>q.x0<rc.x1&&q.x1>rc.x0&&q.y0<rc.y1&&q.y1>rc.y0))show=false;else placed.push(rc);
      }
    }
    if(show!==x.shown){x.shown=show;x.el.classList.toggle('off',!show);}
    if(show){const o=Math.round(x.up?-off:off),d=Math.round(dx),key=o*10000+d;
      if(key!==x.off){x.off=key;x.inner.style.transform=`translate(${d}px,${o}px)`;}}
  }
}

/* ---- animacna slucka (bezi len ked je galaxia naozaj vidiet) ---- */
function gxUpdate(g,dt,rdt){
  const t=g.t;
  g.starsNear.rotation.y=t*0.004;g.starsFar.rotation.y=t*0.0015;g.dust.rotation.y=t*0.008;
  g.starMat.uniforms.uTime.value=t;
  const ps=Math.sin(t*1.25);
  g.sunMat.uniforms.uTime.value=t;g.sunMat.uniforms.uPulse.value=1+0.05*ps;g.halo.scale.setScalar(GX.SUN_R*7*(1+0.04*ps));
  const ds=g.camera.position.length(),cl=x=>Math.max(0,Math.min(1,x));   // zblízka by halo slnka zaplavilo celý záber
  g.halo.material.opacity=0.9*cl((ds-30)/110);g.halo2.material.opacity=0.22*cl((ds-90)/260);
  for(const pl of g.planets){
    const th=pl.th0+pl.w*t;pl.pivot.position.set(Math.cos(th)*pl.orbitR,0,-Math.sin(th)*pl.orbitR);
    pl.body.rotation.y=t*pl.spin;
    const hd=th/(Math.PI*2);pl.orbMat.uniforms.uHead.value=hd-Math.floor(hd);
    for(const m of pl.moons){const a=m.ph+m.w*t;m.mesh.position.set(Math.cos(a)*m.d,0,-Math.sin(a)*m.d);}
  }
  if(g.root)g.root.updateMatrixWorld();
  const wp=g._uw||(g._uw=new g.T.Vector3());
  for(const pl of g.planets){pl.pivot.getWorldPosition(wp);pl.glw.material.opacity=pl.glwA*cl((g.camera.position.distanceTo(wp)-60)/220);}
  if(g.tw)gxTweenStep(g,rdt);else{gxFollow(g);g.controls.update(dt);}
  if(!g.RM&&!g.controls.autoRotate&&!g.tw&&performance.now()-g.lastInteract>8000)g.controls.autoRotate=true;
  gxViewOffset(g,rdt,false);
  g.camera.updateMatrixWorld();
  gxHover(g);
  if(g.marker.visible&&g.hover&&g.hover.obj){g.hover.obj.getWorldPosition(g.marker.position);const s=g.hover.r*4.2;g.marker.scale.set(s,s,1);}
}
function gxPerf(g,dt){   // adaptivna kvalita: dlhodobo < ~45 fps -> nizsie rozlisenie (az po 1.0)
  if(!dt)return;g.ema=g.ema?g.ema*0.95+dt*0.05:dt;g.pf=(g.pf||0)+1;
  if(g.pf>90&&g.ema>1/45&&g.pr>1){g.pr=Math.max(1,g.pr-0.25);g.pf=0;g.renderer.setPixelRatio(g.pr);g.composer.setPixelRatio(g.pr);g.w=0;gxResize(g);}
}
function gxTick(ms){
  const g=GX.g;if(!g)return;g.raf=0;if(!g.running)return;
  const S=g.S;
  if(document.hidden||g.lost||!S.wrap.isConnected||S.wrap.offsetParent===null||!g.inView){g.running=false;return;}
  try{
    const raw=g.lastMs?Math.max(0,(ms-g.lastMs)/1000):0,dt=Math.min(0.1,raw);g.lastMs=ms;
    g.t+=g.RM?0:dt;
    gxUpdate(g,dt,Math.min(0.25,raw));   // prelet kamery ide v realnom case aj pri nizkom fps
    g.composer.render(dt);
    g.labelR.render(g.scene,g.camera);
    gxDeclutter(g);
    if(!g.shown){g.shown=true;S.load.classList.add('done');}
    gxPerf(g,dt);
  }catch(e){gxFail(S.wrap.parentNode,g.P,{height:S.wrap.style.height},e,true);return;}
  g.raf=requestAnimationFrame(gxTick);
}
function gxResume(g){
  if(!g||g.running||g.lost||document.hidden||!g.built)return;
  const w=g.S.wrap;if(!w.isConnected||w.offsetParent===null)return;
  g.running=true;g.lastMs=0;g.raf=requestAnimationFrame(gxTick);
}
function gxFail(container,P,opts,e,permanent){
  try{console.warn('[galaxia] 3D nedostupné, zobrazujem 2D:',(e&&e.message)||e);}catch(_){}
  if(permanent)GX.failed=true;
  const g=GX.g;GX.g=null;
  if(g){try{g.running=false;if(g.raf)cancelAnimationFrame(g.raf);if(g.ro)g.ro.disconnect();if(g.io)g.io.disconnect();
    g.controls.dispose();g.renderer.dispose();g.renderer.forceContextLoss();}catch(_){}}
  if(GX.shell){try{GX.shell.wrap.remove();}catch(_){}GX.shell=null;}
  if(!container)return;
  try{renderGalaxy2D(container,(P||[]).filter(p=>p&&p.name),opts||{});}
  catch(_){container.innerHTML='<div class="empty">Galaxiu sa nepodarilo zobraziť.</div>';}
}

/* verejne API — volane zo show('galaxy'); bezpecne opakovane (renderer sa znovu pouzije, scena sa prestavi len pri zmene dat) */
window.renderGalaxy=function(container,projects,opts){
  opts=opts||{};
  try{
    if(!container)return;
    const P=(projects||[]).filter(p=>p&&p.name);
    if(!P.length){
      if(GX.g)GX.g.running=false;
      if(GX.shell&&GX.shell.wrap.parentNode===container)GX.shell.wrap.remove();
      container.innerHTML='<div class="empty">Galaxia sa objaví po načítaní dát.</div>';return;
    }
    if(GX.failed||!gxWebGL()){renderGalaxy2D(container,P,opts);return;}
    if(window._galRaf){cancelAnimationFrame(window._galRaf);window._galRaf=0;}
    const S=gxShell(container,opts),my=++GX.call;
    gxLoad().then(L=>{
      if(my!==GX.call||GX.failed||!S.wrap.isConnected)return;
      try{const g=gx3d(S,L);gxResize(g);gxBuild(g,P,opts);gxResume(g);}
      catch(e){gxFail(container,P,opts,e,true);}
    },e=>{if(my===GX.call)gxFail(container,P,opts,e,false);});
  }catch(e){gxFail(container,projects,opts,e,true);}
};

/* ---------------- INFRA ---------------- */
const TABS=['overview','galaxy','growth','factories','winners','platforms','docs','lumora','comments','spotify','episodary'];
// URL hash = aktivny tab (#galaxy otvori Galaxiu hned po nacitani; reload/zdielany link ostane na tom istom tabe)
function tabFromHash(){let h='';try{h=decodeURIComponent((location.hash||'').slice(1));}catch(e){}return TABS.includes(h)?h:null;}
function show(t){
  if(!TABS.includes(t))t='overview';
  $$('.tab').forEach(b=>{const on=b.dataset.t===t; b.classList.toggle('on',on); b.setAttribute('aria-selected',on?'true':'false');});
  TABS.forEach(s=>$('#'+s).classList.toggle('hide-tab',s!==t));
  if(location.hash.slice(1)!==t){try{history.replaceState(null,'','#'+t);}catch(e){}}
  if(!DATA)return;   // klik pred nacitanim dat: load() potom vyrenderuje aktivny tab
  if(t==='galaxy')renderGalaxy($('#galaxy'),DATA.projects,{height:'74vh'});
  if(t==='growth')renderGrowth(); if(t==='factories')renderFactories(); if(t==='winners')renderWinners();
  if(t==='platforms')renderPlatforms(); if(t==='docs')renderDocs(); if(t==='lumora')renderLumora(); if(t==='comments')renderComments();
  if(t==='spotify')renderSpotify(); if(t==='episodary')renderEpisodary();
}
$$('.tab').forEach(b=>b.onclick=()=>show(b.dataset.t));
window.addEventListener('hashchange',()=>{const t=tabFromHash();if(t&&t!==$('.tab.on')?.dataset.t)show(t);});
async function refresh(force){
  const b=$('#refresh'); b.innerHTML='<span class="spin" aria-hidden="true"></span> Obnovujem…'; b.disabled=true;
  // manualne tlacidlo -> ?force=1 (vzdy prezbieraj); automaticky on-load -> mekky (server prezbiera len ak su data stale >REFRESH_HOURS)
  try{await fetch('/api/refresh'+(force?'?force=1':''));}catch(e){/* server nedostupny -> skus aspon nacitat existujuce data nizsie */}
  await load(); b.innerHTML='↻ Obnoviť dáta'; b.disabled=false;
}
// bezpecne totals so vsetkymi klucmi na 0 -> ziadne "NaN" ked su data.json prazdne (prvy beh / vypadok API)
function normalizeData(d){
  d=d||{};
  d.totals=Object.assign({factories:0,yt_subs:0,yt_views:0,tk_foll:0,tk_views:0,tk_likes:0,
    ig_foll:0,ig_views:0,ig_posts:0,ig_videos:0,videos:0,ig_blocked:false},d.totals||{});
  d.projects=Array.isArray(d.projects)?d.projects:[];
  d.prev=d.prev||{};
  return d;
}
async function load(){
  try{
    const [dRes,hRes]=await Promise.all([fetch('/data.json?'+Date.now()),fetch('/history.json?'+Date.now())]);
    if(!dRes.ok)throw new Error('server vratil '+dRes.status);
    DATA=normalizeData(await dRes.json());
    HIST=hRes.ok?await hRes.json():[];
    if(!Array.isArray(HIST))HIST=[];
  }catch(e){
    $('#updated').textContent='chyba načítania';
    $('#overview').innerHTML=`<div class="empty">⚠️ Dáta sa nepodarilo načítať (${esc(''+e.message||e)}).<br>
      Skontroluj či beží <code>server.py</code>, alebo skús <button class="btn" style="display:inline-flex" onclick="load()">↻ skúsiť znova</button>.</div>`;
    return;
  }
  $('#updated').textContent=DATA.gen_at?('Dáta k '+DATA.gen_at):'zatiaľ žiadne dáta';
  if(!DATA.projects.length){
    $('#overview').innerHTML=`<div class="empty">📭 Zatiaľ žiadne fabriky/dáta. Spusti <code>python generate.py</code>
      (alebo klikni „↻ Obnoviť dáta" hore) na prvé natiahnutie štatistík.</div>`;
    return;
  }
  renderOverview();
  const on=tabFromHash()||$('.tab.on')?.dataset.t||'overview'; if(on!=='overview')show(on);
}
load();
</script></body></html>
