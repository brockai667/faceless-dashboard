name: YT kanalove keywords

# Jednorazovo/na vyziadanie nastavi channel keywords (brandingSettings) vsetkym kanalom,
# aby algoritmus vedel, komu obsah ukazovat (novy kanal = "algorithm has no idea").
# Spusti sa aj pushom tohto workflowu/skriptu (prvy beh hned po nasadeni).
# Secrets: YT_CLIENT_ID, YT_CLIENT_SECRET, YT_WRITE_TOKENS (+ YT_ANALYTICS_TOKENS fallback).

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/set-channel-keywords.yml"
      - "set_channel_keywords.py"

permissions:
  contents: write

concurrency:
  group: set-channel-keywords
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nastav channel keywords
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_WRITE_TOKENS: ${{ secrets.YT_WRITE_TOKENS }}
          YT_ANALYTICS_TOKENS: ${{ secrets.YT_ANALYTICS_TOKENS }}
        run: python set_channel_keywords.py

      - name: Commitni vysledok
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channel_keywords_result.json
          git diff --cached --quiet || { git commit -m "kanalove keywords $(date -u +%F)"; for _i in 1 2 3 4; do git pull --rebase -q origin main && git push -q && break || sleep 4; done; }
