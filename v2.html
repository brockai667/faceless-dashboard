<!doctype html><html lang="sk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FacelessFactory · Centrála</title>
<meta name="theme-color" content="#04060c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.4' stop-color='%239db4ff'/%3E%3Cstop offset='1' stop-color='%233b2fa0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='8' cy='8' r='7' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#04060c; --glass:rgba(15,21,38,.58); --glass2:rgba(24,32,56,.55);
  --bd:rgba(148,163,209,.12); --bd2:rgba(148,163,209,.22);
  --tx:#eef2fb; --mut:#97a3bd; --mut2:#67728b;
  --acc:#8ea6ff; --acc2:#b49bff; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --display:'Space Grotesk','Inter',system-ui,sans-serif;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:20px; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;overflow-x:hidden;min-height:100vh}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:rgba(142,166,255,.35)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}

/* ---------- pozadie ---------- */
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;
  background:radial-gradient(1100px 650px at 85% -12%,#18215099 0%,transparent 60%),
             radial-gradient(900px 600px at -12% 28%,#2a145077 0%,transparent 55%),
             linear-gradient(180deg,#060913,#03040a 70%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.30;animation:drift 30s ease-in-out infinite alternate;will-change:transform}
.aurora i:nth-child(1){width:540px;height:540px;background:#3b5bdb;left:58%;top:-200px}
.aurora i:nth-child(2){width:460px;height:460px;background:#7c3aed;left:-160px;top:38%;animation-duration:36s}
.aurora i:nth-child(3){width:420px;height:420px;background:#0e7490;left:38%;top:78%;animation-duration:44s;opacity:.2}
@keyframes drift{to{transform:translate3d(70px,50px,0) scale(1.18)}}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}

/* ---------- hlavicka ---------- */
.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  background:rgba(4,6,12,.62);border-bottom:1px solid var(--bd)}
.top .in{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font:700 17px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.brand .orb{width:26px;height:26px;border-radius:50%;flex:0 0 26px;
  background:radial-gradient(circle at 34% 30%,#fff,#a9bcff 28%,#5b6cff 58%,#241a6e);box-shadow:0 0 20px #6d7cffaa;animation:breathe 4s ease-in-out infinite}
.brand small{color:var(--mut);font:500 12px/1 var(--font);margin-left:2px}
@keyframes breathe{50%{box-shadow:0 0 30px #8b9bffdd}}
nav.nav{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
nav.nav::-webkit-scrollbar{display:none}
nav.nav a{padding:7px 12px;border-radius:999px;color:var(--mut);font-weight:600;font-size:13.5px;white-space:nowrap;transition:color .2s,background-color .2s,box-shadow .2s}
nav.nav a:hover{color:var(--tx);background:rgba(255,255,255,.06)}
nav.nav a.on{color:#fff;background:rgba(142,166,255,.16);box-shadow:inset 0 0 0 1px rgba(142,166,255,.38)}
nav.nav a.ext{font-weight:500}
nav.nav a.ext::after{content:'↗';margin-left:4px;opacity:.55;font-size:11px}
nav.nav .sep{width:1px;height:18px;background:var(--bd2);margin:0 8px;flex:0 0 1px}
.meta{display:flex;align-items:center;gap:12px;white-space:nowrap}
.upd{color:var(--mut2);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font:600 13px/1.2 var(--font);
  background:linear-gradient(180deg,rgba(142,166,255,.22),rgba(142,166,255,.10));border:1px solid rgba(142,166,255,.35);color:#fff;
  transition:transform .2s var(--ease),box-shadow .2s,background-color .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px -12px #8ea6ffcc}
.btn:disabled{opacity:.7;cursor:progress;transform:none}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- layout ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:8px 24px 90px}
section{scroll-margin-top:84px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:56px 0 18px;flex-wrap:wrap}
.sh h2{font:700 24px/1.1 var(--display);letter-spacing:-.02em}
.sh p{color:var(--mut);font-size:13px;margin-top:6px}
.eyebrow{font:600 11.5px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}

/* ---------- hero ---------- */
.hero{padding-top:34px}
.hero h1{font:700 clamp(30px,5vw,54px)/1.02 var(--display);letter-spacing:-.035em;margin:12px 0 10px;
  background:linear-gradient(92deg,#fff 0%,#dbe2ff 40%,#b4a6ff 75%,#8ec5ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{color:var(--mut);font-size:15.5px;max-width:720px}
.hero .lead b{color:var(--tx);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:26px}
.kpi{position:relative;padding:20px 20px 18px;border-radius:var(--r);background:var(--glass);border:1px solid var(--bd);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;min-width:0;
  animation:rise .8s var(--ease) both;animation-delay:var(--d,0ms);transition:border-color .3s,transform .35s var(--ease)}
.kpi:hover{border-color:var(--bd2);transform:translateY(-2px)}
.kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--k,#8ea6ff),transparent)}
.kpi::after{content:'';position:absolute;width:220px;height:220px;right:-90px;top:-120px;border-radius:50%;
  background:radial-gradient(circle,var(--k,#8ea6ff),transparent 68%);opacity:.16;pointer-events:none}
.kpi .lab{font-size:11.5px;color:var(--mut);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.kpi .big{font:700 clamp(32px,3.4vw,46px)/1 var(--display);letter-spacing:-.03em;margin:14px 0 10px}
.kpi .sub{font-size:12.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.kpi .spark{margin-top:10px}
.kpi.best .ttl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;font-size:14px;line-height:1.35;margin-top:12px;min-height:38px}
.kpi.best .ttl:hover{color:#fff;text-decoration:underline;text-decoration-color:var(--k)}
.kpi.best .big{font-size:clamp(28px,2.8vw,38px);margin:8px 0 8px}
.stack{display:flex;height:6px;border-radius:99px;overflow:hidden;margin-top:12px;background:rgba(255,255,255,.06)}
.stack i{display:block;height:100%;transform-origin:left;animation:grow 1.1s var(--ease) both .3s}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media(max-width:1020px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.kpis{grid-template-columns:minmax(0,1fr)}}

/* ---------- male prvky ---------- */
.d{display:inline-flex;align-items:center;gap:3px;font:600 11.5px/1 var(--font);padding:4px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.d.up{color:#4ade80;background:rgba(74,222,128,.12)}
.d.dn{color:#fb7185;background:rgba(251,113,133,.12)}
.d.z{color:var(--mut);background:rgba(255,255,255,.06)}
.pb{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.pb i{width:8px;height:8px;border-radius:50%;background:var(--p);box-shadow:0 0 8px var(--p);flex:0 0 8px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 80%,#fff);white-space:nowrap}
.orb{display:inline-block;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--c) 30%,#fff),var(--c) 45%,color-mix(in srgb,var(--c) 30%,#000) 100%);
  box-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.spark{display:block;width:100%;max-width:200px;height:auto;overflow:visible}
.spark .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s var(--ease) forwards .2s}
@keyframes draw{to{stroke-dashoffset:0}}
.nospark{font-size:11.5px;color:var(--mut2);padding:12px 0}

/* ---------- galaxia ---------- */
.galaxy{position:relative;border-radius:28px;border:1px solid var(--bd);overflow:hidden;
  background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(52,62,140,.30),rgba(6,8,18,.35) 70%),rgba(4,6,12,.55);
  box-shadow:0 40px 120px -60px rgba(91,108,255,.55),inset 0 1px 0 rgba(255,255,255,.04)}
#gx{display:block;width:100%;height:520px;touch-action:manipulation}
.ghint{position:absolute;left:18px;top:16px;font-size:12px;color:var(--mut);pointer-events:none;display:flex;gap:14px;flex-wrap:wrap;max-width:calc(100% - 36px)}
.ghint span{display:inline-flex;align-items:center;gap:6px}
.ghint .g1{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#8ea6ff 45%,#2a2f7a)}
.ghint .g2{width:12px;height:12px;border-radius:50%;background:#8ea6ff;box-shadow:0 0 10px 3px #8ea6ffaa}
.gtip{position:absolute;left:0;top:0;pointer-events:none;min-width:190px;max-width:240px;padding:12px 14px;border-radius:14px;
  background:rgba(8,12,24,.88);border:1px solid var(--bd2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 18px 40px -16px #000;opacity:0;transform:translateY(4px);transition:opacity .16s,transform .16s;font-size:12.5px;z-index:2}
.gtip.on{opacity:1;transform:none}
.gtip h4{font:700 15px/1.2 var(--display);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.gtip .r{display:flex;justify-content:space-between;gap:12px;color:var(--mut);padding:2px 0}
.gtip .r b{color:var(--tx);font-variant-numeric:tabular-nums}
.gtip .go{margin-top:8px;color:var(--acc);font-weight:600;font-size:11.5px}
.glegend{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px;border-top:1px solid var(--bd);background:rgba(4,6,12,.35)}
.glegend button{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.035);border:1px solid var(--bd);border-radius:999px;
  padding:6px 12px;font-size:12.5px;color:var(--mut);transition:color .2s,border-color .2s,background-color .2s}
.glegend button:hover{color:var(--tx);border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.glegend button.act{color:var(--tx)}
.glegend button .orb{width:10px;height:10px}
.glegend button:not(.act) .orb{filter:saturate(.25) brightness(.7);box-shadow:none}

/* ---------- karty fabrik ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:18px}
.fc{--c:#8ea6ff;position:relative;border-radius:24px;padding:22px;min-width:0;cursor:pointer;
  background:linear-gradient(180deg,rgba(22,29,52,.72),rgba(9,13,26,.72));border:1px solid var(--bd);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;
  animation:rise .8s var(--ease) both;animation-delay:var(--d,0ms);
  transition:transform .4s var(--ease),border-color .3s,box-shadow .4s var(--ease)}
.fc::before{content:'';position:absolute;width:380px;height:380px;right:-160px;top:-200px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--c) 50%,transparent),transparent 66%);opacity:.42;transition:opacity .4s,transform .6s var(--ease)}
.fc::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%);background-size:250% 100%;background-position:120% 0;transition:background-position .9s var(--ease)}
.fc:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--c) 45%,transparent);
  box-shadow:0 30px 70px -36px color-mix(in srgb,var(--c) 80%,transparent)}
.fc:hover::before{opacity:.8;transform:scale(1.08)}
.fc:hover::after{background-position:-20% 0}
.fc > *{position:relative;z-index:1}
.fh{display:flex;align-items:center;gap:14px}
.fh .orb{width:40px;height:40px}
.fh .fn{min-width:0;flex:1}
.fh h3{font:700 20px/1.15 var(--display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh .ni{font-size:12px;color:var(--mut);margin-top:3px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6ee7b7;
  padding:4px 9px;border-radius:999px;background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.25);white-space:nowrap}
.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 #34d39988;animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.wk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,170px);gap:14px;align-items:end;margin:20px 0 16px}
.wk .lab,.lab{font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.wk .big{font:700 40px/1 var(--display);letter-spacing:-.03em;margin:8px 0 8px}
.wk .sub{font-size:12.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wk .cap{font-size:10.5px;color:var(--mut2);margin-top:4px;text-align:right}
.pt{border:1px solid var(--bd);border-radius:16px;overflow:hidden;background:rgba(4,6,12,.28)}
.pt .ph,.pt .pr{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,.8fr);gap:8px;padding:10px 14px;align-items:center}
.pt .ph{font-size:10.5px;color:var(--mut2);font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding-bottom:6px}
.pt .ph span:not(:first-child),.pt .pr > span:not(:first-child){text-align:right}
.pt .pr{border-top:1px solid var(--bd);font-size:13.5px;font-variant-numeric:tabular-nums}
.pt .pr b{font-weight:600}
.pt .pr small{display:block;font-size:11px;color:var(--mut2);margin-top:2px}
.pt .pr .d{margin-top:4px}
.topv{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--bd);
  transition:background-color .2s,border-color .2s}
.topv:hover{background:color-mix(in srgb,var(--c) 10%,transparent);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.topv .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 34px;background:color-mix(in srgb,var(--c) 20%,transparent);color:color-mix(in srgb,var(--c) 70%,#fff);font-size:15px}
.topv .tx{min-width:0;flex:1}
.topv .tl{font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.topv .tt{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topv .tv{font:700 17px/1 var(--display);white-space:nowrap;text-align:right}
.topv .tv small{display:block;font:500 11px var(--font);color:var(--mut);margin-top:4px}
.exp{margin-top:14px;padding:14px;border-radius:16px;border:1px dashed color-mix(in srgb,var(--s) 55%,transparent);background:color-mix(in srgb,var(--s) 7%,transparent)}
.exp .eh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.exp .en{font-weight:700;font-size:14px}
.exp .st{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--s);display:inline-flex;align-items:center;gap:6px}
.exp .st::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--s)}
.exp.running .st::before{animation:ping 1.6s infinite;box-shadow:0 0 0 0 var(--s)}
.exp .hy{font-size:12.5px;color:var(--mut);margin-top:6px}
.exp .mm{display:flex;align-items:center;gap:10px;margin-top:10px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.exp .mm b{font:700 18px/1 var(--display)}
.exp .mm .ar{color:var(--mut2)}
.tips{list-style:none;margin-top:14px;display:grid;gap:8px}
.tips li{display:flex;gap:10px;font-size:13px;line-height:1.45;color:#cdd5e6}
.tips li::before{content:'';flex:0 0 8px;height:8px;margin-top:6px;border-radius:50%;background:var(--t)}
.tips li.l0{--t:#f87171}.tips li.l1{--t:#fbbf24}.tips li.l2{--t:#8ea6ff}
.tips .h{font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:-2px}
.more{margin-top:16px;width:100%;padding:11px;border-radius:14px;border:1px solid var(--bd);font-weight:600;font-size:13px;color:var(--mut);
  display:flex;justify-content:center;gap:8px;transition:color .2s,border-color .2s,background-color .2s}
.fc:hover .more,.more:hover{color:#fff;border-color:color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}
.more span{transition:transform .25s var(--ease)}
.fc:hover .more span{transform:translateX(4px)}
.idle{margin-top:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-radius:18px;border:1px solid var(--bd);background:rgba(10,14,26,.45)}
.idle .il{font-size:12px;color:var(--mut);font-weight:600;margin-right:4px}
.idle button{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--bd);font-size:12.5px;color:var(--mut);
  background:rgba(255,255,255,.03);transition:color .2s,border-color .2s}
.idle button:hover{color:var(--tx);border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.idle button .orb{width:10px;height:10px;filter:saturate(.35) brightness(.8);box-shadow:none}
.idle button small{color:var(--mut2)}
.empty{padding:40px 24px;text-align:center;color:var(--mut);border:1px dashed var(--bd2);border-radius:20px;margin-top:30px}
.empty code{background:rgba(255,255,255,.06);padding:2px 6px;border-radius:6px}
.empty .btn{margin-top:14px}
footer{margin-top:60px;color:var(--mut2);font-size:12px;line-height:1.7;border-top:1px solid var(--bd);padding-top:18px}

/* ---------- skeleton ---------- */
.sk{border-radius:var(--r);background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-200% 0}}

/* ---------- detail (sheet) ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:none;overflow-y:auto;overscroll-behavior:contain;padding:4vh 16px}
.sheet.open{display:block}
.sheet .scrim{position:fixed;inset:0;background:rgba(2,3,8,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .3s both}
.panel{--c:#8ea6ff;position:relative;max-width:1060px;margin:0 auto;border-radius:28px;overflow:hidden;
  background:linear-gradient(180deg,#0d1326,#070a14 340px);border:1px solid var(--bd2);box-shadow:0 50px 140px -30px #000;animation:pop .45s var(--ease) both}
@keyframes fade{from{opacity:0}}

<script>
'use strict';
/* =====================================================================
   FacelessFactory · Centrála v2
   Spoľahlivé metriky:
   - zhliadnutia = súčet views videí PUBLIKOVANÝCH za posledných 7 dní (per-video dáta z data.json)
   - medián = medián views videí publikovaných za 30 dní, per platforma
   - sledovatelia = aktuálne vs. history.json spred 7 dní (sledovatelia sú spoľahliví)
   - história len od RELIABLE_FROM (staršie zhliadnutia boli držané/max-clampované)
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const RELIABLE_FROM='2026-10-01';
const PLATS=['youtube','tiktok','instagram'];
const PN={youtube:'YouTube',tiktok:'TikTok',instagram:'Instagram'};
const PS={youtube:'YT',tiktok:'TT',instagram:'IG'};
const PC={youtube:'#ff4d4f',tiktok:'#25f4ee',instagram:'#e1306c'};
const HF={youtube:'yf',tiktok:'tf',instagram:'if'};   // history: sledovatelia
const HV={youtube:'yv',tiktok:'tv',instagram:'iv'};   // history: zhliadnutia
const ONLY={WealthMindset:['tiktok']};   // Suddenly Rich ide od 19.10.2026 len na TikTok (ručne z mobilu)
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let DATA=null, HIST=[], M=null;

/* ---------- pomocníci ---------- */
const nf=new Intl.NumberFormat('sk-SK');
const fmt=n=>nf.format(Math.round(+n||0));
function fmtc(n){n=+n||0;const a=Math.abs(n);
  if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1).replace('.',',')+' mil.';
  if(a>=1e4)return (n/1e3).toFixed(a>=1e5?0:1).replace('.',',')+' tis.';
  return fmt(n);}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):'';
const num=x=>{const n=+x;return isFinite(n)?n:0;};
const dayStr=d=>new Date(Date.now()-d*864e5).toISOString().slice(0,10);
const isHex=c=>/^#[0-9a-f]{6}$/i.test(String(c||''));
const colOf=p=>isHex(p&&p.color)?p.color:'#8ea6ff';
function plat(v){const s=String(v&&v.platform||'').toLowerCase();
  return s.startsWith('you')?'youtube':s.startsWith('tik')?'tiktok':s.startsWith('insta')?'instagram':s;}
function median(a){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function daysSince(ds){if(!ds)return 999;const t=Date.parse(String(ds).slice(0,10));if(!isFinite(t))return 999;return Math.max(0,Math.floor((Date.now()-t)/864e5));}
const relDay=d=>d>=999?'nikdy':d===0?'dnes':d===1?'včera':`pred ${d} d`;
function sDate(ds){const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(String(ds||''));return m?`${+m[3]}. ${+m[2]}.`:'';}
function dchip(d,sfx){sfx=sfx||'';
  if(d==null)return '<span class="d z" title="chýba história spred 7 dní">—</span>';
  if(d>0)return `<span class="d up">▲ ${fmt(d)}${sfx}</span>`;
  if(d<0)return `<span class="d dn">▼ ${fmt(-d)}${sfx}</span>`;
  return `<span class="d z">± 0${sfx}</span>`;}
const pbadge=k=>`<span class="pb" style="--p:${PC[k]||'#888'}"><i></i>${PN[k]||esc(k)}</span>`;
function hexRgb(h){h=isHex(h)?h:'#8ea6ff';return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
const rgba=(h,a)=>{const [r,g,b]=hexRgb(h);return `rgba(${r},${g},${b},${Math.max(0,Math.min(1,a)).toFixed(3)})`;};
function mix(h1,h2,t){const a=hexRgb(h1),b=hexRgb(h2);return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')})`;}

/* ---------- SVG grafy ---------- */
let _gid=0;
function spark(vals,color,w,h,fromMin){
  w=w||170;h=h||46;
  if(!vals||vals.length<2)return '<div class="nospark">málo histórie</div>';
  let mn=fromMin?Math.min(...vals):0, mx=Math.max(...vals);
  if(fromMin&&mx-mn<3){mn=Math.max(0,mn-1);mx=mn+3;} if(mx<=mn)mx=mn+1;
  const id='sg'+(++_gid), n=vals.length, pad=4;
  const pts=vals.map((v,i)=>[pad+i*(w-2*pad)/(n-1), h-pad-((v-mn)/(mx-mn))*(h-2*pad)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[n-1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`, L=pts[n-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${color}" stop-opacity=".42"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/><path class="ln" pathLength="1" d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="3.2" fill="${color}"/><circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="7" fill="${color}" opacity=".2"/></svg>`;
}
function barsChart(series,color){
  if(!series||series.length<2)return '<div class="nospark">Zatiaľ málo histórie (od 1. 10.).</div>';
  const W=640,H=200,pl=40,pb=24,pt=10,n=series.length,mx=Math.max(1,...series.map(s=>s.v));
  const bw=(W-pl-8)/n, id='bg'+(++_gid);
  const y=v=>pt+(H-pt-pb)*(1-v/mx);
  const grid=[0,.5,1].map(f=>`<line x1="${pl}" x2="${W}" y1="${y(mx*f).toFixed(1)}" y2="${y(mx*f).toFixed(1)}" stroke="rgba(255,255,255,.06)"/><text x="${pl-6}" y="${(y(mx*f)+3.5).toFixed(1)}" text-anchor="end">${fmtc(mx*f)}</text>`).join('');
  const bars=series.map((s,i)=>{const x=pl+i*bw+bw*.18, bh=Math.max(1.5,(H-pt-pb)-(y(s.v)-pt));
    return `<rect class="bar" style="animation-delay:${i*18}ms" x="${x.toFixed(1)}" y="${(H-pb-bh).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="url(#${id})"><title>${sDate(s.date)}: +${fmt(s.v)}</title></rect>`;}).join('');
  const step=Math.max(1,Math.ceil(n/7));
  const xl=series.map((s,i)=>i%step===0||i===n-1?`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${sDate(s.date)}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Denný prírastok zhliadnutí"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}"/><stop offset="1" stop-color="${color}" stop-opacity=".35"/></linearGradient></defs>${grid}${bars}${xl}</svg>`;
}
function linesChart(lines,dates){
  lines=lines.filter(l=>l.vals.filter(v=>v!=null).length>=2);
  if(!lines.length)return '<div class="nospark">Zatiaľ málo histórie (od 1. 10.).</div>';
  const W=640,H=200,pl=40,pb=24,pt=12,n=dates.length;
  const all=lines.flatMap(l=>l.vals.filter(v=>v!=null));let mn=Math.min(...all),mx=Math.max(...all);
  if(mx-mn<4){mn=Math.max(0,mn-2);mx=mn+4;}
  const x=i=>pl+(W-pl-10)*(n<2?0:i/(n-1)), y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const grid=[0,.5,1].map(f=>{const v=mn+(mx-mn)*f;return `<line x1="${pl}" x2="${W}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="rgba(255,255,255,.06)"/><text x="${pl-6}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end">${fmtc(v)}</text>`;}).join('');
  const paths=lines.map(l=>{let d='',pen=false;l.vals.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true;});
    return `<path class="ln" pathLength="1" d="${d}" fill="none" stroke="${l.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s var(--ease) forwards .1s"/>`;}).join('');
  const step=Math.max(1,Math.ceil(n/7));
  const xl=dates.map((d,i)=>i%step===0||i===n-1?`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${sDate(d)}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sledovatelia v čase">${grid}${paths}${xl}</svg>
    <div class="legend">${lines.map(l=>`<span class="pb" style="--p:${l.color}"><i></i>${esc(l.name)}</span>`).join('')}</div>`;
}

/* ---------- model (všetky výpočty na jednom mieste) ---------- */
function histRows(){
  return (Array.isArray(HIST)?HIST:[]).filter(h=>h&&typeof h==='object'&&!h.gap&&h.date&&String(h.date)>=RELIABLE_FROM&&h.fac&&typeof h.fac==='object')
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function rowOnOrBefore(rows,ds){let r=null;for(const h of rows){if(h.date<=ds)r=h;else break;}return r;}
function followers(p,k){
  if(k==='youtube')return num(p.yt&&p.yt.subs);
  if(k==='tiktok')return num(p.tiktok&&p.tiktok.followers);
  return num(p.instagram&&p.instagram.followers);
}
function hasAcct(p,k,vids){
  const o=k==='youtube'?p.yt:k==='tiktok'?p.tiktok:p.instagram;
  return !!(o&&typeof o==='object')||vids.some(v=>v._k===k);
}
/* Rady: pravidlá zo starej verzie (renderTips), ale nad spoľahlivými číslami:
   zhliadnutia = per-video dáta (videá za 7/14 dní), sledovatelia = rozdiel voči histórii spred 7 dní */
function tipsFor(P){
  const p=P.raw, tips=[], add=(lvl,txt)=>tips.push({lvl,txt});
  if(P.idle>3&&P.idle<999)add(0,`nič nové nevyšlo ${P.idle} dní — skontroluj beh fabriky`);
  const s14=dayStr(14);
  let best=null;
  PLATS.filter(k=>!ONLY[p.name]||ONLY[p.name].includes(k)).forEach(k=>{
    const x=P.per[k], pv=P.vids.filter(v=>v._k===k);
    if(!pv.length&&!x.followers)return;   // platforma nepoužívaná
    const n14=pv.filter(v=>String(v.published||'')>=s14).length;
    if(n14===0)add(0,`${PN[k]}: za 14 dní tam nevyšlo žiadne video — fabrika tam zrejme neposiela`);
    else if(x.wkViews>=300&&x.delta!=null&&x.delta<=0)add(1,`${PN[k]}: +${fmt(x.wkViews)} zhliadnutí nových videí za 7 dní, ale 0 nových sledovateľov — na koniec videa daj dôvod sledovať (séria, „časť 2 zajtra“)`);
    if(x.wkViews>0&&(!best||x.wkViews>best.dv))best={k,dv:x.wkViews};
  });
  if(best&&P.plats.length>1)add(2,`najviac ťahá ${PN[best.k]} (${fmt(best.dv)} zhliadnutí nových videí za 7 dní) — tu sa oplatí pridať frekvenciu`);
  const nv=P.week.filter(v=>v._views>0).sort((x,y)=>y._views-x._views);
  if(nv.length>=3){const top=nv[0], med=nv[Math.floor(nv.length/2)]._views||1;
    if(top._views>=2*med)add(2,`hit týždňa „${esc(String(top.title||'').slice(0,60))}“ (${fmt(top._views)} zhliad., ${Math.round(top._views/med)}× medián) — sprav ďalšie na rovnakú tému/hák`);}
  return tips.sort((x,y)=>x.lvl-y.lvl);
}
function build(){
  const rows=histRows(), base7=rowOnOrBefore(rows,dayStr(7)), s7=dayStr(7), s30=dayStr(30);
  const dates=rows.slice(1).map(r=>r.date).slice(-30);
  const projects=DATA.projects.filter(p=>p&&typeof p==='object'&&p.name).map(p=>{
    const color=colOf(p), label=String(p.label||p.name);
    const vids=(Array.isArray(p.videos)?p.videos:[]).filter(v=>v&&typeof v==='object')
      .map(v=>Object.assign({},v,{_k:plat(v),_views:num(v.views),_fac:p.name,_label:label,_color:color}));
    const plats=PLATS.filter(k=>ONLY[p.name]?ONLY[p.name].includes(k):hasAcct(p,k,vids));
    const allPlats=PLATS.filter(k=>hasAcct(p,k,vids));
    const pubs=vids.map(v=>String(v.published||'').slice(0,10)).filter(Boolean).sort();
    const lastPub=pubs.length?pubs[pubs.length-1]:null, idle=daysSince(lastPub);
    const fresh=!!(p.tiktok&&num(p.tiktok.videos)>0&&num(p.tiktok.videos)<=3);   // nový účet / nová séria
    const hb=base7&&base7.fac?base7.fac[p.name]:null;
    const per={};
    PLATS.forEach(k=>{
      const pv=vids.filter(v=>v._k===k);
      const w=pv.filter(v=>String(v.published||'')>=s7).sort((a,b)=>b._views-a._views);
      const m30=pv.filter(v=>String(v.published||'')>=s30);
      const f=followers(p,k), prev=hb&&hb[HF[k]]!=null?num(hb[HF[k]]):null;
      per[k]={followers:f,delta:prev==null?null:f-prev,wkViews:w.reduce((s,v)=>s+v._views,0),wkCount:w.length,
        median:median(m30.map(v=>v._views)),n30:m30.length,top:w[0]||null,
        link:safeUrl(p.channels&&p.channels[k]&&p.channels[k].link),
        hist:rows.slice(-31).map(r=>{const x=r.fac[p.name];return x&&x[HF[k]]!=null?num(x[HF[k]]):null;})};
    });
    const sumP=(ks,fn)=>ks.reduce((s,k)=>s+fn(per[k]),0);
    // fabrika = jej aktívne platformy (ONLY); sieť = všetky účty
    const foll=sumP(plats,x=>x.followers), dKnown=plats.some(k=>per[k].delta!=null);
    const follNet=sumP(allPlats,x=>x.followers), dNetKnown=allPlats.some(k=>per[k].delta!=null);
    const week=vids.filter(v=>plats.includes(v._k)&&String(v.published||'')>=s7).sort((a,b)=>b._views-a._views);
    // denný prírastok zhliadnutí z histórie (len platformy fabriky, záporné = 0)
    const series=[];
    for(let i=1;i<rows.length;i++){
      const a=rows[i-1].fac[p.name], b=rows[i].fac[p.name];
      let v=0; if(a&&b)plats.forEach(k=>{v+=Math.max(0,num(b[HV[k]])-num(a[HV[k]]));});
      series.push({date:rows[i].date,v});
    }
    const P={name:p.name,label,color,niche:String(p.niche||''),raw:p,vids,plats,allPlats,per,idle,lastPub,fresh,
      active:idle<=14||fresh,foll,dFoll:dKnown?sumP(plats,x=>num(x.delta)):null,
      follNet,dFollNet:dNetKnown?sumP(allPlats,x=>num(x.delta)):null,
      week,wkViews:week.reduce((s,v)=>s+v._views,0),wkCount:week.length,top:week[0]||null,
      median30:median(vids.filter(v=>plats.includes(v._k)&&String(v.published||'')>=s30).map(v=>v._views)),
      series:series.slice(-30),experiment:(p.experiment&&typeof p.experiment==='object')?p.experiment:null};
    P.tips=tipsFor(P);
    return P;
  });
  const byName={};projects.forEach(P=>byName[P.name]=P);
  const net={foll:0,dFoll:null,wkViews:0,wkCount:0,perPlat:{youtube:0,tiktok:0,instagram:0},follPlat:{youtube:0,tiktok:0,instagram:0},series:[],best:null};
  projects.forEach(P=>{
    net.foll+=P.follNet; if(P.dFollNet!=null)net.dFoll=(net.dFoll||0)+P.dFollNet;
    net.wkViews+=P.wkViews; net.wkCount+=P.wkCount;
    P.week.forEach(v=>{net.perPlat[v._k]=(net.perPlat[v._k]||0)+1;});
    P.allPlats.forEach(k=>{net.follPlat[k]+=P.per[k].followers;});
    if(P.top&&(!net.best||P.top._views>net.best._views))net.best=P.top;
  });
  const sd={};projects.forEach(P=>P.series.forEach(s=>{sd[s.date]=(sd[s.date]||0)+s.v;}));
  net.series=Object.keys(sd).sort().map(d=>({date:d,v:sd[d]})).slice(-30);
  if(net.best){const B=byName[net.best._fac];const pk=B&&B.per[net.best._k];net.bestX=pk&&pk.median>0?net.best._views/pk.median:0;}
  const active=projects.filter(P=>P.active).sort((a,b)=>b.wkViews-a.wkViews||b.foll-a.foll);
  const inactive=projects.filter(P=>!P.active).sort((a,b)=>a.idle-b.idle);
  return {projects,byName,net,active,inactive,rows,dates};
}

/* ---------- galaxia (canvas 2D, pseudo-3D obežné dráhy) ---------- */
const GX={raf:0,on:true,hover:null,bodies:[],cleanup:null};
function initGalaxy(){
  if(GX.cleanup)GX.cleanup();
  const cv=$('#gx'), wrap=$('#gxwrap'), tip=$('#gtip');
  if(!cv||!cv.getContext)return;
  const ctx=cv.getContext('2d');
  const ps=M.projects; if(!ps.length)return;
  const maxF=Math.max(1,...ps.map(P=>P.foll)), maxW=Math.max(1,...ps.map(P=>P.wkViews));
  const bestFac=M.net.best?M.net.best._fac:null;
  // poradie dráh: najhorúcejšie (zhliadnutia 7 d) najbližšie k slnku
  const order=[...ps].sort((a,b)=>b.wkViews-a.wkViews||b.foll-a.foll);
  let W=0,H=0,cx=0,cy=0,stars=[],sunR=20,mobile=false,last=0,speed=1,tsec=0;
  const bodies=order.map((P,i)=>({P,i,a:i*2.39996+0.6,g:P.wkViews/maxW,f:Math.sqrt(P.foll/maxF),rx:0,ry:0,r:0,w:0,x:0,y:0,sc:1,depth:0}));
  GX.bodies=bodies;
  function size(){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    W=Math.max(280,wrap.clientWidth||cv.clientWidth||0); mobile=W<640;
    H=mobile?Math.round(Math.min(500,W*1.3)):Math.round(Math.max(420,Math.min(600,W*.5)));
    cv.style.height=H+'px'; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    cx=W/2; cy=H/2+(mobile?6:10);
    const tilt=mobile?.92:.40, rx0=mobile?58:Math.min(140,W*.12);
    const rxMax=Math.max(rx0+20,mobile?Math.min(W/2-22,(H/2-34)/tilt):Math.min(W/2-70,(H/2-48)/tilt));
    sunR=mobile?15:22;
    bodies.forEach(b=>{const fr=bodies.length<2?0:b.i/(bodies.length-1);
      b.rx=rx0+(rxMax-rx0)*fr; b.ry=b.rx*tilt;
      b.r=((mobile?4.5:8)+(mobile?13:30)*b.f)*(mobile&&!b.P.active?.75:1);
      b.w=(mobile?.20:.16)*Math.pow(rx0/b.rx,.9)*(b.P.active?1:.6);});
    stars=Array.from({length:Math.round(W*H/2200)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+.2,a:Math.random()*.55+.15,t:Math.random()*6.28,s:.6+Math.random()*1.8}));
    draw();
  }
  function drawSun(){
    const pulse=1+.06*Math.sin(tsec*1.4);
    const cor=ctx.createRadialGradient(cx,cy,sunR*.4,cx,cy,sunR*4.2*pulse);
    cor.addColorStop(0,'rgba(190,200,255,.55)');cor.addColorStop(.25,'rgba(120,130,255,.22)');cor.addColorStop(1,'rgba(80,60,200,0)');
    ctx.fillStyle=cor;ctx.beginPath();ctx.arc(cx,cy,sunR*4.2*pulse,0,6.2832);ctx.fill();
    const core=ctx.createRadialGradient(cx-sunR*.3,cy-sunR*.35,sunR*.1,cx,cy,sunR);
    core.addColorStop(0,'#ffffff');core.addColorStop(.35,'#dfe5ff');core.addColorStop(.75,'#8b9bff');core.addColorStop(1,'#5b4bd6');
    ctx.fillStyle=core;ctx.beginPath();ctx.arc(cx,cy,sunR,0,6.2832);ctx.fill();
    ctx.textAlign='center';ctx.fillStyle='rgba(238,242,251,.9)';ctx.font=`700 ${mobile?11:13}px "Space Grotesk",Inter,sans-serif`;
    ctx.fillText(fmtc(M.net.foll),cx,cy+sunR+(mobile?14:18));
    ctx.fillStyle='rgba(151,163,189,.8)';ctx.font=`500 ${mobile?9.5:10.5}px Inter,sans-serif`;
    ctx.fillText('sledovateľov siete',cx,cy+sunR+(mobile?26:32));
  }
  function ring(b,x,y,rr,front){
    ctx.save();ctx.translate(x,y);ctx.rotate(-.38);ctx.beginPath();
    ctx.ellipse(0,0,rr*2.05,rr*.55,0,front?0:Math.PI,front?Math.PI:2*Math.PI);
    ctx.strokeStyle=rgba(b.P.color,.75);ctx.lineWidth=Math.max(1.2,rr*.12);ctx.stroke();
    ctx.beginPath();ctx.ellipse(0,0,rr*1.7,rr*.45,0,front?0:Math.PI,front?Math.PI:2*Math.PI);
    ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;ctx.stroke();ctx.restore();
  }
  function drawPlanet(b){
    const P=b.P, x=b.x, y=b.y, rr=b.r*b.sc, hov=GX.hover===b, act=P.active, c=P.color;
    const g=act?b.g:0;
    // žiara podľa rastu
    const gr=rr*(1.5+3.2*g)+(hov?10:0);
    const gl=ctx.createRadialGradient(x,y,rr*.5,x,y,gr);
    gl.addColorStop(0,rgba(c,(act?.22:.06)+.5*g+(hov?.2:0)));gl.addColorStop(1,rgba(c,0));
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,y,gr,0,6.2832);ctx.fill();
    // pulzujúca vlna pri raste
    if(act&&g>.05&&!RM){const ph=((tsec*.45)+b.i*.37)%1;ctx.beginPath();ctx.arc(x,y,rr+ph*rr*2.4,0,6.2832);
      ctx.strokeStyle=rgba(c,(1-ph)*.45*Math.min(1,g*1.6));ctx.lineWidth=1.2;ctx.stroke();}
    const hasRing=P.name===bestFac&&act;
    if(hasRing)ring(b,x,y,rr,false);
    // guľa osvetlená od slnka
    const dx=cx-x, dy=cy-y, L=Math.hypot(dx,dy)||1;
    const hx=x+dx/L*rr*.5, hy=y+dy/L*rr*.5;
    const sg=ctx.createRadialGradient(hx,hy,rr*.06,x,y,rr*1.02);
    sg.addColorStop(0,mix(c,'#ffffff',.6));sg.addColorStop(.42,c);sg.addColorStop(1,mix(c,'#000000',.78));
    ctx.save();ctx.globalAlpha=act?1:.5;ctx.fillStyle=sg;ctx.beginPath();ctx.arc(x,y,rr,0,6.2832);ctx.fill();
    // pásy atmosféry
    ctx.clip();ctx.globalAlpha=act?.14:.08;ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(.6,rr*.08);
    for(let k=-2;k<=2;k++){ctx.beginPath();ctx.ellipse(x,y+k*rr*.34,rr*1.1,rr*.12,-.15,0,6.2832);ctx.stroke();}
    ctx.restore();
    if(!act){ctx.fillStyle='rgba(6,8,16,.35)';ctx.beginPath();ctx.arc(x,y,rr,0,6.2832);ctx.fill();}
    ctx.beginPath();ctx.arc(x,y,rr,0,6.2832);ctx.strokeStyle=rgba(c,hov?.95:.45);ctx.lineWidth=hov?1.8:1;ctx.stroke();
    if(hasRing)ring(b,x,y,rr,true);
    // popisok
    if(act||hov||!mobile){
      ctx.textAlign='center';ctx.font=`600 ${mobile?10.5:12}px Inter,sans-serif`;
      ctx.fillStyle=act||hov?'rgba(238,242,251,.95)':'rgba(151,163,189,.55)';
      const ly=y+rr+(mobile?12:15)+(hasRing?rr*.25:0);
      ctx.fillText(P.label,x,ly);
      if(act){ctx.font=`500 ${mobile?9.5:10.5}px Inter,sans-serif`;ctx.fillStyle=rgba(c,.95);ctx.fillText(fmtc(P.wkViews)+' / 7 d',x,ly+(mobile?11:14));}
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){ctx.globalAlpha=RM?s.a:s.a*(.55+.45*Math.sin(tsec*s.s+s.t));ctx.fillStyle='#dfe6ff';ctx.fillRect(s.x,s.y,s.r,s.r);}
    ctx.globalAlpha=1;
    for(const b of bodies){
      b.x=cx+b.rx*Math.cos(b.a); b.y=cy+b.ry*Math.sin(b.a); b.depth=Math.sin(b.a); b.sc=.82+.18*(b.depth+1)/2;
      ctx.beginPath();ctx.ellipse(cx,cy,b.rx,b.ry,0,0,6.2832);
      ctx.strokeStyle=b.P.active?rgba(b.P.color,GX.hover===b?.5:.16):'rgba(255,255,255,.045)';ctx.lineWidth=GX.hover===b?1.4:1;ctx.stroke();
    }
    const list=[...bodies.map(b=>({d:b.depth,b})),{d:0,sun:true}].sort((a,b)=>a.d-b.d);
    for(const it of list){if(it.sun)drawSun();else drawPlanet(it.b);}
  }
  function loop(ts){
    GX.raf=0;
    const dt=last?Math.min(60,ts-last):16; last=ts;
    speed+=((GX.hover?.12:1)-speed)*.08;
    if(!RM){tsec+=dt/1000;bodies.forEach(b=>{b.a+=b.w*speed*dt/1000;});}
    try{draw();}catch(e){console.error('galaxia:',e);return;}
    if(GX.on&&!RM&&!document.hidden)GX.raf=requestAnimationFrame(loop);
  }
  function start(){if(!GX.raf&&!RM){last=0;GX.raf=requestAnimationFrame(loop);}}
  function stop(){if(GX.raf)cancelAnimationFrame(GX.raf);GX.raf=0;}
  function hit(ev){
    const r=cv.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
    let best=null,bd=1e9;
    for(const b of bodies){const d=Math.hypot(mx-b.x,my-b.y);const lim=b.r*b.sc+(mobile?12:8);if(d<lim&&d<bd){bd=d;best=b;}}
    return {b:best,mx,my};
  }
  function showTip(b){
    if(!b){tip.classList.remove('on');return;}
    const P=b.P;
    tip.innerHTML=`<h4><span class="orb" style="--c:${P.color};width:12px;height:12px"></span>${esc(P.label)}</h4>
      <div class="r">Sledovatelia<b>${fmt(P.foll)} ${P.dFoll?`<span style="color:${P.dFoll>0?'#4ade80':'#fb7185'}">${P.dFoll>0?'+':''}${fmt(P.dFoll)}</span>`:''}</b></div>
      <div class="r">Zhliadnutia 7 d<b>${fmt(P.wkViews)}</b></div>
      <div class="r">Videá 7 d<b>${P.wkCount}</b></div>
      <div class="r">Posledné video<b>${relDay(P.idle)}</b></div>
      <div class="go">Klikni pre detail →</div>`;
    const tw=tip.offsetWidth||200, th=tip.offsetHeight||130;
    let x=b.x+b.r*b.sc+14, y=b.y-th/2;
    if(x+tw>W-8)x=b.x-b.r*b.sc-14-tw;
    x=Math.max(8,Math.min(W-tw-8,x)); y=Math.max(8,Math.min(H-th-8,y));
    tip.style.transform='none';tip.style.left=x+'px';tip.style.top=y+'px';tip.classList.add('on');
  }
  const onMove=ev=>{if(ev.pointerType==='touch')return;const {b}=hit(ev);if(b!==GX.hover){GX.hover=b;cv.style.cursor=b?'pointer':'default';showTip(b);if(RM)draw();}else if(b)showTip(b);};
  const onLeave=()=>{GX.hover=null;cv.style.cursor='default';showTip(null);if(RM)draw();};
  const onClick=ev=>{const {b}=hit(ev);if(b)openDetail(b.P.name);};
  cv.addEventListener('pointermove',onMove);cv.addEventListener('pointerleave',onLeave);cv.addEventListener('click',onClick);
  const ro=window.ResizeObserver?new ResizeObserver(()=>{if(wrap.clientWidth!==W)size();}):null; if(ro)ro.observe(wrap);
  const io=window.IntersectionObserver?new IntersectionObserver(es=>{GX.on=es[0].isIntersecting;GX.on?start():stop();}):null; if(io)io.observe(cv);
  const vis=()=>{document.hidden?stop():(GX.on&&start());}; document.addEventListener('visibilitychange',vis);
  GX.cleanup=()=>{stop();if(ro)ro.disconnect();if(io)io.disconnect();document.removeEventListener('visibilitychange',vis);};
  try{size();start();}catch(e){console.error('galaxia:',e);stop();}
}

/* ---------- hviezdne pozadie (statické, prekreslí sa pri zmene veľkosti) ---------- */
function drawStars(){
  const c=$('#stars'); if(!c||!c.getContext)return; const x=c.getContext('2d');
  const dpr=Math.min(2,window.devicePixelRatio||1), w=innerWidth, h=innerHeight;
  c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
  for(let i=0,n=Math.round(w*h/5000);i<n;i++){x.globalAlpha=Math.random()*.5+.1;x.fillStyle=Math.random()<.15?'#c7d2fe':'#fff';
    const r=Math.random()<.06?1.6:Math.random()*1+.3;x.fillRect(Math.random()*w,Math.random()*h,r,r);}
}

/* ---------- count-up ---------- */
function countUp(el){
  const to=num(el.dataset.to);
  if(RM){el.textContent=fmt(to);return;}
  const dur=1500, t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,4);el.textContent=fmt(to*e);if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
function animateCounts(root){
  const els=$$('[data-to]',root);
  if(!window.IntersectionObserver){els.forEach(el=>el.textContent=fmt(num(el.dataset.to)));return;}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);countUp(e.target);}}),{threshold:.15});
  els.forEach(el=>io.observe(el));
}

/* ---------- detail fabriky ---------- */
const DS={name:null,tab:'prehlad',vp:'all',vt:'30'};
function openDetail(name,tab){
  if(!M||!M.byName[name])return;
  DS.name=name; DS.tab=tab||'prehlad'; DS.vp='all'; DS.vt='30';
  const want='#f/'+encodeURIComponent(name);
  if(location.hash!==want){try{history.pushState(null,'',want);}catch(e){}}
  renderDetail();
  $('#sheet').classList.add('open'); document.body.classList.add('lock');
  $('#sheet').scrollTop=0;
  setTimeout(()=>{const x=$('#panel .x');if(x)x.focus({preventScroll:true});},30);
}
function closeDetail(fromHash){
  if(!$('#sheet').classList.contains('open'))return;
  $('#sheet').classList.remove('open'); document.body.classList.remove('lock');
  const n=DS.name; DS.name=null;
  if(!fromHash&&location.hash.startsWith('#f/')){try{history.pushState(null,'',location.pathname+location.search);}catch(e){}}
  const back=n&&document.querySelector(`.fc[data-open="${CSS.escape(n)}"]`); if(back)back.focus({preventScroll:true});
}
function detailOverview(P){
  const k4=`<div class="dk">
    <div class="kpi" style="--k:${P.color}"><div class="lab">Sledovatelia</div><div class="big num" data-to="${P.foll}">0</div><div class="sub">${dchip(P.dFoll)} za 7 dní</div></div>
    <div class="kpi" style="--k:#34d399"><div class="lab">Zhliadnutia 7 d</div><div class="big num" data-to="${P.wkViews}">0</div><div class="sub">nové videá</div></div>
    <div class="kpi" style="--k:#fbbf24"><div class="lab">Videá 7 d</div><div class="big num" data-to="${P.wkCount}">0</div><div class="sub">posledné ${relDay(P.idle)}</div></div>
    <div class="kpi" style="--k:#b49bff"><div class="lab">Medián / video</div><div class="big num" data-to="${P.median30}">0</div><div class="sub">videá za 30 d</div></div></div>`;
  const pcs=`<div class="pcards">${(P.plats.length?P.plats:P.allPlats).map(k=>{const x=P.per[k];
    return `<div class="pc"><div class="hd">${pbadge(k)}${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">profil ↗</a>`:''}</div>
      <div class="fl num">${fmt(x.followers)}</div><div>${dchip(x.delta)} <span class="muted" style="font-size:12px">sledovatelia · 7 d</span></div>
      ${spark(x.hist.filter(v=>v!=null),PC[k],300,50,true)}
      <div class="kv"><div>Zhliadnutia 7 d<b>${fmt(x.wkViews)}</b></div><div>Videá 7 d<b>${x.wkCount}</b></div>
        <div>Medián / video<b>${x.n30?fmt(x.median):'—'}</b></div><div>Top 7 d<b>${x.top?fmtc(x.top._views):'—'}</b></div></div>
    </div>`;}).join('')}</div>`;
  return `${k4}${pcs}
    <div class="dsec"><h3>Top video týždňa</h3>${topVideo(P.top,'Najlepšie za 7 dní')}</div>
    ${P.experiment?`<div class="dsec">${expBlock(P.experiment)}</div>`:''}
    <div class="dsec"><h3>Rady <small>z videí za 7–14 dní a sledovateľov</small></h3><div class="box">${tipsBlock(P)}</div></div>`;
}
function detailVideos(P){
  const s=DS.vt==='all'?'':dayStr(+DS.vt);
  let vs=P.vids.filter(v=>(DS.vp==='all'||v._k===DS.vp)&&(!s||String(v.published||'')>=s)).sort((a,b)=>b._views-a._views);
  const mx=Math.max(1,...vs.map(v=>v._views));
  const plats=P.allPlats.filter(k=>P.vids.some(v=>v._k===k));
  const chipsP=['all',...plats].map(k=>`<button type="button" class="chip ${DS.vp===k?'on':''}" data-vp="${k}">${k==='all'?'Všetky':PN[k]}</button>`).join('');
  const chipsT=[['7','7 dní'],['30','30 dní'],['all','Všetko']].map(([k,l])=>`<button type="button" class="chip ${DS.vt===k?'on':''}" data-vt="${k}">${l}</button>`).join('');
  const shown=vs.slice(0,60);
  return `<div class="chips">${chipsP}</div><div class="chips">${chipsT}</div>
    <div class="muted" style="font-size:12px;margin-bottom:10px">${vs.length} ${vs.length===1?'video':vs.length>=2&&vs.length<=4?'videá':'videí'}${vs.length>shown.length?` · zobrazených ${shown.length}`:''} · zoradené podľa zhliadnutí</div>
    <div class="vl">${shown.map((v,i)=>{const u=safeUrl(v.link), med=P.per[v._k]&&P.per[v._k].median, xm=med>0?v._views/med:0;
      return `<a class="vr" style="--d:${Math.min(i,20)*25}ms" ${u?`href="${esc(u)}" target="_blank" rel="noopener noreferrer"`:''}>
        <span class="rk">${i+1}</span>
        <span style="min-width:0"><div class="vt">${esc(v.title||'(bez názvu)')}</div>
          <div class="vm">${pbadge(v._k)}<span>${esc(sDate(v.published)||'—')}</span><span>♥ ${fmt(v.likes)}</span>${num(v.comments)?`<span>💬 ${fmt(v.comments)}</span>`:''}${xm>=2?`<span class="xm">${Math.round(xm)}× medián</span>`:''}</div></span>
        <span class="vv">${fmt(v._views)}<small>zhliad.</small></span>
        <span class="bar"><i style="width:${(v._views/mx*100).toFixed(1)}%"></i></span></a>`;}).join('')||'<div class="empty" style="margin:0">Žiadne videá v tomto výbere.</div>'}</div>`;
}
function detailGrowth(P){
  const dates=M.rows.slice(-31).map(r=>r.date);
  const lines=P.allPlats.map(k=>({name:PN[k],color:PC[k],vals:P.per[k].hist}));
  return `<div class="dsec" style="margin-top:0"><h3>Denný prírastok zhliadnutí <small>z histórie · ${P.plats.map(k=>PN[k]).join(' + ')||'—'} · posledných 30 dní</small></h3>
      <div class="box">${barsChart(P.series,P.color)}<div class="note">História zhliadnutí sa berie až od 1. 10. 2026 — staršie hodnoty boli držané/orezané a skresľovali by graf. Záporné zmeny = 0.</div></div></div>
    <div class="dsec"><h3>Sledovatelia <small>denný stav · posledných 30 dní</small></h3><div class="box">${linesChart(lines,dates)}</div></div>`;
}
function renderDetail(){
  const P=M.byName[DS.name]; if(!P)return;
  const links=P.allPlats.map(k=>P.per[k].link?`<a href="${esc(P.per[k].link)}" target="_blank" rel="noopener noreferrer">${PN[k]} ↗</a>`:'').filter(Boolean).join('');
  const body=DS.tab==='videa'?detailVideos(P):DS.tab==='rast'?detailGrowth(P):detailOverview(P);
  const panel=$('#panel'); panel.style.setProperty('--c',P.color);
  panel.innerHTML=`<button class="x" type="button" data-close aria-label="Zavrieť">×</button>
    <div class="dh"><div class="dtop"><span class="orb" aria-hidden="true"></span><div style="min-width:0">
      <div class="eyebrow" style="color:${P.color}">${esc(P.niche||'Fabrika')}</div>
      <h2 id="dtitle">${esc(P.label)}</h2>
      <div class="ni">${P.active?'<span class="live">aktívna</span>':'<span class="d z">neaktívna</span>'}<span>posledné video ${relDay(P.idle)}</span>${links}</div></div></div>
      <div class="dtabs" role="tablist">${[['prehlad','Prehľad'],['videa','Videá'],['rast','Rast']].map(([k,l])=>`<button type="button" role="tab" aria-selected="${DS.tab===k}" class="${DS.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div></div>
    <div class="db">${body}</div>`;
  animateCounts(panel);
}

/* ---------- celá stránka ---------- */
function renderAll(){
  M=build();
  const app=$('#app');
  if(!M.projects.length){
    app.innerHTML=`<div class="empty">Zatiaľ žiadne fabriky ani dáta. Spusti <code>python generate.py</code> alebo klikni „↻ Obnoviť“.</div>`;return;
  }
  app.innerHTML=renderHero()+renderGalaxyShell()+renderFactories()+
    `<footer>Dáta k ${esc(DATA.gen_at||'—')} · Zhliadnutia = súčet zhliadnutí videí publikovaných za posledných 7 dní (per-video dáta). Medián = videá za 30 dní.
     Sledovatelia: aktuálny stav vs. záznam v histórii spred 7 dní. Denné grafy z histórie od 1. 10. 2026.
     Rady sa riadia rovnakými pravidlami ako v starej verzii. <a href="/old" style="color:var(--acc)">Stará verzia →</a></footer>`;
  animateCounts(app);
  try{initGalaxy();}catch(e){console.error('galaxia:',e);}
  spyNav();
}
function spyNav(){
  if(!window.IntersectionObserver)return;
  const links=$$('nav.nav a[data-sec]');
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.dataset.sec===e.target.id));}),{rootMargin:'-45% 0px -50% 0px'});
  ['prehlad','galaxia','fabriky'].forEach(id=>{const s=document.getElementById(id);if(s)io.observe(s);});
}
function normalizeData(d){
  d=(d&&typeof d==='object')?d:{};
  d.projects=Array.isArray(d.projects)?d.projects:[];
  d.totals=d.totals||{}; d.prev=d.prev||{};
  return d;
}
function routeHash(){
  const h=location.hash||'';
  if(h.startsWith('#f/')){let n='';try{n=decodeURIComponent(h.slice(3));}catch(e){}
    if(M&&M.byName[n]){if(DS.name!==n)openDetail(n);}else closeDetail(true);}
  else closeDetail(true);
}
async function load(){
  try{
    const [dRes,hRes]=await Promise.all([fetch('/data.json?'+Date.now()),fetch('/history.json?'+Date.now()).catch(()=>null)]);
    if(!dRes.ok)throw new Error('server vrátil '+dRes.status);
    DATA=normalizeData(await dRes.json());
    try{HIST=hRes&&hRes.ok?await hRes.json():[];}catch(e){HIST=[];}
    if(!Array.isArray(HIST))HIST=[];
  }catch(e){
    $('#updated').textContent='chyba načítania';
    $('#app').innerHTML=`<div class="empty">Dáta sa nepodarilo načítať (${esc(e&&e.message||e)}).<br>
      Skontroluj, či beží <code>server.py</code>.<br><button class="btn" type="button" onclick="load()">↻ Skúsiť znova</button></div>`;
    return;
  }
  $('#updated').textContent=DATA.gen_at?('dáta k '+DATA.gen_at):'zatiaľ žiadne dáta';
  try{renderAll();}catch(e){
    console.error(e);
    $('#app').innerHTML=`<div class="empty">Chyba pri vykreslení (${esc(e&&e.message||e)}). <a href="/old" style="color:var(--acc)">Otvoriť starú verziu →</a></div>`;
    return;
  }
  routeHash();
}
async function refresh(){
  const b=$('#refresh'); b.innerHTML='<span class="spin" aria-hidden="true"></span> Obnovujem…'; b.disabled=true;
  try{await fetch('/api/refresh?force=1');}catch(e){/* server nedostupný -> aspoň znova načítaj */}
  await load(); b.innerHTML='↻ Obnoviť'; b.disabled=false;
}

/* ---------- udalosti ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.closest('[data-close]')){closeDetail();return;}
  const tab=t.closest('[data-tab]'); if(tab){DS.tab=tab.dataset.tab;renderDetail();return;}
  const vp=t.closest('[data-vp]'); if(vp){DS.vp=vp.dataset.vp;renderDetail();return;}
  const vt=t.closest('[data-vt]'); if(vt){DS.vt=vt.dataset.vt;renderDetail();return;}
  if(t.closest('a'))return;
  const o=t.closest('[data-open]'); if(o){openDetail(o.dataset.open);}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape')closeDetail();
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('fc')){ev.preventDefault();openDetail(ev.target.dataset.open);}
});
window.addEventListener('popstate',routeHash);
window.addEventListener('hashchange',routeHash);
$('#refresh').addEventListener('click',refresh);
let _rs=0; window.addEventListener('resize',()=>{clearTimeout(_rs);_rs=setTimeout(drawStars,200);});
drawStars();
load();
</script></body></html>
