<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>FacelessFactory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14161a;--mute:#6b7280;--line:#e6e8ec;--yt:#e5372f;--tt:#111;--tt2:#25c3c9;--ig:#c13584;--up:#15803d;--warn:#b45309;--warnbg:#fff7e6;--shadow:0 10px 40px rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--ink:#e8eaee;--mute:#8b93a1;--line:#262a33;--tt:#e8eaee;--up:#4ade80;--warn:#fbbf24;--warnbg:#2a2210;--shadow:0 10px 40px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:18px;margin:0;font-weight:700}
header .d{color:var(--mute)}
nav{margin-left:auto;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;max-width:100%;overflow-x:auto}
nav a{padding:6px 12px;border-radius:7px;color:var(--mute);text-decoration:none;font-weight:500;white-space:nowrap}
nav a.on{background:var(--bg);color:var(--ink)}
nav a .b{background:var(--yt);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
nav a .b[hidden]{display:none}
nav a.off{opacity:.45}
.seg{display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--card)}
.seg button{padding:4px 10px;border-radius:6px;color:var(--mute);cursor:pointer;background:none;border:0}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--bg)}
.btn:disabled{opacity:.6;cursor:default}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.gh{background:none}
.plat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.pc .top{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.pc .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.pc .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.pc .l{color:var(--mute);font-size:12px}
.pc .sub{display:flex;gap:16px;margin-top:6px;color:var(--mute);font-size:12px;flex-wrap:wrap}
.pc .sub b{color:var(--ink);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:2px;height:44px;margin-top:12px}
.bars i{flex:1;border-radius:2px 2px 0 0;opacity:.85;min-height:1px}
.note{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:13px}
.note a{font-weight:600;text-decoration:underline;cursor:pointer}
h2{font-size:15px;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{color:var(--mute);font-weight:400;font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:600}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tr.r{cursor:pointer}
tbody tr.r:hover,tbody tr.r:focus-visible{background:var(--bg);outline:0}
td .g{color:var(--up);font-size:12px;margin-left:4px}
td .z,.z{color:var(--mute)}
td .cn{display:inline-flex;align-items:center;gap:8px;font-weight:600}
td .wi{color:var(--warn);font-weight:700;margin-left:4px;font-size:12px}
tr.sep td{background:var(--bg);color:var(--mute);font-size:12px;cursor:pointer;text-align:left;white-space:normal}
tr.sl{opacity:.65}
tr[hidden]{display:none}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.st i{width:8px;height:8px;border-radius:50%}
.top10{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vid{min-width:0;display:flex;gap:10px;align-items:center;padding:10px 12px;text-decoration:none;color:inherit}
.vid:hover{background:var(--bg)}
.vid .n{font-weight:700;font-size:16px;min-width:58px;text-align:right}
.vid .t{flex:1;min-width:0}
.vid .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vid .t small{color:var(--mute)}
.tag{font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;color:#fff;display:inline-block;flex:none}
.tag.youtube{background:var(--yt)}.tag.instagram{background:var(--ig)}.tag.tiktok{background:var(--tt2);color:#04282a}
.empty{padding:28px 12px;text-align:center;color:var(--mute)}
.mute{color:var(--mute)}
code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:12px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--mute);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- detail kanála (zásuvka) ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:40}
#scrim.open{opacity:1;visibility:visible}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;display:flex;flex-direction:column;transform:translateX(104%);visibility:hidden;transition:transform .22s ease,visibility .22s}
#drawer.open{transform:none;visibility:visible}
.dh{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.dh .dot{margin-top:7px;width:12px;height:12px}
.dh h2{margin:0;font-size:18px;display:block}
.dh .sub{color:var(--mute);font-size:13px;margin-top:2px}
.dh .x{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--mute);padding:6px 8px;border-radius:8px}
.dh .x:hover{background:var(--bg);color:var(--ink)}
.dbody{overflow-y:auto;padding:14px 16px 40px;flex:1;-webkit-overflow-scrolling:touch}
.lks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.lk{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;text-decoration:none;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.lk:hover{background:var(--card);border-color:var(--mute)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.mini .card{padding:12px 14px}
.mini .top{display:flex;align-items:center;gap:8px;font-weight:600}
.mini .v{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.mini .l{color:var(--mute);font-size:12px}
.mini .sub{margin-top:4px;color:var(--mute);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
.mini .sub b{color:var(--ink);font-weight:600}
.acc{margin-top:8px;padding:6px 9px;border-radius:8px;font-size:12px;background:var(--warnbg);color:var(--warn)}
.acc.off{background:var(--bg);color:var(--mute)}
.dsec{margin-top:14px}
.dsec .card{padding:14px}
.dsec h3{font-size:13px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dsec h3 small{color:var(--mute);font-weight:400;font-size:12px}
.leg{display:flex;gap:12px;color:var(--mute);font-size:12px;margin-left:auto}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg .dot{width:8px;height:8px;border-radius:2px}
.chart{display:flex;align-items:flex-end;gap:2px;height:120px;position:relative;border-bottom:1px solid var(--line)}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.chart .col i{display:block;width:100%;min-height:0}
.chart .col i:first-child{border-radius:2px 2px 0 0}
.axis{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;margin-top:4px}
.ymax{position:absolute;top:-2px;left:0;font-size:11px;color:var(--mute);background:var(--card);padding-right:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats .s{min-width:0}
.stats .s .l{color:var(--mute);font-size:12px}
.stats .s .v{font-size:18px;font-weight:700;margin-top:2px}
.stats .s .x{color:var(--mute);font-size:12px;margin-top:2px}
.stats .s .x a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;cursor:pointer;color:var(--mute);font-size:12.5px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chips .sp{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--mute);font-size:12px}
.vt td.ti{white-space:normal;min-width:180px;max-width:260px}
.vt td.ti a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;text-decoration:none}
.vt td.ti a:hover{text-decoration:underline}
.more{display:block;margin:10px auto 0}

/* ---------- nástroje: Komentáre, Spotify, Episodary ---------- */
.tsh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.tsh h2{margin:0 0 2px;font-size:16px}
.tsh p{margin:0;color:var(--mute);font-size:13px;max-width:640px}
.tact{display:flex;gap:8px;flex-wrap:wrap}
.cposts{display:grid;gap:10px}
.cpost{padding:12px 14px}
.cphd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cpl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;font-weight:500}
a.cpl:hover{text-decoration:underline}
.cpn{color:var(--mute);font-size:12px}
.cm{padding:8px 0;border-top:1px solid var(--line)}
.cmt{overflow-wrap:anywhere}
.cu{font-weight:600}
.creply{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.cin{flex:1;min-width:140px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit}
.tband{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tband .lab{color:var(--mute);font-size:12px}
.tband .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.tband .s{color:var(--mute);font-size:12px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.box h3{font-size:13px;margin:0 0 10px}
.box h3 small{color:var(--mute);font-weight:400;font-size:12px;margin-left:6px}
.tnote{color:var(--mute);font-size:12.5px;margin:8px 0 0}
.mbars{display:flex;align-items:stretch;gap:4px;height:150px}
.mb{flex:1;display:flex;flex-direction:column;min-width:0}
.mbw{flex:1;display:flex;align-items:flex-end}
.mbw i{display:block;width:100%;background:var(--c);border-radius:3px 3px 0 0;opacity:.85}
.mv{font-size:10px;color:var(--mute);text-align:center;overflow:hidden}
.mn{font-size:10px;color:var(--mute);text-align:center;margin-top:3px;overflow:hidden}
.hbr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 0}
.hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hn a{text-decoration:none}
.ht{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.ht i{display:block;height:100%;background:var(--c);border-radius:4px}
.hv{color:var(--mute);font-size:12px;min-width:44px;text-align:right}
.tart{display:flex;gap:14px;align-items:center;margin-top:12px}
.tart img{border-radius:50%;object-fit:cover}
.tart h3{margin:0 0 2px;font-size:16px}
.albs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.alb{display:flex;gap:10px;align-items:center;text-decoration:none;min-width:0}
.alb img,.alb .ai{width:52px;height:52px;border-radius:6px;object-fit:cover;background:var(--bg);flex:none}
.alb .at{min-width:0;display:flex;flex-direction:column}
.alb .at b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.alb .at small{color:var(--mute)}
.tplat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tplat .lab{color:var(--mute);font-size:12px}
.tplat .v{font-size:20px;font-weight:700}
.tplat .s{color:var(--mute);font-size:12px}
.warnt{color:var(--warn);background:var(--warnbg);padding:8px 12px;border-radius:8px}

@media (max-width:760px){
  .plat,.top10,.row2{grid-template-columns:minmax(0,1fr)}
  nav{margin-left:0;width:100%}
  header{gap:10px}
  .stats{grid-template-columns:1fr 1fr}
  #drawer{width:100%;border-left:0}
}
@media (prefers-reduced-motion:reduce){#drawer,#scrim{transition:none}.spin{animation:none}}
</style></head><body>
<div class="wrap">
<header>
<h1>FacelessFactory</h1><span class="d" id="dt"></span>
<div class="seg" id="seg" role="group" aria-label="Obdobie"><button type="button" data-per="1">24 h</button><button type="button" data-per="7" class="on">7 dní</button><button type="button" data-per="30">30 dní</button></div>
<button class="btn" id="refresh" type="button">Obnoviť</button>
<nav aria-label="Navigácia">
<a href="#prehlad" data-view="prehlad" class="on">Prehľad</a>
<a href="#komentare" data-view="komentare">Komentáre<span class="b" id="cbadge" hidden></span></a>
<a href="#spotify" data-view="spotify">Spotify</a>
<a href="#episodary" data-view="episodary">Episodary</a>
</nav>
</header>

<main id="app"><div class="empty"><span class="spin" aria-hidden="true"></span> Načítavam…</div></main>

<div id="tools" hidden>
<section class="tvw" id="komentare" hidden></section>
<section class="tvw" id="spotify" hidden></section>
<section class="tvw" id="episodary" hidden></section>
</div>
</div>

<div id="scrim"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle" aria-hidden="true"></aside>

<script>
/* ======================= pomocníci ======================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const nf=new Intl.NumberFormat('sk-SK');
const fx=n=>nf.format(Math.round(+n||0));                       // presné číslo
const f=n=>{n=Math.round(+n||0);const a=Math.abs(n);           // skrátené číslo ako v návrhu
  if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1).replace('.',',')+'\u00a0mil.';
  if(a>=1e4)return (n/1e3).toFixed(a>=1e5?0:1).replace('.',',')+'\u00a0tis.';
  return nf.format(n);};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):'';
const num=x=>{const n=+x;return isFinite(n)?n:0;};
const isHex=c=>/^#[0-9a-f]{6}$/i.test(String(c||''));
const plw=(n,a,b,c)=>n===1?a:(n>=2&&n<=4)?b:c;
const p2=n=>String(n).padStart(2,'0');
const PL=['youtube','tiktok','instagram'];
const PN={youtube:'YouTube',tiktok:'TikTok',instagram:'Instagram'};
const PS={youtube:'YT',tiktok:'TT',instagram:'IG'};
const PV={youtube:'var(--yt)',tiktok:'var(--tt2)',instagram:'var(--ig)'};
const HV={youtube:'yv',tiktok:'tv',instagram:'iv'};   // history: zhliadnutia
const HO={youtube:'yok',tiktok:'tok',instagram:'iok'};   // history: dáta v ten deň naozaj prišli
const PERS=[1,7,30];
let PER=7; try{const s0=+localStorage.getItem('ff.per');if(PERS.includes(s0))PER=s0;}catch(e){}
const perLong=n=>n===1?'24 h':n+' dní';
let DATA=null, HIST=[], M=[], BY={}, SL_OPEN=false;

function platOf(v){const s=String(v&&v.platform||'').toLowerCase();
  return s.startsWith('you')?'youtube':s.startsWith('tik')?'tiktok':s.startsWith('insta')?'instagram':s;}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function addDays(ds,n){const d=new Date(ds+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function ageDays(ds){const s=String(ds||'').slice(0,10);if(!/^\d{4}-\d\d-\d\d$/.test(s))return 999;
  return Math.max(0,Math.round((Date.parse(todayStr()+'T00:00:00Z')-Date.parse(s+'T00:00:00Z'))/864e5));}
const pubCut=n=>addDays(todayStr(),-n);
function sDate(ds){const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(String(ds||''));if(!m)return '';
  return `${+m[3]}. ${+m[2]}.`+(+m[1]!==new Date().getFullYear()?' '+m[1]:'');}
function fmtStamp(iso){const d=new Date(iso);if(!iso||isNaN(d))return String(iso||'?');
  try{const q={};new Intl.DateTimeFormat('sk-SK',{timeZone:'Europe/Bratislava',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
    .formatToParts(d).forEach(x=>{q[x.type]=x.value;});return `${+q.day}. ${+q.month}. ${q.hour}:${q.minute}`;}
  catch(e){return d.toISOString().slice(0,16).replace('T',' ');}}
const relDay=d=>d>=999?'nikdy':d===0?'dnes':d===1?'včera':`pred ${d} d`;

/* ======================= história: prírastky ======================= */
/* Prírastok = súčet max(0, b-a) cez dvojice susedných dní; dvojica sa počíta len ak majú OBA riadky rovnakú
   metódu (oba v3 alebo oba staré). Prechod starý -> v3 je skok metódy, nie rast (user 25.10.: rast hneď, nie od zajtra). */
const sameMethod=(a,b)=>!!a.v3===!!b.v3;
function prepHist(h){return (Array.isArray(h)?h:[]).filter(r=>r&&typeof r.date==='string').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}
function windowRows(days){
  if(!HIST.length)return [];
  const last=HIST[HIST.length-1].date, cut=addDays(last,-days);
  let i=HIST.findIndex(r=>r.date>=cut); if(i<0)return [];
  if(HIST[i].date>cut&&i>0&&HIST[i-1].date>=addDays(cut,-4))i--;     // chýbajúci základný deň: vezmi najbližší skorší
  return HIST.slice(i);
}
function growthHint(){const v3=HIST.filter(r=>r.v3).length;return v3<2?'za 24 h od zajtra':'rast nie je z čoho spočítať';}
function pairsOf(rows){const o=[];for(let i=1;i<rows.length;i++)if(sameMethod(rows[i-1],rows[i]))o.push([rows[i-1],rows[i]]);return o;}
function facGain(a,b,name,k){
  const x=a.fac&&a.fac[name], y=b.fac&&b.fac[name]; if(!x||!y)return null;
  if(x[HO[k]]===false||y[HO[k]]===false)return null;          // dáta toho dňa nedorazili -> dvojicu nepočítaj
  const va=x[HV[k]], vb=y[HV[k]]; if(va==null||vb==null)return null;
  return Math.max(0,num(vb)-num(va));
}
function gainOver(rows,names,k){let s=0,n=0;
  for(const [a,b] of pairsOf(rows))for(const nm of names){const g=facGain(a,b,nm,k);if(g!=null){s+=g;n++;}}
  return n?s:null;}
function dailySeries(rows,names,ks){            // [{date, v:{k:number}|null}]
  const out=[];
  for(let i=1;i<rows.length;i++){
    const a=rows[i-1],b=rows[i];
    if(!sameMethod(a,b)){out.push({date:b.date,v:null});continue;}
    const v={};ks.forEach(k=>{let s=0;names.forEach(nm=>{const g=facGain(a,b,nm,k);if(g!=null)s+=g;});v[k]=s;});
    out.push({date:b.date,v});
  }
  return out;
}

/* ======================= model ======================= */
function buildModel(){
  const last=HIST[HIST.length-1];
  M=(DATA.projects||[]).map(p=>{
    const vids=(Array.isArray(p.videos)?p.videos:[]).map(v=>({...v,pl:platOf(v),views:num(v.views),likes:num(v.likes),comments:num(v.comments)}));
    const m={p,name:String(p.name||'?'),label:String(p.label||p.name||'?'),color:isHex(p.color)?p.color:'#8e97a7',vids};
    m.tot={};m.fol={};m.nc={};
    PL.forEach(k=>{
      const e=last&&last.fac&&last.fac[m.name], pv=p.views&&p.views[k];     // p.views = skutočný súčet zhliadnutí z data.json
      m.tot[k]=pv!=null?num(pv):(e&&e[HV[k]]!=null)?num(e[HV[k]]):vids.filter(v=>v.pl===k).reduce((s,v)=>s+v.views,0);
      m.nc[k]=!!(p.ok&&p.ok[k]===false&&m.tot[k]===0);                       // nepripojené: dáta nedorazili a nič nemáme
    });
    m.fol.youtube=num(p.yt&&p.yt.subs);m.fol.tiktok=num(p.tiktok&&p.tiktok.followers);m.fol.instagram=num(p.instagram&&p.instagram.followers);
    const pubs=vids.map(v=>String(v.published||'').slice(0,10)).filter(Boolean).sort().reverse();
    m.last=pubs[0]||null; m.age=ageDays(m.last);
    return m;
  });
  BY={};M.forEach(m=>{BY[m.name]=m;});
}
/* stav účtu: spojí ručný stav (p.status), stav pripojenia (p.conn) */
const ACC_LAB={ok:'pripojené',ban:'zablokovaný účet',riesit:'treba vyriešiť',nepouziva:'nepoužíva sa',token_error:'chyba tokenu',no_token:'chýba autorizácia',no_account:'nezaložený',cudzi:'cudzí účet (nepočíta sa)'};
const ACC_BAD=['ban','riesit','token_error','no_token'];
function acct(m,k){
  const st=m.p.status&&m.p.status[k], cn=m.p.conn&&m.p.conn[k];
  if(st&&(st.state==='ban'||st.state==='nepouziva'||st.state==='cudzi'))return {s:st.state,note:st.note||''};
  if(cn&&(cn.state==='token_error'||cn.state==='no_token'))return st&&st.state==='riesit'?{s:'riesit',note:st.note||cn.note||''}:{s:cn.state,note:cn.note||''};
  if(st&&st.state)return {s:st.state,note:st.note||''};
  if(cn&&cn.state==='no_account')return {s:'no_account',note:cn.note||''};
  return {s:'ok',note:''};
}
function showPlat(m,k){
  if(m.vids.some(v=>v.pl===k))return true;
  const has=k==='youtube'?m.p.yt:m.p[k];
  if(has)return true;
  const a=acct(m,k); return a.s!=='nepouziva'&&a.s!=='no_account';
}
function problems(){
  const out=[];
  M.forEach(m=>{const ks=PL.filter(k=>ACC_BAD.includes(acct(m,k).s));if(ks.length)out.push({m,ks});});
  return out;
}
const inPer=(m,n)=>m.vids.filter(v=>String(v.published||'').slice(0,10)>=pubCut(n));
function statusLine(m){
  if(!m.last)return 'zatiaľ nič nevydal';
  const w=inPer(m,7).length;
  if(m.age<=1&&w>=5)return 'vydáva denne';
  if(m.age<=7)return `vydáva · ${w} ${plw(w,'video','videá','videí')} za 7 dní`;
  return 'spí od '+sDate(m.last);
}

function openDrawer(name){
  if(!BY[name])return;

  if(!same){DS.name=name;DS.pl='all';DS.sort='date';DS.shown=30;}
  renderDrawer();
  $('#drawer').classList.add('open');$('#scrim').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');
  document.body.classList.add('lock');
  if(!same){const b=$('#drawer .x');if(b)b.focus({preventScroll:true});const bd=$('#dbody');if(bd)bd.scrollTop=0;}
}
function closeDrawer(silent){
  const d=$('#drawer');
  const was=d.classList.contains('open');
  d.classList.remove('open');$('#scrim').classList.remove('open');d.setAttribute('aria-hidden','true');
  document.body.classList.remove('lock');
  if(!silent&&/^#kanal=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search);
  if(was)DS.name=null;
}

const TOOLS=['komentare','spotify','episodary'];
let VIEW=null;
function showView(v){
  VIEW=v||null;
  $('#app').hidden=!!VIEW;$('#tools').hidden=!VIEW;
  TOOLS.forEach(x=>{const s=document.getElementById(x);if(s)s.hidden=x!==VIEW;});
  $$('nav a').forEach(a=>a.classList.toggle('on',VIEW?a.dataset.view===VIEW:a.dataset.view==='prehlad'));
  if(!VIEW)return;
  if(VIEW==='komentare')renderComments();else if(VIEW==='spotify')renderSpotify();else renderEpisodary();
  window.scrollTo(0,0);
}
function route(){
  const raw=location.hash.replace(/^#/,'');
  if(raw.startsWith('kanal=')){
    let n='';try{n=decodeURIComponent(raw.slice(6));}catch(e){}
    if(VIEW)showView(null);
    if(BY[n])openDrawer(n);else if(DATA)closeDrawer(true);
    return;
  }
  closeDrawer(true);
  const v=TOOLS.includes(raw)?raw:null;
  if(v!==VIEW)showView(v);
}
function fmtGen(g){const m=/^(\d\d)\.(\d\d)\.(\d{4}) (\d\d:\d\d)$/.exec(String(g||''));return m?`${+m[1]}. ${+m[2]}. ${m[3]} ${m[4]}`:String(g||'');}
async function load(){
  try{
    const [dRes,hRes]=await Promise.all([fetch('/data.json?'+Date.now()),fetch('/history.json?'+Date.now()).catch(()=>null)]);
    if(!dRes.ok)throw new Error('server vrátil '+dRes.status);
    const d=await dRes.json();
    DATA=(d&&typeof d==='object')?d:{};
    DATA.projects=Array.isArray(DATA.projects)?DATA.projects:[];DATA.totals=DATA.totals||{};
    let h=[];try{h=hRes&&hRes.ok?await hRes.json():[];}catch(e){}
    HIST=prepHist(h);
  }catch(e){
    $('#dt').textContent='chyba načítania';
    $('#app').innerHTML=`<div class="empty">Dáta sa nepodarilo načítať (${esc(e&&e.message||e)}).<br>Skontroluj, či beží <code>server.py</code>.<br><br><button class="btn" type="button" id="retry">Skúsiť znova</button></div>`;
    return;
  }
  $('#dt').textContent=DATA.gen_at?'aktualizované '+fmtGen(DATA.gen_at):'zatiaľ žiadne dáta';
  try{buildModel();renderOverview();}catch(e){console.error(e);$('#app').innerHTML=`<div class="empty">Chyba pri vykreslení (${esc(e&&e.message||e)}).</div>`;return;}
  if(DS.name&&$('#drawer').classList.contains('open'))renderDrawer();
  route();
}
async function refresh(){
  const b=$('#refresh');b.disabled=true;b.textContent='Obnovujem…';
  try{await fetch('/api/refresh?force=1');}catch(e){/* server nedostupný -> aspoň znova načítaj */}
  await load();b.disabled=false;b.textContent='Obnoviť';
}
function setPer(n){
  if(!PERS.includes(n))return;PER=n;
  try{localStorage.setItem('ff.per',String(n));}catch(e){}
  $$('#seg button').forEach(b=>b.classList.toggle('on',+b.dataset.per===PER));

  cb.innerHTML=`<div class="card empty"><span class="spin" aria-hidden="true"></span> Načítavam komentáre (Instagram a YouTube)…</div>`;
  try{
    const r=await fetch('/api/all_comments');
    const d=await r.json();
    if(d.error){cb.innerHTML=`<div class="card empty">Chyba: ${esc(d.error)}</div>`;return;}
    // IG: komentár s lajkom (ty si lajkol) = vybavený, preč. YT: zobraz všetky (read-only).
    const posts=(d.media||[]).map(m=>({...m,open:(m.comments||[]).filter(c=>m.platform==='youtube'?true:!(c.like_count>0))}))
                             .filter(m=>m.open.length);
    if(!posts.length){setBadge(0);cb.innerHTML=`<div class="card empty">Žiadne nevybavené komentáre.<br><span style="font-size:12.5px">Lajknuté IG komentáre sa odtiaľto strácajú automaticky.</span></div>`;return;}
    cb.innerHTML=`<div class="cposts">${posts.map(m=>{
      const yt=m.platform==='youtube';
      const fc=yt?{name:m.user||'YouTube',color:'var(--yt)'}:userFac(m.user);
      const link=safeUrl(m.permalink), mid=esc(m.id), u=esc(m.user||'');
      return `<article class="card cpost" id="post_${mid}">
        <div class="cphd"><span class="tag ${yt?'youtube':'instagram'}">${yt?'YT':'IG'}</span><b>${esc(fc.name)}</b>
          ${link?`<a class="cpl" href="${esc(link)}" target="_blank" rel="noopener noreferrer">${esc(m.caption)||'(príspevok)'}</a>`:`<span class="cpl">${esc(m.caption)||'(príspevok)'}</span>`}
          <span class="cpn">${m.open.length}</span></div>
        ${m.open.map(c=>{const cid=esc(c.id);return `<div class="cm" id="cm_${cid}">
          <div class="cmt"><span class="cu">@${esc(c.username||'?')}</span> ${esc(c.text||'')}</div>
          ${yt?`<div class="creply">${link?`<a class="btn gh sm" href="${esc(link)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">Odpovedať na YouTube ↗</a>`:''}
              <button class="btn gh sm" type="button" data-ca="done" data-c="${cid}" data-p="${mid}">Vybavené</button></div>`
            :`<div class="creply"><input class="cin" placeholder="Odpoveď…" aria-label="Odpoveď na komentár" id="r_${cid}">
              <button class="btn sm" type="button" data-ca="reply" data-u="${u}" data-c="${cid}" data-p="${mid}">Odpovedať</button>
              <button class="btn gh sm" type="button" data-ca="hide" data-u="${u}" data-c="${cid}" data-p="${mid}">Skryť</button>
              <button class="btn gh sm" type="button" data-ca="done" data-c="${cid}" data-p="${mid}">Vybavené</button></div>`}
        </div>`;}).join('')}
      </article>`;}).join('')}</div>`;
    setBadge($$('#cbody .cm').length);
  }catch(e){cb.innerHTML=`<div class="card empty">Chyba spojenia: ${esc(''+e)}</div>`;}
}
async function markAllShown(){          // hromadne: všetky práve zobrazené komentáre -> vybavené
  const cms=$$('#cbody .cm');
  if(!cms.length){alert('Najprv načítaj komentáre.');return;}
  if(!confirm('Označiť všetkých '+cms.length+' zobrazených komentárov ako vybavené? YouTube komentáre sa nemažú, len zmiznú z dashboardu.'))return;
  let ok=0;
  for(const el of cms){
    const cid=el.id.replace(/^cm_/,'');
    try{await fetch('/api/comment_done',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comment_id:cid})});ok++;}catch(e){}
  }
  setBadge(0);
  $('#cbody').innerHTML=`<div class="card empty">Hotovo, ${ok} ${plw(ok,'komentár označený','komentáre označené','komentárov označených')} ako vybavené.</div>`;
}
function dropComment(cid,pid){          // odstráni komentár; ak je príspevok prázdny, odstráni aj príspevok
  const el=document.getElementById('cm_'+cid); if(el)el.remove();
  const post=document.getElementById('post_'+pid); if(post&&!post.querySelector('.cm'))post.remove();
  if(!$('#cbody').querySelector('.cpost'))$('#cbody').innerHTML='<div class="card empty">Žiadne nevybavené komentáre.</div>';
  setBadge($$('#cbody .cm').length);
}
async function markDone(cid,pid){       // „Vybavené“ -> trvalo zmizne z dashboardu (aj po reload/reštarte)
  try{await fetch('/api/comment_done',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({comment_id:cid})});}catch(e){}
  dropComment(cid,pid);
}
async function sendReply(user,cid,pid){
  const inp=document.getElementById('r_'+cid); const msg=inp.value.trim(); if(!msg)return;
  inp.disabled=true; inp.placeholder='…';
  try{
    const r=await fetch('/api/reply',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user,comment_id:cid,message:msg})});
    const d=await r.json();
    if(d.ok){dropComment(cid,pid);return;}       // odpovedané -> automaticky preč
    alert('Chyba: '+(d.error||'?'));
  }catch(e){alert('Chyba spojenia: '+e);}
  inp.disabled=false;inp.placeholder='Odpoveď…';
}
async function hideC(user,cid,pid){
  try{
    const r=await fetch('/api/hide',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user,comment_id:cid,hide:true})});
    const d=await r.json();
    if(d.ok){dropComment(cid,pid);} else alert('Chyba: '+(d.error||'?'));
  }catch(e){alert('Chyba spojenia: '+e);}
}
function commentAction(b){
  const a=b.dataset.ca, u=b.dataset.u, c=b.dataset.c, p=b.dataset.p;
  if(a==='load')loadComments(); else if(a==='all')markAllShown();
  else if(a==='done')markDone(c,p); else if(a==='reply')sendReply(u,c,p); else if(a==='hide')hideC(u,c,p);
}

/* --- Spotify + Episodary (samostatne, mimo faceless analytiky) --- */
async function fetchJson(u){try{const r=await fetch(u+'?'+Date.now());return r.ok?await r.json():null;}catch(e){return null;}}
function miniBars(items,color){
  if(!items||items.length<2)return '<div class="tnote">Graf sa zapne po 2+ dňoch zberu (beží denne).</div>';
  const mx=Math.max(1,...items.map(i=>i.v));
  return `<div class="mbars" style="--c:${color}">${items.map(i=>
    `<div class="mb"><span class="mv">${f(i.v)}</span><div class="mbw"><i title="${esc(i.n)}: ${esc(i.v)}" style="height:${Math.max(3,i.v/mx*100)}%"></i></div><span class="mn">${esc(i.n)}</span></div>`).join('')}</div>`;
}
function hbars(rows,color){             // [[popis, hodnota, odkaz?]]
  const mx=Math.max(1,...rows.map(r=>r[1]||0));
  return `<div style="--c:${color}">${rows.map(r=>`<div class="hbr"><span class="hn">${r[2]?`<a href="${esc(r[2])}" target="_blank" rel="noopener noreferrer">${r[0]}</a>`:r[0]}</span>
    <span class="ht"><i style="width:${(r[1]||0)/mx*100}%"></i></span><span class="hv">${fx(r[1]||0)}</span></div>`).join('')}</div>`;
}
const kband=kp=>`<div class="card tband">${kp.map(k=>`<div><div class="lab">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>`;
const tload=t=>`<div class="card empty"><span class="spin" aria-hidden="true"></span> Načítavam ${t}…</div>`;
async function renderSpotify(){
  const el=$('#spotify'), C='#1DB954', H=tvHead('Spotify','Lumora · streaming. Verejné Spotify API: sledovatelia, popularita a katalóg.');
  el.innerHTML=H+tload('Spotify');
  const d=await fetchJson('/spotify.json'); const hist=(await fetchJson('/spotify_history.json'))||[];
  if(VIEW!=='spotify')return;
  const err=d&&d.error?`<div class="warnt" style="margin-top:10px;font-size:13px">${esc(d.error)}</div>`:'';
  if(!d||!d.configured){el.innerHTML=H+`<div class="card empty">Spotify nie je pripojený.<br><span style="font-size:12.5px">Do dashboard secrets pridaj <code>SPOTIFY_CLIENT_ID</code>, <code>SPOTIFY_CLIENT_SECRET</code> a <code>SPOTIFY_ARTIST_ID</code>.</span>${err}</div>`;return;}
  if(!d.found){el.innerHTML=H+`<div class="card empty">Lumora sa na Spotify nenašla. Ešte nie je live, alebo je zlé <code>SPOTIFY_ARTIST_ID</code>.${err}</div>`;return;}
  const a=d.artist||{};
  const kp=[['Sledovatelia',fx(a.followers),'Spotify'],['Popularita',fx(a.popularity)+' / 100','reach skóre'],['Albumy',(d.albums||[]).length,'vydané'],['Top skladby',(d.top_tracks||[]).length,'najhranejšie']];
  const trend=hist.slice(-14).map(h=>({n:(h.date||'').slice(5),v:h.followers||0}));
  const tracks=(d.top_tracks||[]).slice(0,10);
  const albs=(d.albums||[]).slice(0,12).map(al=>{const u=safeUrl(al.url),img=safeUrl(al.image);
    return `<a class="alb" ${u?`href="${esc(u)}" target="_blank" rel="noopener noreferrer"`:''}>${img?`<img src="${esc(img)}" width="52" height="52" alt="" loading="lazy">`:'<span class="ai"></span>'}
    <span class="at"><b>${esc(al.name)}</b><small>${esc(al.type)} · ${esc(al.tracks)} skladieb · ${esc((al.release||'').slice(0,4))}</small></span></a>`;}).join('');
  const au=safeUrl(a.url), ai=safeUrl(a.image);
  el.innerHTML=H+kband(kp)+`
    <div class="card tart">${ai?`<img src="${esc(ai)}" width="72" height="72" alt="">`:''}
      <div style="min-width:0"><h3>${au?`<a href="${esc(au)}" target="_blank" rel="noopener noreferrer" style="color:${C}">${esc(a.name)} ↗</a>`:esc(a.name)}</h3>
      <div class="mute" style="font-size:13px">${(a.genres||[]).map(esc).join(' · ')||'žánre neuvedené'}</div></div></div>
    <div class="row2">
      <div class="card box"><h3>Sledovatelia <small>po dňoch</small></h3>${miniBars(trend,C)}</div>
      <div class="card box"><h3>Najhranejšie skladby <small>popularita 0 až 100</small></h3>${tracks.length?hbars(tracks.map((t,i)=>[`${i+1}. ${esc(t.name)}`,t.popularity||0,safeUrl(t.url)]),C):'<div class="tnote">Žiadne skladby.</div>'}</div></div>
    <div class="card box" style="margin-top:12px"><h3>Katalóg</h3>${albs?`<div class="albs">${albs}</div>`:'<div class="tnote">Žiadne albumy.</div>'}</div>
    <p class="tnote" style="margin-top:14px">Verejné Spotify API nedáva presné streamy (tie má len Spotify for Artists). Sledovatelia, popularita a katalóg sú jediné verejné signály.</p>`;
}
async function renderEpisodary(){
  const el=$('#episodary'), C='#7c7ff5', H=tvHead('Episodary','Používatelia a aktivita appky. Len agregáty z Episodary DB, žiadne osobné dáta.');
  el.innerHTML=H+tload('Episodary');
  const d=await fetchJson('/episodary.json'); const hist=(await fetchJson('/episodary_history.json'))||[];
  if(VIEW!=='episodary')return;
  if(!d||!d.configured){const e=d&&d.error?`<div class="warnt" style="margin-top:10px;font-size:13px">${esc(d.error)}</div>`:'';
    el.innerHTML=H+`<div class="card empty">Episodary nie je pripojené.<br><span style="font-size:12.5px">Do dashboard secrets pridaj <code>EPISODARY_URL</code> a <code>EPISODARY_SECRET</code> (= CRON_SECRET z Episodary Vercel env).</span>${e}</div>`;return;}
  const u=d.users||{}, ac=d.active||{}, pf=d.platform||{};
  const kp=[['Používatelia',fx(u.total||0),`+${fx(u.new24h||0)} za 24 h · +${fx(u.new7d||0)} za 7 d`],
    ['Aktívni za mesiac',fx(ac.mau||0),'MAU · niečo spravili'],
    ['Aktívni za týždeň',fx(ac.wau||0),`dnes ${fx(ac.dau||0)} DAU`],
    ['Premium',fx(u.premium||0),'platiaci']];
  const appTracked=pf.appUsers!=null;
  const web=appTracked?(pf.webUsers||0):(u.total||0);
  const app=appTracked?(pf.appUsers||0):(pf.installs||0);
  const dl=pf.storeDownloads;
  const plat=[['Web',fx(web),'cez prehliadač'],
    ['App',fx(app),appTracked?'nainštalovaná appka':'PWA inštalácie (push)'],
    ['Stiahnutia',dl==null?'?':fx(dl),pf.storePublished?'zo store':'appka ešte nie je v store']];
  const trend=hist.slice(-14).map(h=>({n:(h.date||'').slice(5),v:h.users||0}));
  const ab=[['Dnes (DAU)',ac.dau||0],['Tento týždeň (WAU)',ac.wau||0],['Tento mesiac (MAU)',ac.mau||0],['Prihlásené zariadenia',ac.liveSessions||0]];
  el.innerHTML=H+kband(kp)+`
    <div class="card box" style="margin-top:12px"><h3>Web vs. app <small>rozdelenie a stiahnutia</small></h3>
      <div class="tplat">${plat.map(k=>`<div><div class="lab">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
      <p class="tnote">Android appka ešte nie je v store (0 stiahnutí). „App“ = PWA inštalácie (zariadenia s push). Presné rozdelenie návštev web vs. app je vo Vercel Analytics (tag <code>utm_source=pwa</code>).</p></div>
    <div class="row2">
      <div class="card box"><h3>Používatelia <small>po dňoch</small></h3>${miniBars(trend,C)}</div>
      <div class="card box"><h3>Aktivita</h3>${hbars(ab,C)}</div></div>
    <p class="tnote" style="margin-top:14px">Aktualizované: ${d.generatedAt?esc(fmtStamp(d.generatedAt)):'?'} · z Episodary DB (len agregáty, žiadne osobné dáta).</p>`;
}
async function checkTools(){                     // zašedni záložku nepripojeného nástroja
  for(const [id,u] of [['spotify','/spotify.json'],['episodary','/episodary.json']]){
    const d=await fetchJson(u), a=$(`nav a[data-view="${id}"]`);
    if(a&&d&&!d.configured){a.classList.add('off');a.title='nie je pripojený';}
  }
}

/* ======================= udalosti ======================= */
document.addEventListener('click',ev=>{
  const t=ev.target;
  const pr=t.closest('[data-per]'); if(pr){setPer(+pr.dataset.per);return;}
  const ca=t.closest('[data-ca]'); if(ca){commentAction(ca);return;}
  if(t.closest('#retry')){load();return;}
  if(t.closest('[data-close]')||t.id==='scrim'){closeDrawer(false);return;}
  const pf=t.closest('[data-pf]'); if(pf){DS.pl=pf.dataset.pf;DS.shown=30;renderDrawer();return;}
  const ps=t.closest('[data-ps]'); if(ps){DS.sort=ps.dataset.ps;DS.shown=30;renderDrawer();return;}
  if(t.closest('[data-more]')){DS.shown+=30;const y=$('#dbody').scrollTop;renderDrawer();$('#dbody').scrollTop=y;return;}
  if(t.closest('#slsep')){SL_OPEN=!SL_OPEN;renderOverview();return;}
  if(t.closest('a[href]'))return;
  const o=t.closest('[data-open]'); if(o){location.hash='#kanal='+encodeURIComponent(o.dataset.open);return;}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&$('#drawer').classList.contains('open')){closeDrawer(false);return;}
  if(ev.key==='Enter'&&ev.target.classList&&ev.target.classList.contains('r')&&ev.target.dataset.open){location.hash='#kanal='+encodeURIComponent(ev.target.dataset.open);}
});
window.addEventListener('hashchange',route);
$('#refresh').addEventListener('click',refresh);
$$('#seg button').forEach(b=>b.classList.toggle('on',+b.dataset.per===PER));
route();
checkTools();
load();
